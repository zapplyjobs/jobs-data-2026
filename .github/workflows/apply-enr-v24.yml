name: Apply ENR-23 Batch (v24)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [apply-enr-v24]

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decrypt repository secrets
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/git-crypt-key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/git-crypt-key
          rm /tmp/git-crypt-key

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Apply patch script
        run: |
          cat > /tmp/patch-v24.js << 'PATCHEOF'

const fs = require('fs');
const path = require('path');
const f = path.join(__dirname, '..', 'scripts', 'enrich-jobs.js');
let code = fs.readFileSync(f, 'utf8');
const changes = [];

// Change 9: Version bump 23 → 24
if (code.includes('ENRICHER_VERSION = 23')) {
  code = code.replace('ENRICHER_VERSION = 23', 'ENRICHER_VERSION = 24');
  changes.push('version 23->24');
} else if (code.includes('ENRICHER_VERSION = 24')) {
  console.log('Version already 24, skipping bump');
} else {
  console.error('ERROR: Cannot find ENRICHER_VERSION declaration');
  process.exit(1);
}

// Change 1: Remove SR bypass - remove the special SR condition
if (code.includes("j.source !== 'smartrecruiters' && descriptionsMap.has(j.id)")) {
  code = code.replace(
    "j.source !== 'smartrecruiters' && descriptionsMap.has(j.id)",
    "descriptionsMap.has(j.id)"
  );
  // Also remove the bypass comment block (4 lines above)
  code = code.replace(/\/\/ ENR-19 bypass:.*?\n\/\/ re-fetched with qualifications.*?\n\/\/ Remove after.*?\n\/\/\n/gs, '');
  changes.push('SR bypass removed');
} else {
  console.log('SR bypass pattern not found (may already be removed)');
}

// Change 2: Add 7 LCA aliases
const newAliases = [
  ["'HPE (University)'", "'Hewlett Packard Enterprise'"],
  ["'Cadence (University)'", "'Cadence Design'"],
  ["'The Hartford'", "'Hartford Fire Insurance'"],
  ["'Warner Bros. Discovery'", "'WarnerMedia'"],
  ["'Prudential Financial'", "'The Prudential Insurance of America'"],
  ["'GE Aerospace'", "'General Electric'"],
  ["'Freddie Mac'", "'Federal Home Loan Mortgage'"],
];
// Find the LCA_COMPANY_ALIASES object and append
const aliasBlock = newAliases.map(a => `    ${a[0]}: ${a[1]},`).join('\n');
// Find last entry in LCA_COMPANY_ALIASES before closing brace
const aliasMatch = code.match(/const LCA_COMPANY_ALIASES\s*=\s*\{[\s\S]*?\n\}/);
if (aliasMatch) {
  const oldBlock = aliasMatch[0];
  // Check if any alias already exists
  const existing = newAliases.filter(a => oldBlock.includes(a[0]));
  if (existing.length > 0) {
    console.log(`Aliases already present: ${existing.map(a => a[0]).join(', ')}`);
  } else {
    const newBlock = oldBlock.replace(/\n\}/, '\n' + aliasBlock + '\n}');
    code = code.replace(oldBlock, newBlock);
    changes.push('7 LCA aliases added');
  }
} else {
  console.error('ERROR: Cannot find LCA_COMPANY_ALIASES');
  process.exit(1);
}

// Change 3: Add "high school degree" to DEGREE_NONE regex
if (code.includes('high school diploma') && !code.includes('high school (diploma|degree)')) {
  code = code.replace('high school diploma', 'high school (diploma|degree)');
  changes.push('high school degree regex');
} else if (code.includes('high school (diploma|degree)')) {
  console.log('high school degree pattern already present');
} else {
  console.error('ERROR: Cannot find DEGREE_NONE regex');
  process.exit(1);
}

// Change 6: Experience year cap >20
// Find the extractExperienceLevel function and add the cap after year parsing
if (!code.includes('years > 20')) {
  // Find the pattern where years are parsed and add the cap
  // Look for common year parsing patterns
  const patterns = [
    /const years = parseInt\(m\[1\], 10\);/,
    /years = parseInt\(m\[1\], 10\);/,
    /var years = parseInt/,
  ];
  let patched = false;
  for (const pat of patterns) {
    if (pat.test(code)) {
      // Add cap after the first match of year parsing
      code = code.replace(pat, (match) => {
        return match + '\n      if (years > 20) return null;  // Company-history boilerplate cap (S268)';
      });
      patched = true;
      changes.push('experience >20 cap');
      break;
    }
  }
  if (!patched) {
    console.log('Could not find year parsing pattern for >20 cap');
  }
} else {
  console.log('years > 20 cap already present');
}

// Change 7c: Fix visa_pct in by_company stats to count all visa signals
if (code.includes("record.sponsors_visa === true") && code.includes("stats.visa_count++")) {
  // Check if already fixed
  if (!code.includes("record.possible_sponsor === true || record.visa_question_present")) {
    code = code.replace(
      /if \(record\.sponsors_visa === true\) stats\.visa_count\+\+/g,
      "if (record.sponsors_visa === true || record.possible_sponsor === true || record.visa_question_present === true) stats.visa_count++"
    );
    changes.push('visa_pct fix (all signals)');
  } else {
    console.log('visa_pct already counts all signals');
  }
} else {
  console.log('visa_count pattern not found for fix');
}

// Write back
fs.writeFileSync(f, code, 'utf8');
console.log('Changes applied: ' + changes.join(', '));
console.log('Total changes: ' + changes.length);

PATCHEOF
          node /tmp/patch-v24.js

      - name: Verify version bump
        run: |
          VERSION=$(grep 'ENRICHER_VERSION' .github/scripts/enrich-jobs.js | head -1)
          echo "Enricher version: $VERSION"
          echo "$VERSION" | grep -q '24' || (echo "ERROR: Version not bumped to 24!" && exit 1)

      - name: Commit and push
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          git add .github/scripts/enrich-jobs.js
          git commit -m "fix(enr): ENR-23 batch commit — v23→v24

- Remove SR re-fetch bypass (descriptions now current)
- Add 7 LCA aliases (+109 visa jobs)
- Add 'high school degree' to DEGREE_NONE regex (+22 jobs)
- Experience year cap >20 (company-history boilerplate)
- Fix visa_pct to count all signal types
- Taxonomy FP removals (separate commit c0aa710)
- Version bump v23→v24 triggers re-enrichment"
          for i in 1 2 3; do
            git -c filter.git-crypt.smudge=cat -c filter.git-crypt.clean=cat -c filter.git-crypt.required=false pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

      - name: Self-delete workflow
        if: success()
        run: |
          git rm .github/workflows/apply-enr-v24.yml
          git commit -m "chore: remove temp workflow"
          for i in 1 2 3; do
            git -c filter.git-crypt.smudge=cat -c filter.git-crypt.clean=cat -c filter.git-crypt.required=false pull --rebase origin main && git push && break
            sleep 5
          done
