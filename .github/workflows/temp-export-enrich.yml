name: Export enrich-jobs

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/git-crypt-key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/git-crypt-key
          rm /tmp/git-crypt-key

      - name: Export enrich-jobs.js
        run: |
          cat .github/scripts/enrich-jobs.js | base64

      - name: Create issue with content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONTENT=$(cat .github/scripts/enrich-jobs.js | base64 -w 0)
          gh issue create --title "enrich-jobs-export-$(date +%Y%m%d%H%M%S)" --body "$CONTENT" || true
