name: publish-metrics-to-supabase

# Publishes pipeline metric blobs to the Supabase pipeline_metrics table (which the
# dashboard reads). Moved from job-board-processing (private, billing blocked) to
# jobs-data-2026 (public, free Actions) — INF-LEVELDATA-1 / billing fix 2026-07-16.
#
# The publish script lives in the job-board-processing submodule (checked out at
# .github/scripts/processing/). R2 secrets are already set on this repo.
# REQUIRED SECRET: PUBLISH_SECRET (same value as on job-board-processing).

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-metrics-to-supabase.yml'
  # schedule removed (Phase 1): collect-metrics + post-to-discord now publish directly.
  # This workflow stays as dispatch-only backup (triggered by collect-metrics wave link).

permissions:
  contents: read

concurrency:
  group: publish-metrics-to-supabase
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jobs-data-2026 with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt (vendored action — immune to raw-CDN 429s, INF-TRANSCRYPT-ACTION-1)
        uses: zapplyjobs/.github/actions/setup-transcrypt@afcb5f41ec28fe10cefcf421fc455d0d89588b1f

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true

          # Verify submodule decryption succeeded (INF-TRANSCRYPT-KEY-BACKUP-1).
          SAMPLE_JS=$(find .github/scripts -name '*.js' -print -quit 2>/dev/null)
          if [ -n "$SAMPLE_JS" ]; then
            if ! file -b "$SAMPLE_JS" | grep -qiE 'ASCII|UTF-8|text'; then
              echo "::error::Submodule decryption FAILED — $SAMPLE_JS is ciphertext. Pipeline would run garbage. Check TRANSCRYPT_PASSWORD + transcrypt unlock."
              exit 1
            fi
          fi
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install processing submodule dependencies
        run: cd .github/scripts/processing && npm ci

      - name: Fetch metric blobs from R2 (canonical)
        # TAG-TAGHISTORY-FROZEN-1: r2-fetch-metrics.js reads R2 (data/ prefix) — the
        # R2-elim-era Storage reads served frozen mirrors over the fresh R2-sourced
        # row every cycle. bridge-metrics.json still comes from Storage (bridge
        # worker is its only writer) — see the script header.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node .github/scripts/processing/scripts/r2-fetch-metrics.js .github/data

      - name: POST metric blobs to the Supabase Edge Function
        run: node .github/scripts/processing/lib/publish-metrics-to-edge.js --data-dir .github/data
        env:
          EDGE_FUNCTION_URL: https://xxmhgagpbxjflajoaahy.supabase.co/functions/v1/publish-metrics-function
          PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}
