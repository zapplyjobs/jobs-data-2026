name: SUP Aspect Status (verified)
# Publishes SUP's aspect-status as MACHINE-VERIFIED objective checks.
# CI-runnable aspects (verification, monitoring, security) run live;
# workspace-dependent aspects carry forward from last manual run.
# INF-ASPECT-CADENCE-1: wires SUP to the 6h schedule (matching OUT's cadence).
on:
  schedule:
    - cron: '0 * * * *'  # every hour — script is just API calls, negligible cost
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/verify-sup-aspect-status.py'
      - '.github/workflows/publish-sup-aspect-status.yml'

permissions:
  contents: read

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Checkout job-board-aggregator (for company-list content validation)
        # INF-ASPECT-DATAQUALITY-VALIDATOR-1: company-list.json is transcrypt-encrypted
        # at rest, so c_data_quality validates the checked-out+unlocked copy at _agg/.
        # Non-fatal — if this fails, c_data_quality falls back to the freshness proxy.
        uses: actions/checkout@v5
        with:
          repository: zapplyjobs/job-board-aggregator
          path: _agg
          token: ${{ secrets.GH_PAT }}
        continue-on-error: true

      - name: Unlock aggregator (transcrypt) so company-list.json is readable
        continue-on-error: true
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}
        run: |
          if [ ! -d _agg ]; then echo "aggregator checkout absent — c_data_quality will use freshness fallback"; exit 0; fi
          # INF-UNLOCK-INTERMITTENT-1: fail on HTTP errors + verify it's a script (silent 429-page install class)
          for i in 1 2 3; do
            curl -sfSL "https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt" -o /tmp/transcrypt && break
            sleep 15
          done
          head -c2 /tmp/transcrypt | grep -q '#!' || { echo "::error::transcrypt download is not a script"; exit 1; }
          chmod +x /tmp/transcrypt && sudo mv /tmp/transcrypt /usr/local/bin/transcrypt
          cd _agg
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          if file -b lib/fetchers/company-list.json | grep -qiE 'ASCII|UTF-8|text'; then
            echo "company-list.json decrypted OK — c_data_quality will validate content"
          else
            echo "::warning::company-list.json still ciphertext — c_data_quality will fall back to freshness"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run verifier
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DATA_PROXY_TOKEN: ${{ secrets.DATA_PROXY_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          pip install -q boto3
          python3 .github/scripts/verify-sup-aspect-status.py --publish > sup-aspect-status.json
          python3 - <<'PY'
          import json, os
          d = json.load(open('sup-aspect-status.json'))
          counts = {}
          lines = [f"## SUP Aspect Status (verified)\n\ngenerated {d['generated_at'][:19]}\n"]
          for k, v in d['aspects'].items():
              counts[v['status']] = counts.get(v['status'], 0) + 1
              lines.append(f"- **{k}**: {v['status']} — {v['evidence']}")
          lines.append(f"\n**Summary: {counts}**")
          summary = "\n".join(lines) + "\n"
          print(summary)
          gss = os.environ.get('GITHUB_STEP_SUMMARY')
          if gss:
              open(gss, 'a').write(summary)
          PY

      - name: Upload to Supabase Storage
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sf -X PUT "${SUPABASE_URL}/storage/v1/object/pipeline-data/sup-aspect-status.json" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @sup-aspect-status.json \
            && echo "uploaded sup-aspect-status.json to Storage" \
            || echo "Storage upload failed (non-blocking)"
