name: SUP Yield Decay Monitor

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sup-yield-decay
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt (vendored action — immune to raw-CDN 429s, INF-TRANSCRYPT-ACTION-1)
        uses: zapplyjobs/.github/actions/setup-transcrypt@afcb5f41ec28fe10cefcf421fc455d0d89588b1f

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- . 2>/dev/null || true
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true

          # Verify submodule decryption succeeded (INF-TRANSCRYPT-KEY-BACKUP-1).
          SAMPLE_JS=$(find .github/scripts -name '*.js' -print -quit 2>/dev/null)
          if [ -n "$SAMPLE_JS" ]; then
            if ! file -b "$SAMPLE_JS" | grep -qiE 'ASCII|UTF-8|text'; then
              echo "::error::Submodule decryption FAILED — $SAMPLE_JS is ciphertext. Pipeline would run garbage. Check TRANSCRYPT_PASSWORD + transcrypt unlock."
              exit 1
            fi
          fi
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Install processing submodule dependencies
        run: cd .github/scripts/processing && npm ci || npm install
      - name: Freshness gate (SUP-YIELDDECAY-FRESHNESS-GATE-1 — 3h; derived from ~15-20min producer cadence)
        id: freshness
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          node -e "
          const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
          const { checkFreshness } = require('./.github/scripts/processing/lib/storage/freshness-gate');
          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            const fresh = await checkFreshness({ r2, limitMinutes: 180, label: 'sup-yield-decay' });
            if (!fresh) { console.log('::warning::sup-yield-decay monitor SKIPPED — stale all_jobs.json would poison the 21-day rolling baseline'); }
          }
          main().catch(e => { console.error('gate fatal: ' + e.message); process.exit(1); });
          "

      - name: Download company-research-log.csv from Supabase Storage
        if: steps.freshness.outputs.pipeline_fresh == 'true'
        run: |
          curl -sf -o .github/data/company-research-log.csv \
            'https://xxmhgagpbxjflajoaahy.supabase.co/storage/v1/object/public/pipeline-data/company-research-log.csv' \
            && echo "CSV downloaded: $(wc -l < .github/data/company-research-log.csv) lines" \
            || { echo "FAILED to download CSV"; exit 1; }

      - name: Download all_jobs.json from R2 (canonical object store)
        if: steps.freshness.outputs.pipeline_fresh == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          pip install -q boto3
          python3 -c "import boto3, os; s3 = boto3.client('s3', region_name='auto', endpoint_url=os.environ['R2_ENDPOINT'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']); s3.download_file(os.environ['R2_BUCKET_NAME'], 'data/all_jobs.json', '.github/data/all_jobs.json'); print('Downloaded all_jobs.json from R2 (' + str(os.path.getsize('.github/data/all_jobs.json')) + ' bytes)')"

      - name: Download decay baseline from R2 (rolling snapshot store)
        if: steps.freshness.outputs.pipeline_fresh == 'true'
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          pip install -q boto3
          python3 -c "import boto3, os; s3 = boto3.client('s3', region_name='auto', endpoint_url=os.environ['R2_ENDPOINT'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']); s3.download_file(os.environ['R2_BUCKET_NAME'], 'data/sup-decay-baseline.json', '.github/data/sup-decay-baseline.json'); print('Downloaded sup-decay-baseline.json from R2')"


      - name: Download jobs-metadata + tenants projection from R2 (new-tenant gap-check inputs)
        if: steps.freshness.outputs.pipeline_fresh == 'true'
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          pip install -q boto3
          python3 -c "import boto3, os; s3 = boto3.client('s3', region_name='auto', endpoint_url=os.environ['R2_ENDPOINT'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']); s3.download_file(os.environ['R2_BUCKET_NAME'], 'data/jobs-metadata.json', '.github/data/jobs-metadata.json'); print('Downloaded jobs-metadata.json')"
          python3 -c "import boto3, os; s3 = boto3.client('s3', region_name='auto', endpoint_url=os.environ['R2_ENDPOINT'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']); s3.download_file(os.environ['R2_BUCKET_NAME'], 'data/sup_tenants.json', '.github/data/sup_tenants.json'); print('Downloaded sup_tenants.json')"

      - name: Run yield decay monitor
        if: steps.freshness.outputs.pipeline_fresh == 'true'
        run: |
          node .github/scripts/processing/lib/sup-yield-decay-monitor.js \
            --csv .github/data/company-research-log.csv \
            --jobs .github/data/all_jobs.json \
            --write .github/data/sup_yield_decay_monitor.json \
            --baseline-file .github/data/sup-decay-baseline.json \
            --metadata .github/data/jobs-metadata.json \
            --company-list .github/data/sup_tenants.json \
            --json

      - name: Company visa-posture artifact (SUP-VISA-COMPANY-POSTURE-1)
        if: steps.freshness.outputs.pipeline_fresh == 'true'
        run: |
          pip install -q boto3
          python3 -c "import boto3, os; s3 = boto3.client('s3', region_name='auto', endpoint_url=os.environ['R2_ENDPOINT'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']); s3.download_file(os.environ['R2_BUCKET_NAME'], 'data/enrichment-stats.json', '.github/data/enrichment-stats.json'); s3.download_file(os.environ['R2_BUCKET_NAME'], 'data/lca-sponsors.json', '.github/data/lca-sponsors.json'); print('Downloaded posture inputs')"
          node .github/scripts/processing/lib/sup-company-posture.js \
            --stats .github/data/enrichment-stats.json \
            --lca .github/data/lca-sponsors.json \
            --out .github/data/sup-company-posture.json
          python3 -c "import boto3, os; s3 = boto3.client('s3', region_name='auto', endpoint_url=os.environ['R2_ENDPOINT'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']); s3.put_object(Bucket=os.environ['R2_BUCKET_NAME'], Key='data/sup-company-posture.json', Body=open('.github/data/sup-company-posture.json','rb').read(), ContentType='application/json'); print('uploaded data/sup-company-posture.json to R2')"
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Posting archive ledger (SUP-POLICY-DECISIONS-2026-09-02 §7)
        if: steps.freshness.outputs.pipeline_fresh == 'true'
        run: |
          pip install -q boto3
          python3 -c "import boto3, os; s3 = boto3.client('s3', region_name='auto', endpoint_url=os.environ['R2_ENDPOINT'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']);
          try:
              s3.download_file(os.environ['R2_BUCKET_NAME'], 'data/sup-posting-ledger.jsonl', '.github/data/sup-posting-ledger.prev.jsonl'); print('Downloaded previous ledger')
          except Exception as e:
              print('No previous ledger (first run) — seeding from scratch:', e)"
          node .github/scripts/processing/lib/sup-posting-ledger.js \
            --pool .github/data/all_jobs.json \
            --prev .github/data/sup-posting-ledger.prev.jsonl \
            --out .github/data/sup-posting-ledger.jsonl \
            --stats .github/data/sup-posting-ledger-stats.json
          python3 -c "import boto3, os; s3 = boto3.client('s3', region_name='auto', endpoint_url=os.environ['R2_ENDPOINT'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']);
          s3.put_object(Bucket=os.environ['R2_BUCKET_NAME'], Key='data/sup-posting-ledger.jsonl', Body=open('.github/data/sup-posting-ledger.jsonl','rb').read(), ContentType='application/x-ndjson')
          s3.put_object(Bucket=os.environ['R2_BUCKET_NAME'], Key='data/sup-posting-ledger-stats.json', Body=open('.github/data/sup-posting-ledger-stats.json','rb').read(), ContentType='application/json')
          print('uploaded data/sup-posting-ledger.jsonl + stats to R2')"
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Refresh CSV auto-fields (SUP-CSV-AUTOFIELDS-REFRESH-1 — F4)
        if: steps.freshness.outputs.pipeline_fresh == 'true'
        run: |
          python3 .github/scripts/processing/lib/csv-enrich-refresh.py \
            --csv .github/data/company-research-log.csv \
            --data-dir .github/data
          echo "CSV auto-fields refreshed ($(grep -c '2026-' /dev/null || true); stamps verified below)"
        env:
          SUPABASE_URL: https://xxmhgagpbxjflajoaahy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload refreshed CSV back to Supabase Storage
        if: steps.freshness.outputs.pipeline_fresh == 'true'
        run: |
          curl -sf -X POST \
            'https://xxmhgagpbxjflajoaahy.supabase.co/storage/v1/object/pipeline-data/company-research-log.csv' \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: text/csv" \
            -H "x-upsert: true" \
            --data-binary @.github/data/company-research-log.csv \
            && echo "Refreshed CSV uploaded to Storage" \
            || { echo "::error::CSV upload FAILED — Storage would silently stay stale (SSOT surface; do not swallow)"; exit 1; }

      - name: Download jobs-metadata.json from R2 (parity input)
        if: steps.freshness.outputs.pipeline_fresh == 'true'
        run: |
          pip install -q boto3
          python3 -c "import boto3, os; s3 = boto3.client('s3', region_name='auto', endpoint_url=os.environ['R2_ENDPOINT'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']); s3.download_file(os.environ['R2_BUCKET_NAME'], 'data/jobs-metadata.json', '.github/data/jobs-metadata.json'); print('Downloaded jobs-metadata.json')"
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Run source-parity monitor (L1 — SUP-SOURCE-PARITY-MONITOR-1)
        id: parity
        if: steps.freshness.outputs.pipeline_fresh == 'true'
        continue-on-error: true
        run: |
          node .github/scripts/processing/lib/sup-source-parity-monitor.js \
            --meta .github/data/jobs-metadata.json \
            --jobs .github/data/all_jobs.json \
            --out .github/data/sup_source_parity.json

      - name: Upload parity artifact to R2 + Storage
        if: steps.freshness.outputs.pipeline_fresh == 'true' && steps.parity.outcome != 'skipped'
        continue-on-error: true
        run: |
          pip install -q boto3
          python3 -c "import boto3, os; s3 = boto3.client('s3', region_name='auto', endpoint_url=os.environ['R2_ENDPOINT'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']); s3.put_object(Bucket=os.environ['R2_BUCKET_NAME'], Key='data/sup_source_parity.json', Body=open('.github/data/sup_source_parity.json','rb').read(), ContentType='application/json'); print('uploaded sup_source_parity.json to R2')"
          curl -sf -X POST 'https://xxmhgagpbxjflajoaahy.supabase.co/storage/v1/object/pipeline-data/sup_source_parity.json' \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" -H "x-upsert: true" \
            --data-binary @.github/data/sup_source_parity.json || echo "Storage mirror skipped"
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Upload output to Supabase Storage
        if: steps.freshness.outputs.pipeline_fresh == 'true'
        continue-on-error: true
        run: |
          curl -sf -X POST \
            'https://xxmhgagpbxjflajoaahy.supabase.co/storage/v1/object/pipeline-data/sup_yield_decay_monitor.json' \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary @.github/data/sup_yield_decay_monitor.json \
            && echo "Output uploaded to Supabase Storage" \
            || echo "Upload skipped (secret may not be set — output available in run logs)"
      - name: Upload output to R2 (R2-PRIMARY canonical dual-write)
        if: steps.freshness.outputs.pipeline_fresh == 'true'
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          pip install -q boto3
          python3 -c "import boto3, os; s3 = boto3.client('s3', region_name='auto', endpoint_url=os.environ['R2_ENDPOINT'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']); s3.put_object(Bucket=os.environ['R2_BUCKET_NAME'], Key='data/sup_yield_decay_monitor.json', Body=open('.github/data/sup_yield_decay_monitor.json','rb').read(), ContentType='application/json'); print('uploaded sup_yield_decay_monitor.json to R2')"

      - name: Upload decay baseline to R2 (rolling snapshot store)
        if: steps.freshness.outputs.pipeline_fresh == 'true'
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          pip install -q boto3
          if [ -f .github/data/sup-decay-baseline.json ]; then python3 -c "import boto3, os; s3 = boto3.client('s3', region_name='auto', endpoint_url=os.environ['R2_ENDPOINT'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']); s3.put_object(Bucket=os.environ['R2_BUCKET_NAME'], Key='data/sup-decay-baseline.json', Body=open('.github/data/sup-decay-baseline.json','rb').read(), ContentType='application/json'); print('uploaded sup-decay-baseline.json to R2')"; else echo 'No baseline file to upload (monitor did not write one)'; fi

      - name: Alert on significant decay (Discord)
        if: steps.freshness.outputs.pipeline_fresh == 'true'
        continue-on-error: true
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TEAM_TOKEN }}
          DISCORD_PIPELINE_ALERT_CHANNEL_ID: ${{ secrets.DISCORD_PIPELINE_ALERT_CHANNEL_ID }}
        run: node .github/scripts/processing/lib/sup-decay-alert.js

      - name: Fail run on parity findings (LAST step — never blocks decay outputs/alerts)
        if: steps.freshness.outputs.pipeline_fresh == 'true' && steps.parity.outcome == 'failure'
        run: |
          echo "::error::SOURCE PARITY FINDINGS — see parity step output + data/sup_source_parity.json (fetched-vs-pool retention below 40% on custom sources)"
          exit 1

