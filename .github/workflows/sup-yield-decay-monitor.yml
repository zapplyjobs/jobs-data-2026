name: SUP Yield Decay Monitor

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sup-yield-decay
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- . 2>/dev/null || true
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true

          # Verify submodule decryption succeeded (INF-TRANSCRYPT-KEY-BACKUP-1).
          SAMPLE_JS=$(find .github/scripts -name '*.js' -print -quit 2>/dev/null)
          if [ -n "$SAMPLE_JS" ]; then
            if ! file -b "$SAMPLE_JS" | grep -qiE 'ASCII|UTF-8|text'; then
              echo "::error::Submodule decryption FAILED — $SAMPLE_JS is ciphertext. Pipeline would run garbage. Check TRANSCRYPT_PASSWORD + transcrypt unlock."
              exit 1
            fi
          fi
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install processing submodule dependencies
        run: cd .github/scripts/processing && npm ci || npm install

      - name: Download company-research-log.csv from Supabase Storage
        run: |
          curl -sf -o .github/data/company-research-log.csv \
            'https://xxmhgagpbxjflajoaahy.supabase.co/storage/v1/object/public/pipeline-data/company-research-log.csv' \
            && echo "CSV downloaded: $(wc -l < .github/data/company-research-log.csv) lines" \
            || { echo "FAILED to download CSV"; exit 1; }

      - name: Download all_jobs.json from R2 (canonical object store)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          pip install -q boto3
          python3 -c "import boto3, os; s3 = boto3.client('s3', region_name='auto', endpoint_url=os.environ['R2_ENDPOINT'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']); s3.download_file(os.environ['R2_BUCKET_NAME'], 'data/all_jobs.json', '.github/data/all_jobs.json'); print('Downloaded all_jobs.json from R2 (' + str(os.path.getsize('.github/data/all_jobs.json')) + ' bytes)')"

      - name: Run yield decay monitor
        run: |
          node .github/scripts/processing/lib/sup-yield-decay-monitor.js \
            --csv .github/data/company-research-log.csv \
            --jobs .github/data/all_jobs.json \
            --write .github/data/sup_yield_decay_monitor.json \
            --json

      - name: Upload output to Supabase Storage
        continue-on-error: true
        run: |
          curl -sf -X POST \
            'https://xxmhgagpbxjflajoaahy.supabase.co/storage/v1/object/pipeline-data/sup_yield_decay_monitor.json' \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary @.github/data/sup_yield_decay_monitor.json \
            && echo "Output uploaded to Supabase Storage" \
            || echo "Upload skipped (secret may not be set — output available in run logs)"
      - name: Upload output to R2 (R2-PRIMARY canonical dual-write)
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          pip install -q boto3
          python3 -c "import boto3, os; s3 = boto3.client('s3', region_name='auto', endpoint_url=os.environ['R2_ENDPOINT'], aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY']); s3.put_object(Bucket=os.environ['R2_BUCKET_NAME'], Key='data/sup_yield_decay_monitor.json', Body=open('.github/data/sup_yield_decay_monitor.json','rb').read(), ContentType='application/json'); print('uploaded sup_yield_decay_monitor.json to R2')"
