name: Publish dashboard data to R2
# INF-R2-GITCUTOVER-1: mirror the 12 dashboard data files from git into R2 so the zjp-data-proxy
# Worker can serve them (migrating the dashboard OFF public git). Bridge: reads committed files
# from the checkout + uploads to R2 every 15 min. Once the producer workflows upload directly
# (steady state) + the files are untracked, this workflow is retired.
on:
  # schedule REMOVED 2026-07-10: all 12 dashboard data files are now untracked + producers
  # (collect-metrics/enrich-jobs/daily-stats/pipeline-alert/verify-discord + the general-review
  # generator in jobs-aggregator-private) upload directly to R2. This bridge was the interim
  # git→R2 mirror; it's now a no-op. Kept workflow_dispatch as a manual one-shot fallback.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Upload dashboard data files to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          node scripts/upload-dashboard-data-to-r2.js \
            zjp-metrics.json metrics/latest.json \
            enrichment-stats.json jobs-metadata.json enrichment-history.jsonl \
            daily-stats.json history.jsonl history-archive.jsonl traffic-history.jsonl \
            pipeline-alert.json general-review.json discord-verification.json
