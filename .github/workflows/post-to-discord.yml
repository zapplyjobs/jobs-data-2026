name: Post Jobs to Discord

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/post-to-discord.yml'

concurrency:
  group: post-to-discord
  cancel-in-progress: false

jobs:
  post-discord:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true

          # Verify submodule decryption succeeded (INF-TRANSCRYPT-KEY-BACKUP-1).
          SAMPLE_JS=$(find .github/scripts -name '*.js' -print -quit 2>/dev/null)
          if [ -n "$SAMPLE_JS" ]; then
            if ! file -b "$SAMPLE_JS" | grep -qiE 'ASCII|UTF-8|text'; then
              echo "::error::Submodule decryption FAILED — $SAMPLE_JS is ciphertext. Pipeline would run garbage. Check TRANSCRYPT_PASSWORD + transcrypt unlock."
              exit 1
            fi
          fi
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .github/scripts/processing/package-lock.json


      - name: Install shared submodule dependencies (for R2 client)
        run: cd .github/scripts/shared && npm install && cd "$GITHUB_WORKSPACE"/.github/scripts/processing && npm install

      - name: Download data from R2
        id: r2fetch
        if: success()
        continue-on-error: true
        run: |
          echo "📥 Downloading pipeline data from R2..."
          node -e "
          const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
          const fs = require('fs');
          const path = require('path');

          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            const dataDir = '.github/data';
            if (!fs.existsSync(dataDir)) fs.mkdirSync(dataDir, { recursive: true });

            const files = ['all_jobs.json', 'enriched_jobs.json', 'posted_jobs.json', 'global-dedupe-store.json'];
            let ok = 0;
            for (const file of files) {
              try {
                const raw = await r2.downloadRaw(file);
                if (raw) {
                  fs.writeFileSync(path.join(dataDir, file), Buffer.from(raw));
                  ok++;
                  console.log('R2 download OK: ' + file);
                } else {
                  console.log('R2 SKIP: ' + file + ' (not found — will use git version)');
                }
              } catch (e) { console.error('R2 download ERR: ' + file + ' - ' + e.message); }
            }
            console.log('R2 download done: ' + ok + ' files');
            const { checkFreshness } = require('./.github/scripts/processing/lib/storage/freshness-gate');
            await checkFreshness({ r2, limitMinutes: 45, label: 'post-to-discord' });
          }
          main().catch(e => { console.error('R2 fatal: ' + e.message); process.exit(1); });
          "
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Post jobs to Discord
        if: success() && steps.r2fetch.outputs.pipeline_fresh == 'true'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_TECH_CHANNEL_ID: ${{ secrets.DISCORD_TECH_CHANNEL_ID }}
          DISCORD_IT_CHANNEL_ID: ${{ secrets.DISCORD_IT_CHANNEL_ID }}
          DISCORD_AI_CHANNEL_ID: ${{ secrets.DISCORD_AI_CHANNEL_ID }}
          DISCORD_DS_CHANNEL_ID: ${{ secrets.DISCORD_DS_CHANNEL_ID }}
          DISCORD_FINANCE_CHANNEL_ID: ${{ secrets.DISCORD_FINANCE_CHANNEL_ID }}
          DISCORD_BUSINESS_CHANNEL_ID: ${{ secrets.DISCORD_BUSINESS_CHANNEL_ID }}
          DISCORD_HEALTHCARE_CHANNEL_ID: ${{ secrets.DISCORD_HEALTHCARE_CHANNEL_ID }}
          DISCORD_BAY_AREA_CHANNEL_ID: ${{ secrets.DISCORD_BAY_AREA_CHANNEL_ID }}
          DISCORD_NY_CHANNEL_ID: ${{ secrets.DISCORD_NY_CHANNEL_ID }}
          DISCORD_PNW_CHANNEL_ID: ${{ secrets.DISCORD_PNW_CHANNEL_ID }}
          DISCORD_REMOTE_USA_CHANNEL_ID: ${{ secrets.DISCORD_REMOTE_USA_CHANNEL_ID }}
          DISCORD_OTHER_USA_CHANNEL_ID: ${{ secrets.DISCORD_OTHER_USA_CHANNEL_ID }}
          DISCORD_OTHER_INDUSTRY_CHANNEL_ID: ${{ secrets.DISCORD_OTHER_INDUSTRY_CHANNEL_ID }}
          DISCORD_HARDWARE_CHANNEL_ID: ${{ secrets.DISCORD_HARDWARE_CHANNEL_ID }}
          DISCORD_SALES_CHANNEL_ID: ${{ secrets.DISCORD_SALES_CHANNEL_ID }}
          DISCORD_TECH_INT_CHANNEL_ID: ${{ secrets.DISCORD_TECH_INT_CHANNEL_ID }}
          DISCORD_AI_INT_CHANNEL_ID: ${{ secrets.DISCORD_AI_INT_CHANNEL_ID }}
          DISCORD_DS_INT_CHANNEL_ID: ${{ secrets.DISCORD_DS_INT_CHANNEL_ID }}
          DISCORD_BUSINESS_INT_CHANNEL_ID: ${{ secrets.DISCORD_BUSINESS_INT_CHANNEL_ID }}
          DISCORD_SALES_INT_CHANNEL_ID: ${{ secrets.DISCORD_SALES_INT_CHANNEL_ID }}
          DISCORD_MARKETING_INT_CHANNEL_ID: ${{ secrets.DISCORD_MARKETING_INT_CHANNEL_ID }}
          DISCORD_HEALTHCARE_INT_CHANNEL_ID: ${{ secrets.DISCORD_HEALTHCARE_INT_CHANNEL_ID }}
          DISCORD_OTHER_INDUSTRY_INT_CHANNEL_ID: ${{ secrets.DISCORD_OTHER_INDUSTRY_INT_CHANNEL_ID }}
          DISCORD_REMOTE_USA_INT_CHANNEL_ID: ${{ secrets.DISCORD_REMOTE_USA_INT_CHANNEL_ID }}
          DISCORD_BAY_AREA_INT_CHANNEL_ID: ${{ secrets.DISCORD_BAY_AREA_INT_CHANNEL_ID }}
          DISCORD_NY_INT_CHANNEL_ID: ${{ secrets.DISCORD_NY_INT_CHANNEL_ID }}
          DISCORD_PNW_INT_CHANNEL_ID: ${{ secrets.DISCORD_PNW_INT_CHANNEL_ID }}
          DISCORD_SOCAL_INT_CHANNEL_ID: ${{ secrets.DISCORD_SOCAL_INT_CHANNEL_ID }}
          DISCORD_OTHER_USA_INT_CHANNEL_ID: ${{ secrets.DISCORD_OTHER_USA_INT_CHANNEL_ID }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || 10 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/processing/lib/discord-poster.js

      - name: Upload dedupe data to R2
        if: always()
        continue-on-error: true
        run: |
          echo "📤 Uploading dedupe data to R2..."
          node -e "
          const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
          const fs = require('fs');
          const path = require('path');

          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            const dataDir = '.github/data';
            const files = ['posted_jobs.json', 'global-dedupe-store.json'];
            let ok = 0;
            for (const file of files) {
              const fp = path.join(dataDir, file);
              if (!fs.existsSync(fp)) { console.log('SKIP: ' + file); continue; }
              try {
                const data = fs.readFileSync(fp, 'utf8');
                if (await r2.uploadRaw(file, data, 'application/json')) ok++;
              } catch (e) { console.error('ERR: ' + file + ' - ' + e.message); }
            }
            console.log('R2 upload done: ' + ok + ' files');
          }
          main().catch(e => { console.error('R2 fatal: ' + e.message); process.exit(1); });
          "
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Publish posted_jobs to Supabase directly (Phase 1 R2 elimination)
        if: always()
        continue-on-error: true
        run: node .github/scripts/processing/lib/publish-metrics-to-edge.js --data-dir .github/data
        env:
          EDGE_FUNCTION_URL: https://xxmhgagpbxjflajoaahy.supabase.co/functions/v1/publish-metrics-function
          PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}
