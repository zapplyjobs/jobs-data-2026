name: Collect Metrics

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:
  repository_dispatch:
    types: [collect-metrics]

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decrypt repository secrets
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/git-crypt-key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/git-crypt-key
          rm /tmp/git-crypt-key

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/collect-metrics.js

      - name: Commit and push metrics
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Metrics Bot"
          git add .github/data/metrics/ || exit 0
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "chore: update metrics [skip ci]"
          # git-crypt's smudge filter re-runs on every index operation, causing
          # decrypted scripts to appear "modified" even after stash/checkout.
          # Bypass the filter during pull --rebase (same fix as enrich-jobs.yml INF-19).
          for i in 1 2 3; do
            git -c filter.git-crypt.smudge=cat -c filter.git-crypt.clean=cat -c filter.git-crypt.required=false pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
