name: Collect Metrics

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:
  repository_dispatch:
    types: [collect-metrics]

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install shared submodule dependencies
        run: cd .github/scripts/shared && npm install

      - name: Collect metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/shared/lib/jobs-data-scripts/collect-metrics.js

      - name: Generate consolidated metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node .github/scripts/shared/lib/jobs-data-scripts/generate-zjp-metrics.js

      - name: Commit and push metrics
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Metrics Bot"
          git add .github/data/metrics/ .github/data/zjp-metrics.json || exit 0
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "chore: update metrics [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done