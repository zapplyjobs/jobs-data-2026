name: Re-encrypt after ENR-37 push

on:
  workflow_dispatch:

jobs:
  reencrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/git-crypt-key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/git-crypt-key
          rm /tmp/git-crypt-key

      - name: Re-encrypt
        run: |
          git config user.name "z-apply"
          git config user.email "admin@zapply.jobs"
          git-crypt status -f
          CHANGES=$(git diff --stat)
          if [ -n "$CHANGES" ]; then
            git add -A
            git commit -m "fix: re-encrypt enrich-jobs.js after ENR-37 plaintext push"
            git push origin main
          else
            echo "No changes needed — already encrypted"
          fi
