name: OUT Dead Link Check
# Weekly dead-link check across all consumer repos.
# Publishes results to Supabase Storage as dead-links.json for dashboard consumption.
# Format: {generated_at, total_checked, total_dead, dead_links: [{repo, url, http_code}], total_transient, transient_links: [{repo, url, http_code}]}
on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/out-dead-link-check.yml'

permissions:
  contents: read
  issues: write

jobs:
  dead-link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Check dead links + publish to Storage
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        DATA_PROXY_TOKEN: ${{ secrets.DATA_PROXY_TOKEN }}
      run: |
        python3 - <<'PYEOF'
        import json, urllib.request, urllib.error, re, os, sys, datetime, time
        from concurrent.futures import ThreadPoolExecutor, as_completed

        now = datetime.datetime.now(datetime.timezone.utc)
        repos = [
            # 2027 boards
            "New-Grad-Jobs-2027", "Internships-2027",
            "New-Grad-Software-Engineering-Jobs-2027", "New-Grad-Data-Science-Jobs-2027",
            "New-Grad-Hardware-Engineering-Jobs-2027", "New-Grad-Healthcare-Jobs-2027",
            "New-Grad-IT-Jobs-2027",
            "Canada-Jobs-2027", "Canada-Internships-2027",
            # 2026 boards (OUT-DEADLINK-SCAN-FP-1: previously unscanned)
            "New-Grad-Jobs-2026", "Internships-2026",
            "New-Grad-Software-Engineering-Jobs-2026", "New-Grad-Data-Science-Jobs-2026",
            "New-Grad-Hardware-Engineering-Jobs-2026", "New-Grad-Healthcare-Jobs-2026",
            # reference / evergreen
            "Research-Internships-for-Undergraduates", "underclassmen-internships",
            "resume-samples-2026", "interview-handbook-2026",
        ]

        # URLs to skip (always OK or not worth checking)
        SKIP_PATTERNS = [
            r'github\.com', r'img\.shields\.io', r'images/',
            r'raw\.githubusercontent\.com', r'badges\.gesis\.org',
            r'\.png$', r'\.jpg$', r'\.gif$', r'\.svg$',
            r'discord\.gg', r'discord\.com',
        ]
        skip_re = re.compile('|'.join(SKIP_PATTERNS), re.IGNORECASE)

        # Status codes we accept as "not dead"
        ACCEPT_CODES = {200, 201, 202, 203, 204, 301, 302, 303, 307, 308, 403, 429}

        # Soft-404 detection intentionally NOT implemented (OUT-SOFT404-SCAN-1, 2026-07-22).
        # The one known soft-404 host (TikTok lifeattiktok) is IP-dependent: this GitHub runner
        # gets HTTP 200 with a non-matching body, while users/other probes get a real 404 — so
        # body-sniffing cannot catch it from here. Durable fix is upstream (AGG-TIKTOK-STALE-1
        # purges the stale jobs). Do NOT re-add host body-sniffing without an IP-independent signature.

        url_re = re.compile(r'https?://[^\s\)"<>\]]+')

        def fetch_readme(repo):
            """Fetch README from raw GitHub."""
            # Try main first, then master (some repos use master)
            for branch in ('main', 'master'):
                try:
                    url = f"https://raw.githubusercontent.com/zapplyjobs/{repo}/{branch}/README.md"
                    req = urllib.request.Request(url, headers={"User-Agent": "out-deadlink/1.0"})
                    with urllib.request.urlopen(req, timeout=15) as resp:
                        return resp.read().decode('utf-8', errors='replace')
                except Exception:
                    continue
            return None

        def check_url(url, attempts=3):
            """Check a single URL. Returns (kind, value): kind 'code' (value=int HTTP status) or
            'transient' (value=error string after retries exhausted).
            OUT-DEADLINK-SCAN-FP-1: network errors (timeout / connection refused / DNS / reset)
            are retried with backoff; only after all retries fail are they 'transient' (NOT 'dead').
            4xx HTTP codes are definitive (returned immediately, no retry); 5xx server errors are retried like network errors (transient, not dead)."""
            last_err = None
            for attempt in range(attempts):
                try:
                    req = urllib.request.Request(url, headers={
                        "User-Agent": "Mozilla/5.0 (out-deadlink/1.0)",
                        "Accept": "text/html,application/json"
                    })
                    with urllib.request.urlopen(req, timeout=15) as resp:
                        return ('code', resp.status)
                except urllib.error.HTTPError as e:
                    if 500 <= e.code < 600:
                        # Server error (5xx) — transient like a timeout; retry before judging.
                        last_err = f"HTTP {e.code}"
                        if attempt < attempts - 1:
                            time.sleep(2 * (attempt + 1))  # backoff 2s, 4s
                        continue
                    return ('code', e.code)  # 4xx etc. — definitive response, no retry
                except Exception as e:
                    last_err = str(e)[:100]
                    if attempt < attempts - 1:
                        time.sleep(2 * (attempt + 1))  # backoff 2s, 4s
            return ('transient', last_err)

        all_urls = {}  # url → set of repos
        for repo in repos:
            readme = fetch_readme(repo)
            if not readme:
                print(f"WARNING: Could not fetch README for {repo}")
                continue
            urls = set(url_re.findall(readme))
            filtered = {u for u in urls if not skip_re.search(u)}
            print(f"{repo}: {len(urls)} URLs found, {len(filtered)} to check")
            for u in filtered:
                all_urls.setdefault(u, set()).add(repo)

        print(f"\nTotal unique URLs to check: {len(all_urls)}")

        # Cap at 3000 URLs (OUT-DEADLINK-SCAN-FP-1 polish: exhaustive — current pool ~2700; was sampling ~25%)
        urls_to_check = list(all_urls.keys())
        if len(urls_to_check) > 3000:
            print(f"Sampling 3000 of {len(urls_to_check)} URLs")
            urls_to_check = urls_to_check[:3000]

        # Check URLs concurrently (15 at a time — raised from 10 for the larger 2026+2027 set)
        results = {}
        with ThreadPoolExecutor(max_workers=15) as pool:
            futures = {pool.submit(check_url, u): u for u in urls_to_check}
            for i, future in enumerate(as_completed(futures)):
                url = futures[future]
                results[url] = future.result()
                if (i + 1) % 100 == 0:
                    print(f"  Checked {i+1}/{len(urls_to_check)}...")

        # Classify: dead = definitive non-accepted HTTP code; transient = network failure after retries (not dead)
        dead_links = []
        transient_links = []
        for url, (kind, value) in results.items():
            if kind == 'transient':
                for repo in all_urls[url]:
                    transient_links.append({"repo": repo, "url": url, "http_code": value})
            elif value not in ACCEPT_CODES:
                for repo in all_urls[url]:
                    dead_links.append({"repo": repo, "url": url, "http_code": value})
        # ── ATS availability pass (OUT-DEADLINK-ATSIGNATURE-1, 2026-08-14) ──
        # Workday links return a 200 SPA shell whether the job is open or closed, so the
        # status-code pass above cannot judge them (the soft-404 blind class behind the
        # recurring dev-team dead-link reports). IP-independent signature: the Workday CXS
        # JSON API reached through the authenticated wd-fetch-proxy (same path the desc
        # fetcher uses; DATA_PROXY_TOKEN is already a repo secret).
        #   alive    = any URL variant returns JSON with jobPostingInfo
        #   dead     = definitive WD errorCode payload (e.g. S22) or HTTP 404/410, with no
        #              alive variant (dead ONLY on a definitive API verdict — never on
        #              HTML shells, auth quirks, or network errors; lower bound preserved)
        # Dry-run-verified 2026-08-14: 25/25 live board rows classified alive (zero FP);
        # a known-closed HP internship returns 403 errorCode S22; BAE-style removals 410.
        wd_re = re.compile(r'https://[a-z0-9-]+\.(?:wd\d*\.myworkdayjobs\.com|myworkdaysite\.com)/[^)\s"<\]]+')
        def wd_variants(u):
            m = re.match(r'(https://[^/]+)(/[^?#]*?)(?:[?#].*)?$', u)
            if not m: return []
            origin, path = m.groups()
            seg = [s for s in path.split('/') if s]
            if seg and re.match(r'^[a-z]{2}(-[A-Z]{2})?$', seg[0]): seg = seg[1:]
            if len(seg) < 2: return []
            tenant = origin.split('//')[1].split('.')[0]
            site = seg[0]
            out = [f"{origin}/wday/cxs/{tenant}/{site}/" + '/'.join(seg[1:])]
            if len(seg) >= 3 and seg[1].lower() == site.lower():  # doubled-site tenants (wellsfargojobs shape)
                out.append(f"{origin}/wday/cxs/{tenant}/{site}/" + '/'.join(seg[2:]))
            return out

        PROXY = "https://wd-fetch-proxy.wild-queen-069e.workers.dev"
        PROXY_TOKEN = os.environ.get('DATA_PROXY_TOKEN', '')
        def ats_check(url):
            import urllib.parse as _up
            import time as _t
            variants = wd_variants(url)
            if not variants: return ('skip', 'no-variant')
            def probe(v):
                # returns ('alive'|'closed'|None) — closed ONLY on definitive verdicts
                try:
                    req = urllib.request.Request(f"{PROXY}/?url={_up.quote(v, safe='')}",
                        headers={'X-Proxy-Token': PROXY_TOKEN, 'User-Agent': 'out-deadlink/1.0'})
                    try:
                        with urllib.request.urlopen(req, timeout=15) as resp:
                            status, body = resp.status, resp.read()
                    except urllib.error.HTTPError as e:
                        status, body = e.code, e.read()
                except Exception:
                    return None  # network/proxy failure → unknown, never dead
                try:
                    d = json.loads(body)
                except Exception:
                    return None  # HTML SPA shell → unknown
                if isinstance(d, dict) and d.get('jobPostingInfo'):
                    return 'alive'
                # Closure verdicts ONLY: S22 (= position no longer available) or hard 404/410.
                # Other errorCodes/statuses (406/429/… ) are throttling/edge responses, NOT
                # closure — live-run 2026-08-14 proved 406 storms on live jobs (Cox et al.).
                if isinstance(d, dict) and d.get('errorCode') == 'S22':
                    return 'closed'
                if status in (404, 410):
                    return 'closed'
                return None
            closed_variant = None
            for v in variants:
                r = probe(v)
                if r == 'alive':
                    return ('alive', 'ok')
                if r == 'closed' and closed_variant is None:
                    closed_variant = v
            if closed_variant is not None:
                _t.sleep(1.5)  # confirm: throttling transients clear, real closure persists
                if probe(closed_variant) == 'closed':
                    return ('dead', 'ATS-CLOSED')
                return ('unknown', 'closed-not-confirmed')
            return ('unknown', 'html-or-unreachable')
        wd_urls = {u for u in all_urls if wd_re.search(u)} if PROXY_TOKEN else set()
        if wd_urls:
            print(f"\nATS availability pass: {len(wd_urls)} Workday links")
            with ThreadPoolExecutor(max_workers=12) as pool2:
                ats_results = dict(zip(wd_urls, pool2.map(ats_check, sorted(wd_urls))))
            ats_dead = [u for u, (k, _) in ats_results.items() if k == 'dead']
            for u in ats_dead:
                detail = ats_results[u][1]
                for repo in all_urls[u]:
                    dead_links.append({"repo": repo, "url": u, "http_code": detail})
            from collections import Counter as _C
            print(f"  ATS verdicts: {dict(_C(k for k, _ in ats_results.values()))}")

        output = {
            "generated_at": now.isoformat(),
            "total_checked": len(results),
            "total_dead": len(dead_links),
            "dead_links": dead_links,
            "total_transient": len(transient_links),
            "transient_links": transient_links
        }

        # Print summary
        print(f"\n=== Dead Link Check Results ===")
        print(f"Total checked: {len(results)}")
        print(f"Dead links: {len(dead_links)}")
        print(f"Transient (network errors, NOT dead): {len(transient_links)}")
        if dead_links:
            for dl in dead_links[:20]:
                print(f"  ❌ {dl['repo']}: {dl['url'][:80]} → {dl['http_code']}")
            if len(dead_links) > 20:
                print(f"  ... and {len(dead_links) - 20} more")
        if transient_links:
            for tl in transient_links[:10]:
                print(f"  ⚠️  {tl['repo']}: {tl['url'][:80]} → {tl['http_code']}")
            if len(transient_links) > 10:
                print(f"  ... and {len(transient_links) - 10} more transient")

        # Write step summary
        summary = f"## Dead Link Check\n\n- **Checked:** {len(results)} URLs\n- **Dead:** {len(dead_links)} links\n- **Transient (not dead):** {len(transient_links)} links\n"
        with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
            f.write(summary)

        # Publish to Supabase Storage (R2 eliminated — bucket deleted 2026-07-29)
        try:
            _url = f"{os.environ.get('SUPABASE_URL', '')}/storage/v1/object/pipeline-data/dead-links.json"
            _req = urllib.request.Request(_url, method='PUT',
                data=json.dumps(output, indent=2).encode(),
                headers={'Authorization': f"Bearer {os.environ.get('SUPABASE_SERVICE_ROLE_KEY', '')}",
                         'apikey': os.environ.get('SUPABASE_SERVICE_ROLE_KEY', ''),
                         'Content-Type': 'application/json'})
            urllib.request.urlopen(_req, timeout=15)
            print("Results uploaded to Storage: pipeline-data/dead-links.json")
        except Exception as e:
            print(f"Storage upload failed: {e}")
            sys.exit(1)

        # R2 dual-write (recovery plan v2)
        try:
            import boto3
            _s3 = boto3.client('s3',
                endpoint_url=os.environ.get('R2_ENDPOINT', ''),
                aws_access_key_id=os.environ.get('R2_ACCESS_KEY_ID', ''),
                aws_secret_access_key=os.environ.get('R2_SECRET_ACCESS_KEY', ''))
            _s3.put_object(Bucket=os.environ.get('R2_BUCKET_NAME', 'zjp-data'),
                           Key='data/dead-links.json',
                           Body=json.dumps(output, indent=2).encode(),
                           ContentType='application/json')
            print("R2 upload OK: dead-links.json")
        except Exception as e:
            print(f"R2 upload failed (non-blocking): {e}")

        # Exit 1 only if truly-dead links found (transient excluded — triggers the tracking issue)
        if dead_links:
            sys.exit(1)
        PYEOF

    - name: Create or update tracking issue on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const title = 'Dead links detected in consumer repos';
          const body = `The weekly dead-link check found broken links on ${new Date().toISOString()}.\n\nSee [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for the full list.\n\nResults are published to Supabase Storage: pipeline-data/dead-links.json`;
          const existing = await github.rest.issues.listForRepo({
            ...context.repo,
            state: 'open',
            labels: 'dead-links,auto-created',
            per_page: 1
          });
          if (existing.data.length > 0) {
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: existing.data[0].number,
              body
            });
          } else {
            await github.rest.issues.create({
              ...context.repo,
              title,
              body,
              labels: ['dead-links', 'auto-created']
            });
          }
