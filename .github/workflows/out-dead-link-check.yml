name: OUT Dead Link Check
# Weekly dead-link check across all consumer repos.
# Publishes results to R2 as dead-links.json for dashboard consumption.
# Format: {generated_at, total_checked, dead_links: [{repo, url, http_code}]}
on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/out-dead-link-check.yml'

permissions:
  contents: read
  issues: write

jobs:
  dead-link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Check dead links + publish to R2
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        python3 - <<'PYEOF'
        import json, urllib.request, urllib.error, re, os, sys, datetime, time
        from concurrent.futures import ThreadPoolExecutor, as_completed

        now = datetime.datetime.now(datetime.timezone.utc)
        repos = [
            "New-Grad-Jobs-2027", "Internships-2027",
            "New-Grad-Software-Engineering-Jobs-2027", "New-Grad-Data-Science-Jobs-2027",
            "New-Grad-Hardware-Engineering-Jobs-2027", "New-Grad-Healthcare-Jobs-2027",
            "Canada-Jobs-2027", "Canada-Internships-2027",
            "Research-Internships-for-Undergraduates", "underclassmen-internships",
            "resume-samples-2026", "interview-handbook-2026",
        ]

        # URLs to skip (always OK or not worth checking)
        SKIP_PATTERNS = [
            r'github\.com', r'img\.shields\.io', r'images/',
            r'raw\.githubusercontent\.com', r'badges\.gesis\.org',
            r'\.png$', r'\.jpg$', r'\.gif$', r'\.svg$',
            r'discord\.gg', r'discord\.com',
        ]
        skip_re = re.compile('|'.join(SKIP_PATTERNS), re.IGNORECASE)

        # Status codes we accept as "not dead"
        ACCEPT_CODES = {200, 201, 202, 203, 204, 301, 302, 303, 307, 308, 403, 429}

        url_re = re.compile(r'https?://[^\s\)"<>\]]+')

        def fetch_readme(repo):
            """Fetch README from raw GitHub."""
            # Try main first, then master (some repos use master)
            for branch in ('main', 'master'):
                try:
                    url = f"https://raw.githubusercontent.com/zapplyjobs/{repo}/{branch}/README.md"
                    req = urllib.request.Request(url, headers={"User-Agent": "out-deadlink/1.0"})
                    with urllib.request.urlopen(req, timeout=15) as resp:
                        return resp.read().decode('utf-8', errors='replace')
                except Exception:
                    continue
            return None

        def check_url(url):
            """Check a single URL, return http_code or error."""
            try:
                req = urllib.request.Request(url, headers={
                    "User-Agent": "Mozilla/5.0 (out-deadlink/1.0)",
                    "Accept": "text/html,application/json"
                })
                with urllib.request.urlopen(req, timeout=15) as resp:
                    return resp.status
            except urllib.error.HTTPError as e:
                return e.code
            except Exception as e:
                return str(e)[:100]

        all_urls = {}  # url → set of repos
        for repo in repos:
            readme = fetch_readme(repo)
            if not readme:
                print(f"WARNING: Could not fetch README for {repo}")
                continue
            urls = set(url_re.findall(readme))
            filtered = {u for u in urls if not skip_re.search(u)}
            print(f"{repo}: {len(urls)} URLs found, {len(filtered)} to check")
            for u in filtered:
                all_urls.setdefault(u, set()).add(repo)

        print(f"\nTotal unique URLs to check: {len(all_urls)}")

        # Cap at 500 URLs to avoid timeout (sample if more)
        urls_to_check = list(all_urls.keys())
        if len(urls_to_check) > 500:
            print(f"Sampling 500 of {len(urls_to_check)} URLs")
            urls_to_check = urls_to_check[:500]

        # Check URLs concurrently (max 10 at a time)
        results = {}
        with ThreadPoolExecutor(max_workers=10) as pool:
            futures = {pool.submit(check_url, u): u for u in urls_to_check}
            for i, future in enumerate(as_completed(futures)):
                url = futures[future]
                code = future.result()
                results[url] = code
                if (i + 1) % 50 == 0:
                    print(f"  Checked {i+1}/{len(urls_to_check)}...")

        # Find dead links
        dead_links = []
        for url, code in results.items():
            if isinstance(code, int) and code in ACCEPT_CODES:
                continue
            # Dead: non-accepted HTTP code or connection error
            for repo in all_urls[url]:
                dead_links.append({
                    "repo": repo,
                    "url": url,
                    "http_code": code
                })

        output = {
            "generated_at": now.isoformat(),
            "total_checked": len(results),
            "total_dead": len(dead_links),
            "dead_links": dead_links
        }

        # Print summary
        print(f"\n=== Dead Link Check Results ===")
        print(f"Total checked: {len(results)}")
        print(f"Dead links: {len(dead_links)}")
        if dead_links:
            for dl in dead_links[:20]:
                print(f"  ❌ {dl['repo']}: {dl['url'][:80]} → {dl['http_code']}")
            if len(dead_links) > 20:
                print(f"  ... and {len(dead_links) - 20} more")

        # Write step summary
        summary = f"## Dead Link Check\n\n- **Checked:** {len(results)} URLs\n- **Dead:** {len(dead_links)} links\n"
        with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
            f.write(summary)

        # Publish to R2
        try:
            import subprocess
            subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'boto3', '-q'], stderr=subprocess.DEVNULL)
            import boto3
            s3 = boto3.client('s3',
                endpoint_url=os.environ.get('R2_ENDPOINT', ''),
                aws_access_key_id=os.environ.get('R2_ACCESS_KEY_ID', ''),
                aws_secret_access_key=os.environ.get('R2_SECRET_ACCESS_KEY', ''),
                region_name='auto')
            s3.put_object(
                Bucket=os.environ.get('R2_BUCKET_NAME', 'zjp-data'),
                Key='data/dead-links.json',
                Body=json.dumps(output, indent=2),
                ContentType='application/json')
            print("Results uploaded to R2: data/dead-links.json")
        except Exception as e:
            print(f"R2 upload failed: {e}")
            sys.exit(1)

        # Exit 1 if dead links found (triggers tracking issue)
        if dead_links:
            sys.exit(1)
        PYEOF

    - name: Create or update tracking issue on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const title = 'Dead links detected in consumer repos';
          const body = `The weekly dead-link check found broken links on ${new Date().toISOString()}.\n\nSee [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for the full list.\n\nResults are published to R2: data/dead-links.json`;
          const existing = await github.rest.issues.listForRepo({
            ...context.repo,
            state: 'open',
            labels: 'dead-links,auto-created',
            per_page: 1
          });
          if (existing.data.length > 0) {
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: existing.data[0].number,
              body
            });
          } else {
            await github.rest.issues.create({
              ...context.repo,
              title,
              body,
              labels: ['dead-links', 'auto-created']
            });
          }
