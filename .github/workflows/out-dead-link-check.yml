name: OUT Dead Link Check
# Weekly dead-link check across all consumer repos + ATS availability passes
# (Workday tenant-listing membership via wd-fetch-proxy; Ashby posting API).
# Scanner logic lives in .github/scripts/out_dead_link_scan.py (extracted from
# this file's heredoc 2026-08-16, OUT-DEADLINK-CODECLEANUP-1 — lintable/testable).
# Publishes dead-links.json to Supabase Storage + R2 (data/ prefix, canonical).
# Format: {generated_at, total_checked, total_dead, dead_links: [{repo, url, http_code, closed_via?, note?}],
#          ats_watch: [{repo, url, note}], ats_stats: {judged, alive, dead, unknown, pass?},
#          total_transient, transient_links: [{repo, url, http_code}]}
# http_code is an int for status-code deaths and the string 'ats-closed' for ATS-listing deaths.
on:
  schedule:
    - cron: '0 6 * * *'  # Daily 06:00 UTC (was weekly Monday; daily since OUT-ATSCLOSED-HIDE-1 — the consumer now hides ats-closed URLs each publisher cycle, so scan freshness = hide latency)
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/out-dead-link-check.yml'
      - '.github/scripts/out_dead_link_scan.py'

permissions:
  contents: read
  issues: write

jobs:
  dead-link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Check dead links + publish to Storage
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        DATA_PROXY_TOKEN: ${{ secrets.DATA_PROXY_TOKEN }}
      run: python3 .github/scripts/out_dead_link_scan.py

    - name: Create or update tracking issue on failure
      if: failure()
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      with:
        script: |
          const title = 'Dead links detected in consumer repos';
          const body = `The weekly dead-link check found broken links on ${new Date().toISOString()}.\n\nSee [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for the full list.\n\nResults are published to Supabase Storage: pipeline-data/dead-links.json`;
          const existing = await github.rest.issues.listForRepo({
            ...context.repo,
            state: 'open',
            labels: 'dead-links,auto-created',
            per_page: 1
          });
          if (existing.data.length > 0) {
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: existing.data[0].number,
              body
            });
          } else {
            await github.rest.issues.create({
              ...context.repo,
              title,
              body,
              labels: ['dead-links', 'auto-created']
            });
          }
