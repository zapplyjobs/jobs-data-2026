name: Generate System State

on:
  schedule:
    - cron: '0 * * * *'  # Hourly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt (vendored action — immune to raw-CDN 429s, INF-TRANSCRYPT-ACTION-1)
        uses: zapplyjobs/.github/actions/setup-transcrypt@afcb5f41ec28fe10cefcf421fc455d0d89588b1f

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}

      - name: Fix submodule index
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Install processing deps (INF-DEPRESOLUTION-CICHECK-1 — generate-system-state lazily requires processing r2-client → @aws-sdk; the removed root manifest used to satisfy it via upward resolution; the hourly upload has been silently failing since 2026-08-15)
        run: cd .github/scripts/processing && npm install --no-audit --no-fund

      - name: Generate system-state.json
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}  # INF-SUPABASE-MGMT-TOKEN-401-1 option C: db_health() RPC (service key, no platform token)
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          DATA_PROXY_TOKEN: ${{ secrets.DATA_PROXY_TOKEN }}  # INF-PROXY-LIVENESS-CHECK-1: authed end-to-end proxy probe (missing on first deploy -> probe caught its own wiring gap, 401)
        run: node scripts/generate-system-state.js

      - name: Upload system-state.json to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          node -e "
          const fs = require('fs');
          const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
          async function main() {
            if (!fs.existsSync('.github/data/system-state.json')) { console.log('system-state.json not found'); return; }
            const r2 = createR2Client({ prefix: 'data/' });
            const data = JSON.parse(fs.readFileSync('.github/data/system-state.json', 'utf8'));
            await r2.uploadJson('system-state.json', data);
            console.log('✅ Uploaded system-state.json to R2');
          }
          main().catch(e => { console.error('⚠️ R2 upload failed:', e.message); });
          "
