name: Generate System State

on:
  schedule:
    - cron: '0 * * * *'  # Hourly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt
        run: |
          # INF-UNLOCK-INTERMITTENT-1: -sSL without -f silently installs raw.github's 429
          # rate-limit PAGE as the binary (observed 2026-08-17: 8 workflow failures in a 80-min
          # throttled window). Fail on HTTP errors, retry 3x, and verify it's a script.
          for i in 1 2 3; do
            curl -sfSL "https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt" -o /tmp/transcrypt && break
            echo "transcrypt download attempt $i failed — retrying in 15s"; sleep 15
          done
          [ -s /tmp/transcrypt ] || { echo "::error::transcrypt download failed after retries"; exit 1; }
          head -c2 /tmp/transcrypt | grep -q '#!' || { echo "::error::transcrypt download is not a script (rate-limit page?) — refusing to install"; exit 1; }
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}

      - name: Fix submodule index
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install processing deps (INF-DEPRESOLUTION-CICHECK-1 — generate-system-state lazily requires processing r2-client → @aws-sdk; the removed root manifest used to satisfy it via upward resolution; the hourly upload has been silently failing since 2026-08-15)
        run: cd .github/scripts/processing && npm install --no-audit --no-fund

      - name: Generate system-state.json
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}  # INF-SUPABASE-MGMT-TOKEN-401-1 option C: db_health() RPC (service key, no platform token)
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node scripts/generate-system-state.js

      - name: Upload system-state.json to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          node -e "
          const fs = require('fs');
          const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
          async function main() {
            if (!fs.existsSync('.github/data/system-state.json')) { console.log('system-state.json not found'); return; }
            const r2 = createR2Client({ prefix: 'data/' });
            const data = JSON.parse(fs.readFileSync('.github/data/system-state.json', 'utf8'));
            await r2.uploadJson('system-state.json', data);
            console.log('✅ Uploaded system-state.json to R2');
          }
          main().catch(e => { console.error('⚠️ R2 upload failed:', e.message); });
          "
