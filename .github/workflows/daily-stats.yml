name: Daily GitHub Stats to Discord

on:
  schedule:
    - cron: '0 5 * * *'  # Midnight US Central (5 AM UTC)
  workflow_dispatch:

jobs:
  daily-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Post daily stats to Discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TEAM_TOKEN }}
          DISCORD_DAILY_STATS_CHANNEL_ID: ${{ secrets.DISCORD_DAILY_STATS_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/daily-stats.js

      - name: Commit updated stats file
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          git add .github/data/daily-stats.json || exit 0
          git commit -m "chore: update daily-stats.json [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push
