name: Daily GitHub Stats to Discord

on:
  schedule:
    - cron: '0 5 * * *'  # Midnight US Central (5 AM UTC)
  workflow_dispatch:

jobs:
  daily-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true

          # Verify submodule decryption succeeded (INF-TRANSCRYPT-KEY-BACKUP-1).
          SAMPLE_JS=$(find .github/scripts -name '*.js' -print -quit 2>/dev/null)
          if [ -n "$SAMPLE_JS" ]; then
            if ! file -b "$SAMPLE_JS" | grep -qiE 'ASCII|UTF-8|text'; then
              echo "::error::Submodule decryption FAILED — $SAMPLE_JS is ciphertext. Pipeline would run garbage. Check TRANSCRYPT_PASSWORD + transcrypt unlock."
              exit 1
            fi
          fi
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install shared+processing submodule dependencies (for R2 client)
        run: cd .github/scripts/shared && npm install && cd "$GITHUB_WORKSPACE"/.github/scripts/processing && npm install

      - name: Download data from R2
        id: r2fetch
        if: success()
        continue-on-error: true
        run: |
          echo "📥 Downloading pipeline data from R2..."
          node -e "
          const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
          const fs = require('fs');
          const path = require('path');

          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            const dataDir = '.github/data';
            if (!fs.existsSync(dataDir)) fs.mkdirSync(dataDir, { recursive: true });

            const files = ['all_jobs.json', 'enriched_jobs.json', 'posted_jobs.json', 'jobs-metadata.json', 'daily-stats.json', 'board-counts.json', 'history.jsonl', 'history-archive.jsonl', 'traffic-history.jsonl'];
            for (const file of files) {
              try {
                const raw = await r2.downloadRaw(file);
                if (raw) {
                  fs.writeFileSync(path.join(dataDir, file), Buffer.from(raw));
                  console.log('R2 download OK: ' + file);
                } else {
                  console.log('R2 SKIP: ' + file + ' (not found)');
                }
              } catch (e) { console.error('R2 download ERR: ' + file + ' - ' + e.message); }
            }
            console.log('R2 download complete');
            // R2 freshness gate (INF-ZJP-SYSTEM-REDESIGN-1 slice B, 2026-08-15): pipeline-stop detector.
            // Fail closed. Alert mapping: pipeline-stop class is alarmed by check-25 (zjp-metrics staleness).
            const setOut = v => fs.appendFileSync(process.env.GITHUB_OUTPUT, 'pipeline_fresh=' + v + '\n');
            try {
              const m = await r2.head('all_jobs.json');
              const ageMin = m && m.lastModified ? (Date.now() - new Date(m.lastModified).getTime())/60000 : NaN;
              if (!Number.isFinite(ageMin) || ageMin > 120) {
                console.log('::warning::FRESHNESS GATE SKIP: all_jobs.json age=' + (Number.isFinite(ageMin)?Math.round(ageMin):'?') + 'min (limit 120) — pipeline stopped; skipping stale-data processing');
                setOut('false');
              } else { console.log('FRESHNESS GATE PASS: all_jobs.json ' + Math.round(ageMin) + 'min old'); setOut('true'); }
            } catch(e) { console.log('::warning::FRESHNESS GATE SKIP: heartbeat check failed — ' + e.message); setOut('false'); }

          }
          main().catch(e => { console.error('R2 fatal: ' + e.message); process.exit(1); });
          "
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Post daily stats to Discord
        if: success() && steps.r2fetch.outputs.pipeline_fresh == 'true'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TEAM_TOKEN }}
          DISCORD_DAILY_STATS_CHANNEL_ID: ${{ secrets.DISCORD_DAILY_STATS_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: node .github/scripts/processing/lib/daily-stats.js

      - name: Commit updated stats file
        if: success() && steps.r2fetch.outputs.pipeline_fresh == 'true'
        continue-on-error: true
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          git add .github/data/daily-stats.json .github/data/history.jsonl .github/data/history-archive.jsonl .github/data/traffic-history.jsonl 2>/dev/null || true
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: update daily-stats.json [skip ci]"
          for i in 1 2 3; do
            git stash --include-untracked
            git pull --rebase --strategy-option=theirs origin main
            git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
      - name: Upload dashboard data to R2 (INF-R2-GITCUTOVER-1)
        if: success()
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/upload-dashboard-data-to-r2.js daily-stats.json history.jsonl history-archive.jsonl traffic-history.jsonl

      - name: Publish to Supabase Edge (Phase 2 R2 elimination)
        if: success()
        continue-on-error: true
        run: node .github/scripts/processing/lib/publish-metrics-to-edge.js --data-dir .github/data
        env:
          EDGE_FUNCTION_URL: https://xxmhgagpbxjflajoaahy.supabase.co/functions/v1/publish-metrics-function
          PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}
