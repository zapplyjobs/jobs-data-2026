name: Daily GitHub Stats to Discord

on:
  schedule:
    - cron: '0 5 * * *'  # Midnight US Central (5 AM UTC)
  workflow_dispatch:

jobs:
  daily-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decrypt repository secrets
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/git-crypt-key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/git-crypt-key
          rm /tmp/git-crypt-key

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Post daily stats to Discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TEAM_TOKEN }}
          DISCORD_DAILY_STATS_CHANNEL_ID: ${{ secrets.DISCORD_DAILY_STATS_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: node .github/scripts/daily-stats.js

      - name: Commit updated stats file
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          git add .github/data/daily-stats.json .github/data/history.jsonl .github/data/history-archive.jsonl .github/data/traffic-history.jsonl 2>/dev/null || true
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: update daily-stats.json [skip ci]"
          # git-crypt's smudge filter re-runs on every index operation, causing
          # decrypted scripts to appear "modified" even after stash/checkout.
          # Bypass the filter during pull --rebase (same fix as enrich-jobs.yml INF-19).
          for i in 1 2 3; do
            git -c filter.git-crypt.smudge=cat -c filter.git-crypt.clean=cat -c filter.git-crypt.required=false pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
