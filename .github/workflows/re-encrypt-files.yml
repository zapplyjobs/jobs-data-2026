name: Re-encrypt plaintext files v3

on:
  repository_dispatch:
    types: [re-encrypt-v3]

jobs:
  re-encrypt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup git-crypt and unlock
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/key
          rm /tmp/key

      - name: Force re-encryption
        run: |
          for FILE in .github/scripts/discord-poster.js .github/scripts/pipeline-alert.js; do
            echo "=== Processing $FILE ==="
            BLOB_SHA=$(git ls-files -s "$FILE" | awk '{print $2}')
            FIRST_BYTES=$(git cat-file blob "$BLOB_SHA" | head -c 10)
            if echo "$FIRST_BYTES" | grep -q "GITCRYPT"; then
              echo "  Already encrypted in index — skipping"
            else
              echo "  PLAINTEXT in index — re-encrypting"
              git rm --cached "$FILE"
              git add "$FILE"
              NEW_BLOB=$(git ls-files -s "$FILE" | awk '{print $2}')
              NEW_BYTES=$(git cat-file blob "$NEW_BLOB" | head -c 10)
              if echo "$NEW_BYTES" | grep -q "GITCRYPT"; then
                echo "  SUCCESS — now encrypted in index"
              else
                echo "  FAILED — still plaintext after re-add"
              fi
            fi
          done

      - name: Commit and push
        run: |
          git config user.name "z-apply"
          git config user.email "admin@zapply.jobs"
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No staged changes — exiting"
            exit 0
          fi
          git commit -m "security: re-encrypt discord-poster.js + pipeline-alert.js

Both files stored as plaintext due to Git Data API pushes bypassing
git-crypt clean filter."
          git -c filter.git-crypt.smudge=cat pull --rebase origin main || true
          git push origin main
          echo "Pushed"
