# Trigger policy (AGG-WORKFLOW-DISPATCH-AUDIT-1, 2026-07-18): workflow_dispatch-only BY DESIGN.
# Manual dashboard tool (added 2026-07-01 in commit 045cb423 alongside source-coverage-audit).
# Operator invokes from the dashboard Tools tab on demand — not a regular-cadence workflow.
# If this changes (e.g., scheduled live-R2 verification), add `schedule:` and update this note.

name: Verify All Jobs (Live R2)
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git ls-files -z '*.js' '*.json' '*.jsonl' | xargs -0 rm -f
          git checkout HEAD -- .
          echo "Decrypt verification:" && head -1 .github/scripts/index.js 2>/dev/null || echo "(no index.js)"
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install shared deps
        run: cd .github/scripts/shared && npm install --no-audit --no-fund
      - name: Verify all_jobs.json against live R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          cd .github/scripts
          NODE_PATH=$GITHUB_WORKSPACE/.github/scripts/shared/node_modules node live-all-jobs-verify.js
