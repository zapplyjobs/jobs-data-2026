name: Fix enrich-jobs crash
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/key
          rm /tmp/key

      - name: Apply fix
        run: |
          FILE=".github/scripts/enrich-jobs.js"
          echo "=== BEFORE fix (lines 247 and 256) ==="
          sed -n '247p;256p' "$FILE"
          
          # Fix: Add additionalLocations to the outer scope declaration (line 247)
          sed -i '247s/let url, rawHtml;/let url, rawHtml, additionalLocations = null;/' "$FILE"
          
          # Remove the now-redundant inner declaration (line 256)
          sed -i '256s/^      let additionalLocations = null;$//' "$FILE"
          
          echo "=== AFTER fix ==="
          sed -n '245,260p' "$FILE"
          
          # Verify the fix didn't break syntax
          node -c "$FILE" && echo "Syntax OK" || { echo "SYNTAX ERROR — aborting"; exit 1; }

      - name: Commit and push
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          git add .github/scripts/enrich-jobs.js
          git commit -m "fix: move additionalLocations declaration to outer scope (OUT-14 crash fix)

ReferenceError at line 281: additionalLocations was declared inside the
workday-only branch but referenced in the shared rawHtml block that runs
for both workday and smartrecruiters jobs. SmartRecruiters path never
declared the variable, causing crash on first SR description fetch.

Fix: declare at outer scope alongside url and rawHtml.
Pipeline was down since 19:45Z Apr 9 (~5 hours)."
          git -c filter.git-crypt.smudge=cat -c filter.git-crypt.clean=cat -c filter.git-crypt.required=false pull --rebase origin main
          git push
