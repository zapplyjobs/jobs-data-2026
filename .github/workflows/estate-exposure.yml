name: Estate Exposure

# A341 estate exposure enforcement — weekly machinery for the approved architecture:
# detect -> auto-fix within GH_PAT scope -> record receipts -> escalate only what
# cannot be fixed. Quiet = healthy: green run + findings artifact + job summary
# table. A failing run IS the alert (no Discord layer, by design); an ALERT verdict
# additionally opens-or-updates ONE rolling issue ("estate-exposure ALERT") that the
# next green run comments and closes (round-two tree-hole 5, default GITHUB_TOKEN).
#
# Exit contract (estate convention, org-malware-rescan.sh):
#   0 = clean or all findings auto-fixed · 1 = unfixable findings (ALERT) ·
#   2 = infra/coverage hole (fail-closed — never report a blind estate as healthy)
#
# The selftest runs FIRST and is fail-closed: broken machinery can never mutate
# the live estate, because the scan step never starts.
# Manifest baseline: scripts/estate-visibility-manifest.txt (in scripts/** because
# *.json is transcrypt filter=crypt in this repo — allowlist precedent — and the
# repo content gate is deny-by-default outside allowlisted paths).

on:
  schedule:
    - cron: '37 8 * * 6'  # Saturdays 08:37Z — off the Mon-Fri 05:00-07:00Z cluster; zero 08:xx neighbors
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Detect + plan only; no auto-fix mutations (dress rehearsal)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write  # rolling estate-exposure ALERT issue (default GITHUB_TOKEN — no new secret)

concurrency:
  group: estate-exposure
  cancel-in-progress: false

jobs:
  exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Selftest the machinery (fail-closed gate before any live mutation)
        run: python3 scripts/estate-exposure-scan.py --selftest

      - name: Scan estate + auto-fix within token scope
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ESTATE_DRY_RUN: ${{ inputs.dry_run }}  # env-indirection, never inline ${{ }} in run script
        run: |
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true  # actions/checkout leaves GH_PAT auth here; it shadows GH_TOKEN on git calls (INF-RESCAN-SYNC-GAPS-1, 2026-11-10)
          ARGS=""
          if [ "$ESTATE_DRY_RUN" = "true" ]; then ARGS="--dry-run"; fi
          ESTATE_ARTIFACTS_DIR=/tmp/estate-exposure-artifacts \
            python3 scripts/estate-exposure-scan.py --scan $ARGS

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: estate-exposure-findings
          path: /tmp/estate-exposure-artifacts/findings.json
          if-no-files-found: warn

      - name: Fail loudly if no findings artifact was produced
        if: always()
        run: |
          if [ ! -s /tmp/estate-exposure-artifacts/findings.json ]; then
            echo "::error::scanner produced no findings.json (timeout/hang class) — treating as failure for the alert layer"
            exit 1
          fi

      - name: Rolling estate-exposure ALERT issue (open-or-update on ALERT; comment-and-close on green)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}  # default github.token is repo-scoped — the ALERT issue homes on zapplyjobs/.github (live-learned run 43658797461: jobs-data-2026 has issues disabled; only .github has them)
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Tree-hole 5 (A341 round-two): one rolling issue so a persisted ALERT is
          # visible beyond the Actions tab; the next green run comments and closes it.
          # Home: zapplyjobs/.github (only estate repo with issues enabled).
          # Non-fatal by design: the failing run IS the primary alert; this is a
          # persistence layer and must never repaint a green/red scan verdict.
          VERDICT="$(cat /tmp/estate-exposure-artifacts/verdict.txt 2>/dev/null || echo MISSING)"
          TITLE="estate-exposure ALERT"
          HOME_REPO="zapplyjobs/.github"
          BODY=/tmp/estate-exposure-artifacts/issue-body.md
          if ! NUM="$(gh issue list -R "$HOME_REPO" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty' 2>/dev/null)"; then
            echo "::warning::rolling ALERT issue unavailable (issues disabled or unreachable on $HOME_REPO) — the run verdict above remains the alert"
            exit 0
          fi
          if [ "$VERDICT" = "ALERT" ]; then
            { cat /tmp/estate-exposure-artifacts/summary.md; echo; echo "---"; echo "_Opened/updated by run $RUN_URL. This issue stays open until a green run closes it._"; } > "$BODY"
            if [ -n "$NUM" ]; then
              gh issue edit -R "$HOME_REPO" "$NUM" --title "$TITLE" --body-file "$BODY" && echo "rolling ALERT issue #$NUM updated"
            else
              gh issue create -R "$HOME_REPO" --title "$TITLE" --body-file "$BODY" && echo "rolling ALERT issue created"
            fi
          elif [ "$VERDICT" = "CLEAN" ] || [ "$VERDICT" = "ALL-FIXED" ]; then
            if [ -n "$NUM" ]; then
              gh issue comment -R "$HOME_REPO" "$NUM" --body "Resolved by green run (verdict $VERDICT): $RUN_URL"
              gh issue close -R "$HOME_REPO" "$NUM" && echo "rolling ALERT issue #$NUM closed by green run"
            else
              echo "green run, no open ALERT issue"
            fi
          else
            # INFRA/MISSING: no evidence of resolution — an open ALERT issue stays open (honest)
            echo "verdict $VERDICT — ALERT issue (if any) left untouched"
          fi
