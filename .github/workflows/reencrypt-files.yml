name: Re-encrypt plaintext files

on:
  repository_dispatch:
    types: [reencrypt-files]

jobs:
  reencrypt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup git-crypt and unlock
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/key
          rm /tmp/key

      - name: Check plaintext exposure
        run: |
          for FILE in ".github/scripts/enrich-jobs.js" ".github/scripts/pipeline-alert.js"; do
            echo "=== $FILE ==="
            BLOB=$(git cat-file blob $(git ls-files -s "$FILE" | awk '{print $2}') | head -c 20 | xxd | head -1)
            if echo "$BLOB" | grep -q "GITCRYPT"; then echo "Already encrypted"; else echo "PLAINTEXT - will re-encrypt"; fi
          done

      - name: Re-encrypt through clean filter
        run: |
          for FILE in ".github/scripts/enrich-jobs.js" ".github/scripts/pipeline-alert.js"; do
            git rm --cached "$FILE" 2>/dev/null || true
            git add "$FILE"
            BLOB_AFTER=$(git cat-file blob $(git ls-files -s "$FILE" | awk '{print $2}') | head -c 10)
            if echo "$BLOB_AFTER" | grep -q "GITCRYPT"; then echo "$FILE encrypted"; else echo "$FILE FAILED"; exit 1; fi
          done

      - name: Commit and push
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          if [ -n "$(git diff --cached)" ]; then
            git commit -m "fix(inf-22): re-encrypt enrich-jobs.js and pipeline-alert.js"
            for i in 1 2 3; do
              git -c filter.git-crypt.smudge=cat -c filter.git-crypt.clean=cat -c filter.git-crypt.required=false pull --rebase origin main && git push && break
              sleep 5
            done
          else
            echo "Already encrypted - nothing to commit"
          fi

      - name: Self-cleanup
        run: |
          git rm .github/workflows/reencrypt-files.yml
          git commit -m "chore: remove temp reencrypt workflow [skip ci]"
          for i in 1 2 3; do
            git -c filter.git-crypt.smudge=cat -c filter.git-crypt.clean=cat -c filter.git-crypt.required=false pull --rebase origin main && git push && break
            sleep 5
          done
