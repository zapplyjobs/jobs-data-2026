name: Debug enrich-jobs
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/key
          rm /tmp/key
      - name: Show crash area
        run: |
          echo "=== Lines 245-265 of pipeline-alert.js ==="
          sed -n '245,265p' .github/scripts/pipeline-alert.js
          echo ""
          echo "=== Syntax check ==="
          node -c .github/scripts/pipeline-alert.js 2>&1 || true
