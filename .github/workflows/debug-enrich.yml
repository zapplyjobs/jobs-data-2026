name: Debug enrich-jobs
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/key
          rm /tmp/key
      - name: Fix pipeline-alert.js
        run: |
          FILE=".github/scripts/pipeline-alert.js"
          echo "=== BEFORE (lines 226-232) ==="
          sed -n '226,232p' "$FILE"
          
          # Remove line 228 (premature runChecks close)
          sed -i '228d' "$FILE"
          
          echo "=== AFTER ==="
          sed -n '226,232p' "$FILE"
          
          # Syntax check
          node -c "$FILE" && echo "SYNTAX OK" || { echo "SYNTAX ERROR — aborting"; exit 1; }
      - name: Commit and push
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          git add .github/scripts/pipeline-alert.js
          # Also remove the debug workflow
          git rm .github/workflows/debug-enrich.yml 2>/dev/null || true
          git commit -m "fix: remove premature closing brace in pipeline-alert (OUT-13 bug)

S262 OUT-13 commit added Check 13 (consumer repo freshness) inside
runChecks() but didn't remove the closing brace that preceded it.
This left Check 13 outside the function body and created an extra
orphaned brace at line 254. Pipeline alert has been failing for 36h.

Fix: remove the premature } at line 228."
          git -c filter.git-crypt.smudge=cat -c filter.git-crypt.clean=cat -c filter.git-crypt.required=false pull --rebase origin main
          git push origin main
