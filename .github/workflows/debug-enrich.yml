name: Debug enrich-jobs
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/key
          rm /tmp/key
      - name: Show file
        run: |
          wc -l .github/scripts/pipeline-alert.js
          echo "=== Lines 250-280 ==="
          sed -n '250,280p' .github/scripts/pipeline-alert.js
          echo "=== Full syntax check ==="
          node -c .github/scripts/pipeline-alert.js 2>&1 || true
          echo "=== Brace count ==="
          grep -c '{' .github/scripts/pipeline-alert.js
          grep -c '}' .github/scripts/pipeline-alert.js
