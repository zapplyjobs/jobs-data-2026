name: Fix visa status in Discord embeds

on:
  repository_dispatch:
    types: [fix-visa]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/key
          rm /tmp/key

      - name: Fix visa status logic
        run: |
          python3 -c "
          with open('.github/scripts/discord-poster.js') as f:
              code = f.read()
          if 'Confirmed Sponsor' in code:
              print('Already updated — skipping')
              exit(0)
          if 'Sponsors Visa' not in code:
              print('ERROR: Cannot find Sponsors Visa in code')
              exit(1)
          lines = code.split('\n')
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              # Find the visa block start
              if 'visa_question_present === true' in line and 'if' in line:
                  # Find the indent
                  indent = line[:len(line) - len(line.lstrip())]
                  # Skip until we find the closing brace of this if block
                  brace_count = 0
                  j = i
                  while j < len(lines):
                      brace_count += lines[j].count('{') - lines[j].count('}')
                      if brace_count <= 0:
                          break
                      j += 1
                  # Also skip the comment line above if it mentions visa/UX-2
                  if i > 0 and ('visa' in lines[i-1].lower() or 'UX-2' in lines[i-1]):
                      out.pop()  # remove the comment we already added
                  # Write replacement
                  out.append(indent + '// Visa sponsorship (LCA match OR ATS form detection)')
                  out.append(indent + 'if (enriched) {')
                  out.append(indent + '  if (enriched.possible_sponsor === true || enriched.visa_question_present === true) {')
                  out.append(indent + \"    embed.addFields({ name: '\\U0001f310 Visa', value: 'Confirmed Sponsor', inline: true });\")
                  out.append(indent + '  } else {')
                  out.append(indent + \"    embed.addFields({ name: '\\U0001f310 Visa', value: 'Unconfirmed', inline: true });\")
                  out.append(indent + '  }')
                  out.append(indent + '}')
                  i = j + 1
                  continue
              out.append(line)
              i += 1
          with open('.github/scripts/discord-poster.js', 'w') as f:
              f.write('\n'.join(out))
          print('Visa block replaced successfully')
          "
          echo "=== Verify ==="
          grep -n "Confirmed Sponsor\|Unconfirmed\|possible_sponsor" .github/scripts/discord-poster.js | head -5

      - name: Commit through git-crypt
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          git add .github/scripts/discord-poster.js
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "feat(out-10): visa status — Confirmed Sponsor / Unconfirmed in Discord embeds"
          for i in 1 2 3; do
            git -c filter.git-crypt.smudge=cat -c filter.git-crypt.clean=cat -c filter.git-crypt.required=false pull --rebase origin main && git push && break
            echo "Retry $i..."; sleep 5
          done

      - name: Self-cleanup
        run: |
          git rm .github/workflows/fix-visa-embeds.yml
          git commit -m "chore: remove temp fix-visa-embeds workflow [skip ci]"
          for i in 1 2 3; do
            git -c filter.git-crypt.smudge=cat -c filter.git-crypt.clean=cat -c filter.git-crypt.required=false pull --rebase origin main && git push && break
            sleep 5
          done
