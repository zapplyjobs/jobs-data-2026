name: Cleanup Discord Posts

on:
  workflow_dispatch:
    inputs:
      window_older_than_hours:
        description: '[WINDOW] Far end of window — how many hours ago the window ENDS. e.g. 3 = stop at messages posted 3h ago. Set BOTH window fields to activate window mode. Example: window_older=3, window_newer=1 → deletes messages posted between 1h and 3h ago.'
        required: false
        default: ''
      window_newer_than_hours:
        description: '[WINDOW] Near end of window — how many hours ago the window STARTS. e.g. 1 = start from messages posted 1h ago. Set BOTH window fields to activate window mode. Example: window_older=3, window_newer=1 → deletes messages posted between 1h and 3h ago.'
        required: false
        default: ''
      last_n_hours:
        description: '[SIMPLE] Delete all messages posted in the last N hours. e.g. 4 = delete everything posted in the last 4 hours. Ignored if both window fields are set.'
        required: false
        default: ''
      older_than_hours:
        description: '[EXPIRY] Delete messages older than N hours. Default 336 = 14 days (standard expiry run). Ignored if window or last_n_hours is set.'
        required: false
        default: '336'
      dry_run:
        description: 'Preview only — shows what would be deleted without actually deleting. Set to false to execute. Default: true.'
        type: boolean
        required: false
        default: true
      remove_from_posted:
        description: 'After deleting, also remove those jobs from posted_jobs.json so they get reposted by the next cron run. Default: false (deleted messages stay gone).'
        type: boolean
        required: false
        default: false
      channel_ids:
        description: 'Limit to specific channels. Comma-separated channel IDs. Leave empty to run across all 23 channels.'
        required: false
        default: ''

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run Discord cleanup
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          WINDOW_OLDER_THAN_HOURS: ${{ inputs.window_older_than_hours }}
          WINDOW_NEWER_THAN_HOURS: ${{ inputs.window_newer_than_hours }}
          LAST_N_HOURS: ${{ inputs.last_n_hours }}
          OLDER_THAN_HOURS: ${{ inputs.older_than_hours }}
          DRY_RUN: ${{ inputs.dry_run }}
          REMOVE_FROM_POSTED: ${{ inputs.remove_from_posted }}
          CHANNEL_IDS: ${{ inputs.channel_ids }}

          # New-Grad channels (11)
          DISCORD_TECH_CHANNEL_ID: ${{ secrets.DISCORD_TECH_CHANNEL_ID }}
          DISCORD_AI_CHANNEL_ID: ${{ secrets.DISCORD_AI_CHANNEL_ID }}
          DISCORD_DS_CHANNEL_ID: ${{ secrets.DISCORD_DS_CHANNEL_ID }}
          DISCORD_FINANCE_CHANNEL_ID: ${{ secrets.DISCORD_FINANCE_CHANNEL_ID }}
          DISCORD_NURSING_CHANNEL_ID: ${{ secrets.DISCORD_NURSING_CHANNEL_ID }}
          DISCORD_OTHER_INDUSTRY_CHANNEL_ID: ${{ secrets.DISCORD_OTHER_INDUSTRY_CHANNEL_ID }}
          DISCORD_BAY_AREA_CHANNEL_ID: ${{ secrets.DISCORD_BAY_AREA_CHANNEL_ID }}
          DISCORD_NY_CHANNEL_ID: ${{ secrets.DISCORD_NY_CHANNEL_ID }}
          DISCORD_PNW_CHANNEL_ID: ${{ secrets.DISCORD_PNW_CHANNEL_ID }}
          DISCORD_REMOTE_USA_CHANNEL_ID: ${{ secrets.DISCORD_REMOTE_USA_CHANNEL_ID }}
          DISCORD_OTHER_USA_CHANNEL_ID: ${{ secrets.DISCORD_OTHER_USA_CHANNEL_ID }}

          # Internship channels (12)
          DISCORD_TECH_INT_CHANNEL_ID: ${{ secrets.DISCORD_TECH_INT_CHANNEL_ID }}
          DISCORD_AI_INT_CHANNEL_ID: ${{ secrets.DISCORD_AI_INT_CHANNEL_ID }}
          DISCORD_DS_INT_CHANNEL_ID: ${{ secrets.DISCORD_DS_INT_CHANNEL_ID }}
          DISCORD_SALES_INT_CHANNEL_ID: ${{ secrets.DISCORD_SALES_INT_CHANNEL_ID }}
          DISCORD_MARKETING_INT_CHANNEL_ID: ${{ secrets.DISCORD_MARKETING_INT_CHANNEL_ID }}
          DISCORD_OTHER_INDUSTRY_INT_CHANNEL_ID: ${{ secrets.DISCORD_OTHER_INDUSTRY_INT_CHANNEL_ID }}
          DISCORD_REMOTE_USA_INT_CHANNEL_ID: ${{ secrets.DISCORD_REMOTE_USA_INT_CHANNEL_ID }}
          DISCORD_BAY_AREA_INT_CHANNEL_ID: ${{ secrets.DISCORD_BAY_AREA_INT_CHANNEL_ID }}
          DISCORD_NY_INT_CHANNEL_ID: ${{ secrets.DISCORD_NY_INT_CHANNEL_ID }}
          DISCORD_PNW_INT_CHANNEL_ID: ${{ secrets.DISCORD_PNW_INT_CHANNEL_ID }}
          DISCORD_SOCAL_INT_CHANNEL_ID: ${{ secrets.DISCORD_SOCAL_INT_CHANNEL_ID }}
          DISCORD_OTHER_USA_INT_CHANNEL_ID: ${{ secrets.DISCORD_OTHER_USA_INT_CHANNEL_ID }}

        run: node .github/scripts/cleanup-discord-posts.js

      - name: Commit updated posted_jobs.json
        if: ${{ inputs.dry_run == false && inputs.remove_from_posted == true }}
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          git add .github/data/posted_jobs.json || exit 0
          git diff --staged --quiet || git commit -m "chore: remove cleanup-deleted messages from posted_jobs.json for repost [skip ci]"
          git push
