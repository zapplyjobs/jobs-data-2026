name: Verify Discord Posts

on:
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger
  workflow_dispatch:

  # Run after posting workflow completes
  workflow_run:
    workflows: ["Post Jobs to Discord"]
    types:
      - completed

jobs:
  verify:
    name: Verify Discord Channels
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decrypt repository secrets
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/git-crypt-key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/git-crypt-key
          rm /tmp/git-crypt-key

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Verify Discord posts
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}

          # New-Grad industry channels
          DISCORD_TECH_CHANNEL_ID: ${{ secrets.DISCORD_TECH_CHANNEL_ID }}
          DISCORD_AI_CHANNEL_ID: ${{ secrets.DISCORD_AI_CHANNEL_ID }}
          DISCORD_DS_CHANNEL_ID: ${{ secrets.DISCORD_DS_CHANNEL_ID }}
          DISCORD_FINANCE_CHANNEL_ID: ${{ secrets.DISCORD_FINANCE_CHANNEL_ID }}
          DISCORD_BUSINESS_CHANNEL_ID: ${{ secrets.DISCORD_BUSINESS_CHANNEL_ID }}
          DISCORD_HEALTHCARE_CHANNEL_ID: ${{ secrets.DISCORD_HEALTHCARE_CHANNEL_ID }}
          DISCORD_HARDWARE_CHANNEL_ID: ${{ secrets.DISCORD_HARDWARE_CHANNEL_ID }}
          DISCORD_SALES_CHANNEL_ID: ${{ secrets.DISCORD_SALES_CHANNEL_ID }}
          DISCORD_OTHER_INDUSTRY_CHANNEL_ID: ${{ secrets.DISCORD_OTHER_INDUSTRY_CHANNEL_ID }}

          # New-Grad location channels
          DISCORD_BAY_AREA_CHANNEL_ID: ${{ secrets.DISCORD_BAY_AREA_CHANNEL_ID }}
          DISCORD_NY_CHANNEL_ID: ${{ secrets.DISCORD_NY_CHANNEL_ID }}
          DISCORD_PNW_CHANNEL_ID: ${{ secrets.DISCORD_PNW_CHANNEL_ID }}
          DISCORD_REMOTE_USA_CHANNEL_ID: ${{ secrets.DISCORD_REMOTE_USA_CHANNEL_ID }}
          DISCORD_OTHER_USA_CHANNEL_ID: ${{ secrets.DISCORD_OTHER_USA_CHANNEL_ID }}

          # Internship industry channels
          DISCORD_TECH_INT_CHANNEL_ID: ${{ secrets.DISCORD_TECH_INT_CHANNEL_ID }}
          DISCORD_AI_INT_CHANNEL_ID: ${{ secrets.DISCORD_AI_INT_CHANNEL_ID }}
          DISCORD_DS_INT_CHANNEL_ID: ${{ secrets.DISCORD_DS_INT_CHANNEL_ID }}
          DISCORD_SALES_INT_CHANNEL_ID: ${{ secrets.DISCORD_SALES_INT_CHANNEL_ID }}
          DISCORD_MARKETING_INT_CHANNEL_ID: ${{ secrets.DISCORD_MARKETING_INT_CHANNEL_ID }}
          DISCORD_BUSINESS_INT_CHANNEL_ID: ${{ secrets.DISCORD_BUSINESS_INT_CHANNEL_ID }}
          DISCORD_HEALTHCARE_INT_CHANNEL_ID: ${{ secrets.DISCORD_HEALTHCARE_INT_CHANNEL_ID }}
          DISCORD_OTHER_INDUSTRY_INT_CHANNEL_ID: ${{ secrets.DISCORD_OTHER_INDUSTRY_INT_CHANNEL_ID }}

          # Internship location channels
          DISCORD_REMOTE_USA_INT_CHANNEL_ID: ${{ secrets.DISCORD_REMOTE_USA_INT_CHANNEL_ID }}
          DISCORD_BAY_AREA_INT_CHANNEL_ID: ${{ secrets.DISCORD_BAY_AREA_INT_CHANNEL_ID }}
          DISCORD_NY_INT_CHANNEL_ID: ${{ secrets.DISCORD_NY_INT_CHANNEL_ID }}
          DISCORD_PNW_INT_CHANNEL_ID: ${{ secrets.DISCORD_PNW_INT_CHANNEL_ID }}
          DISCORD_SOCAL_INT_CHANNEL_ID: ${{ secrets.DISCORD_SOCAL_INT_CHANNEL_ID }}
          DISCORD_OTHER_USA_INT_CHANNEL_ID: ${{ secrets.DISCORD_OTHER_USA_INT_CHANNEL_ID }}
        run: node .github/scripts/verify-discord.js

      - name: Post results to summary (private - repo access only)
        if: always()
        run: |
          if [ -f /tmp/verification-summary.json ]; then
            echo "# Discord Verification Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat /tmp/verification-summary.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit verification results
        run: |
          git config user.name "z-apply"
          git config user.email "admin@zapply.jobs"
          git add .github/data/discord-verification.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update discord verification [skip ci]"
          for i in 1 2 3; do
            git -c filter.git-crypt.smudge=cat -c filter.git-crypt.clean=cat -c filter.git-crypt.required=false pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

      - name: Delete temporary files
        if: always()
        run: |
          rm -f /tmp/verification-summary.json
          rm -f /tmp/verification-report.enc
