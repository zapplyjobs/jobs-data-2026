name: Monthly GitHub Summary to Discord

on:
  schedule:
    - cron: '0 5 1 * *'  # 1st of each month, midnight US Central (5 AM UTC)
  workflow_dispatch:

jobs:
  monthly-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt
        run: |
          # INF-UNLOCK-INTERMITTENT-1: -sSL without -f silently installs raw.github's 429
          # rate-limit PAGE as the binary (observed 2026-08-17: 8 workflow failures in a 80-min
          # throttled window). Fail on HTTP errors, retry 3x, and verify it's a script.
          for i in 1 2 3; do
            curl -sfSL "https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt" -o /tmp/transcrypt && break
            echo "transcrypt download attempt $i failed — retrying in 15s"; sleep 15
          done
          [ -s /tmp/transcrypt ] || { echo "::error::transcrypt download failed after retries"; exit 1; }
          head -c2 /tmp/transcrypt | grep -q '#!' || { echo "::error::transcrypt download is not a script (rate-limit page?) — refusing to install"; exit 1; }
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true

          # Verify submodule decryption succeeded (INF-TRANSCRYPT-KEY-BACKUP-1).
          SAMPLE_JS=$(find .github/scripts -name '*.js' -print -quit 2>/dev/null)
          if [ -n "$SAMPLE_JS" ]; then
            if ! file -b "$SAMPLE_JS" | grep -qiE 'ASCII|UTF-8|text'; then
              echo "::error::Submodule decryption FAILED — $SAMPLE_JS is ciphertext. Pipeline would run garbage. Check TRANSCRYPT_PASSWORD + transcrypt unlock."
              exit 1
            fi
          fi
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .github/scripts/processing/package-lock.json


      - name: Install processing submodule dependencies (executed scripts resolve discord.js/supabase there)
        run: cd .github/scripts/processing && npm install

      - name: Post monthly summary to Discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TEAM_TOKEN }}
          DISCORD_WEEKLY_STATS_CHANNEL_ID: ${{ secrets.DISCORD_WEEKLY_STATS_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: node .github/scripts/processing/lib/monthly-summary.js

      - name: Commit updated stats file
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          git add .github/data/monthly-stats.json || exit 0
          git commit -m "chore: update monthly-stats.json [skip ci]" || exit 0
          for i in 1 2 3; do
            git stash --include-untracked
            git pull --rebase --strategy-option=theirs origin main
            git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
