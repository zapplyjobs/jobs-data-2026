name: Delete Specific Messages (One-off)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - preview without deleting (default: true)'
        type: boolean
        required: false
        default: true

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Delete specific messages
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node .github/scripts/delete-specific-messages.js

      - name: Commit updated posted_jobs.json
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "z-apply"
          git config user.email "admin@zapply.jobs"
          git add .github/data/posted_jobs.json
          git diff --staged --quiet || git commit -m "chore: remove wrong-numbered MongoDB posts for repost [skip ci]"
          git push
