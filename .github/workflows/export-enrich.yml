name: Export enrich-jobs

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/git-crypt-key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/git-crypt-key
          rm /tmp/git-crypt-key

      - name: Export
        run: |
          wc -l .github/scripts/enrich-jobs.js
          head -50 .github/scripts/enrich-jobs.js
          echo "---ENRICH-JOBS-START---"
          cat .github/scripts/enrich-jobs.js
          echo "---ENRICH-JOBS-END---"
