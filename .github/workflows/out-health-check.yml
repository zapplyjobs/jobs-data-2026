name: OUT Health Check
# OUT monitoring plan Phase 3: hourly automated health checks.
# Public repo = unlimited Actions minutes. Authenticated API = 5000 req/hr.
# Checks:
#   1. Board API health (softwarejobs.dev + zapply.jobs) — 200 + fresh data
#   2. Settings drift (12 repos) — discussions on, wiki off, homepage set, topics present
#   3. Exposed secrets scan (12 READMEs) — no secret patterns in public READMEs
#   4. README freshness (8 pipeline repos) — last push <6h
#   5. Workflow status (8 pipeline repos) — last run not failing
# On failure: updates tracking issue for operator visibility.
on:
  schedule:
    - cron: '0 * * * *'  # Hourly
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/out-health-check.yml'

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Run OUT health checks
      id: checks
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      run: |
        python3 - <<'PYEOF'
        import json, urllib.request, datetime, sys, os, time
        gh_token = os.environ.get("GH_TOKEN", "")

        now = datetime.datetime.now(datetime.timezone.utc)
        results = {"generated_at": now.isoformat(), "destinations": [], "repos": [], "verdict": "PASS"}
        issues = []

        # --- 1. Board API health ---
        destinations = [
            ("softwarejobs.dev", "https://softwarejobs.dev/api/jobs?page=1&per_page=5"),
            ("zapply.jobs", "https://zapply.jobs/api/jobs/?page=1&per_page=5"),
        ]
        for name, url in destinations:
            r = {"name": name, "verdict": "FAIL", "reason": ""}
            board_data = None
            board_status = None
            last_err = None
            for attempt in range(3):
                try:
                    req = urllib.request.Request(url, headers={"User-Agent": "out-health-check/1.0"})
                    t_start = time.time()
                    with urllib.request.urlopen(req, timeout=20) as resp:
                        board_data = json.loads(resp.read())
                        board_status = resp.status
                    r["response_ms"] = round((time.time() - t_start) * 1000)
                    break
                except Exception as e:
                    last_err = e
                    if attempt < 2:
                        time.sleep(5)
            if board_data is not None:
                data = board_data
                status = board_status
                if status != 200:
                    r["reason"] = f"HTTP {status}"
                    issues.append(f"{name}: HTTP {status}")
                else:
                    jobs = data.get("jobs", data) if isinstance(data, dict) else data
                    count = len(jobs) if isinstance(jobs, list) else 0
                    if count < 3:
                        r["reason"] = f"only {count} jobs"
                        issues.append(f"{name}: only {count} jobs")
                    else:
                        # Check freshness via 'posted' field
                        freshest = None
                        for j in (jobs[:10] if isinstance(jobs, list) else []):
                            posted = j.get("posted")
                            if not posted:
                                continue
                            try:
                                dt = datetime.datetime.fromisoformat(str(posted).replace("Z", "+00:00"))
                                age_h = (now - dt).total_seconds() / 3600
                                if freshest is None or age_h < freshest:
                                    freshest = age_h
                            except ValueError:
                                continue
                        if freshest is None:
                            r["reason"] = "no parseable posted timestamp"
                            issues.append(f"{name}: no freshness signal")
                        elif freshest > 72:
                            r["reason"] = f"stale: freshest {freshest:.1f}h old"
                            issues.append(f"{name}: stale ({freshest:.1f}h)")
                        else:
                            r["verdict"] = "PASS"
                            r["job_count"] = count
                            r["freshest_age_h"] = round(freshest, 1)
            else:
                # All retries failed
                r["reason"] = f"fetch failed after 3 retries: {last_err}"
                issues.append(f"{name}: fetch failed after retries ({last_err})")
            results["destinations"].append(r)

        # --- 2. Settings drift + secrets scan (12 repos) ---
        import re
        repos = [
            "New-Grad-Jobs-2027", "Internships-2027",
            "New-Grad-Software-Engineering-Jobs-2027", "New-Grad-Data-Science-Jobs-2027",
            "New-Grad-Hardware-Engineering-Jobs-2027", "New-Grad-Healthcare-Jobs-2027",
            "Canada-Jobs-2027", "Canada-Internships-2027",
            "Research-Internships-for-Undergraduates", "underclassmen-internships",
            "resume-samples-2026", "interview-handbook-2026",
        ]
        secret_re = re.compile(r"goLiveSecrets|R2_ACCESS_KEY|R2_SECRET_KEY|R2_ENDPOINT|SUPABASE_SERVICE_KEY|SUPABASE_SERVICE_ROLE|DISCORD_WEBHOOK|GITHUB_TOKEN|ghp_[a-zA-Z0-9]")

        for repo in repos:
            r = {"repo": repo, "verdict": "PASS", "issues": []}
            # Settings via unauthenticated GitHub API (public repos)
            try:
                req = urllib.request.Request(
                    f"https://api.github.com/repos/zapplyjobs/{repo}",
                    headers={"User-Agent": "out-health-check/1.0", "Accept": "application/vnd.github+json", "Authorization": f"token {gh_token}"}
                )
                with urllib.request.urlopen(req, timeout=10) as resp:
                    info = json.loads(resp.read())
                disc = info.get("has_discussions")
                wiki = info.get("has_wiki")
                homepage = info.get("homepage", "")
                topics = len(info.get("topics", []))
                pushed_at = info.get("pushed_at", "")
                default_branch = info.get("default_branch", "main")
                if disc is not True:
                    r["issues"].append(f"discussions={disc} (should be true)")
                if wiki is True:
                    r["issues"].append(f"wiki=true (should be false)")
                if not homepage:
                    r["issues"].append("homepage not set")
                if topics < 1:
                    r["issues"].append(f"no topics ({topics})")
            except Exception as e:
                r["issues"].append(f"settings fetch failed: {e}")

            # Secrets scan
            try:
                req = urllib.request.Request(
                    f"https://raw.githubusercontent.com/zapplyjobs/{repo}/{default_branch}/README.md",
                    headers={"User-Agent": "out-health-check/1.0"}
                )
                with urllib.request.urlopen(req, timeout=10) as resp:
                    readme = resp.read().decode("utf-8", errors="replace")
                hits = sorted(set(secret_re.findall(readme)))
                if hits:
                    r["issues"].append(f"EXPOSED SECRETS: {hits}")
            except Exception as e:
                # Non-fatal: README timeout shouldn't fail entire health check
                print(f"WARNING: {repo}: README fetch failed — secrets scan skipped (non-fatal): {e}")

            # README freshness — flag pipeline repos with stale pushes (>6h)
            pipeline_repos = repo in ("New-Grad-Jobs-2027", "Internships-2027",
                "New-Grad-Software-Engineering-Jobs-2027", "New-Grad-Data-Science-Jobs-2027",
                "New-Grad-Hardware-Engineering-Jobs-2027", "New-Grad-Healthcare-Jobs-2027",
                "Canada-Jobs-2027", "Canada-Internships-2027")
            if pushed_at and pipeline_repos:
                try:
                    push_dt = datetime.datetime.fromisoformat(pushed_at.replace("Z", "+00:00"))
                    push_age_h = (now - push_dt).total_seconds() / 3600
                    r["last_push_age_h"] = round(push_age_h, 1)
                    if push_age_h > 6:
                        r["issues"].append(f"README stale: last push {push_age_h:.1f}h ago (>6h threshold)")
                except (ValueError, TypeError):
                    pass

            # README data quality check (OUT-MONITORING-README-DATA-QUALITY-1)
            # Check one representative repo for visa fill rate + date coverage
            if repo == "New-Grad-Jobs-2027":
                readme_text = locals().get('readme', '')
                if readme_text:
                    try:
                        job_rows = readme_text.count('images/apply.png')
                        visa_sponsor = readme_text.count('✅ Sponsor')
                        visa_h1b = readme_text.count('🏛 H-1B')
                        undated = readme_text.count('Undated') + readme_text.count('Date unknown')
                        if job_rows > 0:
                            visa_rate = round((visa_sponsor + visa_h1b) / job_rows * 100, 1)
                            undated_rate = round(undated / job_rows * 100, 1)
                            r["readme_visa_pct"] = visa_rate
                            r["readme_undated_pct"] = undated_rate
                            if visa_rate < 10:
                                r["issues"].append(f"README visa fill {visa_rate}% (<10% threshold — enrichment may not be reaching README)")
                            if undated_rate > 80:
                                r["issues"].append(f"README {undated_rate}% Undated (>80% — posted_at may be missing upstream)")
                    except Exception as e:
                        print(f"WARNING: README data quality check failed (non-fatal): {e}")

            # Consumer-repo workflow status REMOVED — repos are now pure display
            # (INF Phase 4 architecture change: centralized pipeline generates READMEs).
            # README freshness (pushed_at check above) is sufficient to verify repos are updating.

            if r["issues"]:
                r["verdict"] = "FAIL"
                for i in r["issues"]:
                    issues.append(f"{repo}: {i}")
            results["repos"].append(r)

        # --- 3. Pipeline workflow status (critical jobs-data-2026 workflows) ---
        critical_workflows = ["Post Jobs to Discord", "Verify Discord Posts", "Refresh ZJP Public Snapshot", "Collect Metrics"]
        try:
            req = urllib.request.Request(
                "https://api.github.com/repos/zapplyjobs/jobs-data-2026/actions/runs?per_page=30",
                headers={"User-Agent": "out-health-check/1.0", "Accept": "application/vnd.github+json", "Authorization": f"token {gh_token}"}
            )
            with urllib.request.urlopen(req, timeout=10) as resp:
                runs_data = json.loads(resp.read())
            latest_by_wf = {}
            for run in runs_data.get("workflow_runs", []):
                wf_name = run.get("name", "?")
                if wf_name in critical_workflows and wf_name not in latest_by_wf:
                    latest_by_wf[wf_name] = run
            pipeline_wf_results = []
            for wf_name in critical_workflows:
                run = latest_by_wf.get(wf_name)
                if run:
                    conclusion = run.get("conclusion", "unknown")
                    wf_r = {"workflow": wf_name, "conclusion": conclusion}
                    if conclusion == "failure":
                        wf_r["verdict"] = "FAIL"
                        issues.append(f"pipeline workflow '{wf_name}' FAILING")
                    else:
                        wf_r["verdict"] = "PASS"
                    pipeline_wf_results.append(wf_r)
                else:
                    pipeline_wf_results.append({"workflow": wf_name, "verdict": "UNKNOWN", "reason": "no recent run"})
            results["pipeline_workflows"] = pipeline_wf_results
        except Exception:
            pass

        # --- 4. Self-check: issues must be enabled for alerting to work ---
        try:
            req = urllib.request.Request(
                "https://api.github.com/repos/zapplyjobs/jobs-data-2026",
                headers={"User-Agent": "out-health-check/1.0", "Accept": "application/vnd.github+json", "Authorization": f"token {gh_token}"}
            )
            with urllib.request.urlopen(req, timeout=10) as resp:
                self_info = json.loads(resp.read())
            if not self_info.get("has_issues"):
                issues.append("jobs-data-2026: issues DISABLED — alerting cannot create tracking issues")
        except Exception:
            pass

        # --- Aggregate ---
        results["verdict"] = "FAIL" if issues else "PASS"
        results["issue_count"] = len(issues)

        # Write step outputs (using Environment Files, not deprecated ::set-output)
        with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as gh_out:
            gh_out.write(f"verdict={results['verdict']}\n")
            gh_out.write(f"issue_count={len(issues)}\n")

        summary_lines = ["## OUT Health Check", "",
            f"**Verdict:** {'PASS ✅' if results['verdict'] == 'PASS' else 'FAIL ❌'}",
            f"**Generated:** {results['generated_at']}", "",
            "### Board API Health", ""]
        for d in results["destinations"]:
            mark = "✅" if d["verdict"] == "PASS" else "❌"
            ms = d.get('response_ms', '?')
            detail = f"{d.get('job_count','?')} jobs, freshest {d.get('freshest_age_h','?')}h, {ms}ms" if d["verdict"] == "PASS" else d["reason"]
            summary_lines.append(f"- {mark} **{d['name']}** — {detail}")

        summary_lines += ["", "### Repo Settings + Secrets", ""]
        for r in results["repos"]:
            mark = "✅" if r["verdict"] == "PASS" else "❌"
            detail = "; ".join(r["issues"]) if r["issues"] else "OK"
            summary_lines.append(f"- {mark} **{r['repo']}** — {detail}")

        if results.get("pipeline_workflows"):
            summary_lines += ["", "### Pipeline Workflows", ""]
            for wf in results["pipeline_workflows"]:
                mark = "✅" if wf.get("verdict") == "PASS" else "❌"
                detail = wf.get("conclusion", wf.get("reason", "?"))
                summary_lines.append(f"- {mark} **{wf['workflow']}** — {detail}")

        if issues:
            summary_lines += ["", "### Issues", ""]
            for i in issues:
                summary_lines.append(f"- {i}")

        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
            f.write("\n".join(summary_lines) + "\n")

        print("\n".join(summary_lines))

        # Persist results to Storage + R2 (recovery plan v2: R2 is canonical object store)
        try:
            _url = f"{os.environ.get('SUPABASE_URL', '')}/storage/v1/object/pipeline-data/out-health-check.json"
            _req = urllib.request.Request(_url, method='PUT',
                data=json.dumps(results, indent=2).encode(),
                headers={'Authorization': f"Bearer {os.environ.get('SUPABASE_SERVICE_ROLE_KEY', '')}",
                         'apikey': os.environ.get('SUPABASE_SERVICE_ROLE_KEY', ''),
                         'Content-Type': 'application/json'})
            urllib.request.urlopen(_req, timeout=15)
            print("Results uploaded to Storage: pipeline-data/out-health-check.json")
        except Exception as e:
            issues.append(f"Storage upload failed: {e}")
            print(f"Storage upload failed: {e}")

        # R2 dual-write (recovery plan v2)
        try:
            import boto3
            _s3 = boto3.client('s3',
                endpoint_url=os.environ.get('R2_ENDPOINT', ''),
                aws_access_key_id=os.environ.get('R2_ACCESS_KEY_ID', ''),
                aws_secret_access_key=os.environ.get('R2_SECRET_ACCESS_KEY', ''))
            _s3.put_object(Bucket=os.environ.get('R2_BUCKET_NAME', 'zjp-data'),
                           Key='out-health-check.json',
                           Body=json.dumps(results, indent=2).encode(),
                           ContentType='application/json')
            print("R2 upload OK: out-health-check.json")
        except Exception as e:
            print(f"R2 upload failed (non-blocking): {e}")

        if issues:
            sys.exit(1)
        PYEOF

    - name: Create or update tracking issue on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const title = 'OUT Health Check Failed';
          const body = `The hourly OUT health check failed on ${new Date().toISOString()}.\n\nSee [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.\n\nThis issue is auto-created and should be investigated.`;
          // Check for existing open issue
          const existing = await github.rest.issues.listForRepo({
            ...context.repo,
            state: 'open',
            labels: 'out-health,auto-created',
            per_page: 1
          });
          if (existing.data.length > 0) {
            // Add comment to existing issue
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: existing.data[0].number,
              body
            });
          } else {
            await github.rest.issues.create({
              ...context.repo,
              title,
              body,
              labels: ['out-health', 'auto-created']
            });
          }
