name: OUT Health Check
# OUT monitoring plan Phase 3: shift health checks from local/session-triggered
# to scheduled/online. Runs daily + on dispatch. Checks:
#   1. Board API health (softwarejobs.dev + zapply.jobs) — 200 + fresh data
#   2. Settings drift (12 repos) — discussions on, wiki off, homepage set, topics present
#   3. Exposed secrets scan (12 READMEs) — no secret patterns in public READMEs
# On failure: updates tracking issue #OUT-HEALTH for operator visibility.
# Results also written to job summary for quick review.

on:
  schedule:
    - cron: '0 6 * * *'  # Daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Run OUT health checks
      id: checks
      run: |
        python3 - <<'PYEOF'
        import json, urllib.request, datetime, sys, os

        now = datetime.datetime.now(datetime.timezone.utc)
        results = {"generated_at": now.isoformat(), "destinations": [], "repos": [], "verdict": "PASS"}
        issues = []

        # --- 1. Board API health ---
        destinations = [
            ("softwarejobs.dev", "https://softwarejobs.dev/api/jobs?page=1&per_page=5"),
            ("zapply.jobs", "https://zapply.jobs/api/jobs/?page=1&per_page=5"),
        ]
        for name, url in destinations:
            r = {"name": name, "verdict": "FAIL", "reason": ""}
            try:
                req = urllib.request.Request(url, headers={"User-Agent": "out-health-check/1.0"})
                with urllib.request.urlopen(req, timeout=20) as resp:
                    data = json.loads(resp.read())
                    status = resp.status
                if status != 200:
                    r["reason"] = f"HTTP {status}"
                    issues.append(f"{name}: HTTP {status}")
                else:
                    jobs = data.get("jobs", data) if isinstance(data, dict) else data
                    count = len(jobs) if isinstance(jobs, list) else 0
                    if count < 3:
                        r["reason"] = f"only {count} jobs"
                        issues.append(f"{name}: only {count} jobs")
                    else:
                        # Check freshness via 'posted' field
                        freshest = None
                        for j in (jobs[:10] if isinstance(jobs, list) else []):
                            posted = j.get("posted")
                            if not posted:
                                continue
                            try:
                                dt = datetime.datetime.fromisoformat(str(posted).replace("Z", "+00:00"))
                                age_h = (now - dt).total_seconds() / 3600
                                if freshest is None or age_h < freshest:
                                    freshest = age_h
                            except ValueError:
                                continue
                        if freshest is None:
                            r["reason"] = "no parseable posted timestamp"
                            issues.append(f"{name}: no freshness signal")
                        elif freshest > 72:
                            r["reason"] = f"stale: freshest {freshest:.1f}h old"
                            issues.append(f"{name}: stale ({freshest:.1f}h)")
                        else:
                            r["verdict"] = "PASS"
                            r["job_count"] = count
                            r["freshest_age_h"] = round(freshest, 1)
            except Exception as e:
                r["reason"] = f"fetch failed: {e}"
                issues.append(f"{name}: fetch failed ({e})")
            results["destinations"].append(r)

        # --- 2. Settings drift + secrets scan (12 repos) ---
        import re
        repos = [
            "New-Grad-Jobs-2027", "Internships-2027",
            "New-Grad-Software-Engineering-Jobs-2027", "New-Grad-Data-Science-Jobs-2027",
            "New-Grad-Hardware-Engineering-Jobs-2027", "New-Grad-Healthcare-Jobs-2027",
            "Canada-Jobs-2027", "Canada-Internships-2027",
            "Research-Internships-for-Undergraduates", "underclassmen-internships",
            "resume-samples-2026", "interview-handbook-2026",
        ]
        secret_re = re.compile(r"goLiveSecrets|R2_ACCESS_KEY|R2_SECRET_KEY|R2_ENDPOINT|SUPABASE_SERVICE_KEY|SUPABASE_SERVICE_ROLE|DISCORD_WEBHOOK|GITHUB_TOKEN|ghp_[a-zA-Z0-9]")

        for repo in repos:
            r = {"repo": repo, "verdict": "PASS", "issues": []}
            # Settings via unauthenticated GitHub API (public repos)
            try:
                req = urllib.request.Request(
                    f"https://api.github.com/repos/zapplyjobs/{repo}",
                    headers={"User-Agent": "out-health-check/1.0", "Accept": "application/vnd.github+json"}
                )
                with urllib.request.urlopen(req, timeout=10) as resp:
                    info = json.loads(resp.read())
                disc = info.get("has_discussions")
                wiki = info.get("has_wiki")
                homepage = info.get("homepage", "")
                topics = len(info.get("topics", []))
                if disc is not True:
                    r["issues"].append(f"discussions={disc} (should be true)")
                if wiki is True:
                    r["issues"].append(f"wiki=true (should be false)")
                if not homepage:
                    r["issues"].append("homepage not set")
                if topics < 1:
                    r["issues"].append(f"no topics ({topics})")
            except Exception as e:
                r["issues"].append(f"settings fetch failed: {e}")

            # Secrets scan
            try:
                req = urllib.request.Request(
                    f"https://raw.githubusercontent.com/zapplyjobs/{repo}/main/README.md",
                    headers={"User-Agent": "out-health-check/1.0"}
                )
                with urllib.request.urlopen(req, timeout=10) as resp:
                    readme = resp.read().decode("utf-8", errors="replace")
                hits = sorted(set(secret_re.findall(readme)))
                if hits:
                    r["issues"].append(f"EXPOSED SECRETS: {hits}")
            except Exception:
                pass  # README fetch failure is not critical

            if r["issues"]:
                r["verdict"] = "FAIL"
                for i in r["issues"]:
                    issues.append(f"{repo}: {i}")
            results["repos"].append(r)

        # --- Aggregate ---
        results["verdict"] = "FAIL" if issues else "PASS"
        results["issue_count"] = len(issues)

        # Write summary
        print(f"::set-output name=verdict::{results['verdict']}")
        print(f"::set-output name=issue_count::{len(issues)}")

        summary_lines = ["## OUT Health Check", "",
            f"**Verdict:** {'PASS ✅' if results['verdict'] == 'PASS' else 'FAIL ❌'}",
            f"**Generated:** {results['generated_at']}", "",
            "### Board API Health", ""]
        for d in results["destinations"]:
            mark = "✅" if d["verdict"] == "PASS" else "❌"
            detail = f"{d.get('job_count','?')} jobs, freshest {d.get('freshest_age_h','?')}h" if d["verdict"] == "PASS" else d["reason"]
            summary_lines.append(f"- {mark} **{d['name']}** — {detail}")

        summary_lines += ["", "### Repo Settings + Secrets", ""]
        for r in results["repos"]:
            mark = "✅" if r["verdict"] == "PASS" else "❌"
            detail = "; ".join(r["issues"]) if r["issues"] else "OK"
            summary_lines.append(f"- {mark} **{r['repo']}** — {detail}")

        if issues:
            summary_lines += ["", "### Issues", ""]
            for i in issues:
                summary_lines.append(f"- {i}")

        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
            f.write("\n".join(summary_lines) + "\n")

        print("\n".join(summary_lines))

        if issues:
            sys.exit(1)
        PYEOF

    - name: Create or update tracking issue on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const title = 'OUT Health Check FAILED';
          const body = `The daily OUT health check failed on ${new Date().toISOString()}.\n\nSee [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.\n\nThis issue is auto-created and should be investigated.`;
          // Check for existing open issue
          const existing = await github.rest.issues.listForRepo({
            ...context.repo,
            state: 'open',
            labels: 'out-health,auto-created',
            per_page: 1
          });
          if (existing.data.length > 0) {
            // Add comment to existing issue
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: existing.data[0].number,
              body
            });
          } else {
            await github.rest.issues.create({
              ...context.repo,
              title,
              body,
              labels: ['out-health', 'auto-created']
            });
          }
