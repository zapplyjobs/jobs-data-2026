name: Refresh LCA Data

# Refresh cadence: weekly (INF-LCA-REFRESH-SCHEDULE-1, INF decision 2026-09-06) —
# DOL publishes quarterly but the weekly run is cheap insurance that keeps
# lca-sponsors.json fresh so enrich never publishes lca_intensity=null between
# manual runs (the ENR-measured wobble class). Manual dispatch with a custom
# window stays available.

on:
  workflow_dispatch:
    inputs:
      window:
        description: 'Rolling window size (quarters, default 5)'
        required: false
        default: '5'
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17Z — off-peak minute, low-frequency per the GHA cron governance

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Install transcrypt (vendored action — immune to raw-CDN 429s, INF-TRANSCRYPT-ACTION-1)
        uses: zapplyjobs/.github/actions/setup-transcrypt@afcb5f41ec28fe10cefcf421fc455d0d89588b1f

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
          git submodule sync --recursive
          git submodule update --init --recursive
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install openpyxl requests

      - name: Generate lca-sponsors.json from DOL data
        run: |
          python3 .github/scripts/lca-refresh.py \
            --auto \
            --window ${{ inputs.window }} \
            --output lca-sponsors.json

      - name: Install processing deps (uploader requires processing r2-client -> @aws-sdk; no root manifest exists to satisfy it via upward resolution)
        run: cd .github/scripts/processing && npm install --no-audit --no-fund
      - name: "Upload lca-sponsors.json (R2 canonical + Storage dual-write — INF-R2-STALERELIC-CLUSTER-1: the consumer enrich-jobs reads data/lca-sponsors.json from R2; the old Storage-only curl left R2 frozen at the Aug-4 bucket seed)"
        run: |
          mkdir -p .github/data
          cp lca-sponsors.json .github/data/lca-sponsors.json
          node scripts/upload-dashboard-data-to-r2.js lca-sponsors.json
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
