name: Refresh LCA Data

# Quarterly refresh of lca-sponsors.json from DOL OFLC disclosure data.
# Downloads all quarters in the rolling window, extracts certified H-1B employer
# names, rebuilds from scratch, and uploads to R2 (data/lca-sponsors.json).
#
# Trigger: manual (workflow_dispatch). Run quarterly when DOL publishes new data.
# INF-LCA-QUARTERLY-REFRESH-1

on:
  workflow_dispatch:
    inputs:
      window:
        description: 'Rolling window size (quarters, default 5)'
        required: false
        default: '5'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install openpyxl requests

      - name: Generate lca-sponsors.json from DOL data
        run: |
          python3 .github/scripts/lca-refresh.py \
            --auto \
            --window ${{ inputs.window }} \
            --output lca-sponsors.json

      - name: Install processing deps (uploader requires processing r2-client -> @aws-sdk; no root manifest exists to satisfy it via upward resolution)
        run: cd .github/scripts/processing && npm install --no-audit --no-fund
      - name: "Upload lca-sponsors.json (R2 canonical + Storage dual-write — INF-R2-STALERELIC-CLUSTER-1: the consumer enrich-jobs reads data/lca-sponsors.json from R2; the old Storage-only curl left R2 frozen at the Aug-4 bucket seed)"
        run: |
          mkdir -p .github/data
          cp lca-sponsors.json .github/data/lca-sponsors.json
          node scripts/upload-dashboard-data-to-r2.js lca-sponsors.json
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
