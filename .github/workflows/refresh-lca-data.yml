name: Refresh LCA Data

# Quarterly refresh of lca-sponsors.json from DOL OFLC disclosure data.
# Downloads all quarters in the rolling window, extracts certified H-1B employer
# names, rebuilds from scratch, and uploads to R2 (data/lca-sponsors.json).
#
# Trigger: manual (workflow_dispatch). Run quarterly when DOL publishes new data.
# INF-LCA-QUARTERLY-REFRESH-1

on:
  workflow_dispatch:
    inputs:
      window:
        description: 'Rolling window size (quarters, default 5)'
        required: false
        default: '5'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install openpyxl requests

      - name: Generate lca-sponsors.json from DOL data
        run: |
          python3 .github/scripts/lca-refresh.py \
            --auto \
            --window ${{ inputs.window }} \
            --output lca-sponsors.json

      - name: Upload to Supabase Storage
        run: |
          curl -sf -X PUT \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @lca-sponsors.json \
            "$SUPABASE_URL/storage/v1/object/pipeline-data/lca-sponsors.json" \
            && echo "=== Uploaded lca-sponsors.json to Storage ===" \
            || { echo "⚠️ Storage upload failed"; exit 1; }
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
