name: Pipeline Alert

on:
  schedule:
    - cron: '0 * * * *'  # Every hour (backup — GitHub cron unreliable during peak)
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pipeline-alert.yml'
  repository_dispatch:
    types: [pipeline-alert]

concurrency:
  group: pipeline-alert
  cancel-in-progress: false

jobs:
  pipeline-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
          sparse-checkout: |
            .github/scripts
            .github/data
            .github/workflows
            package.json
            package-lock.json
            scripts

      - name: Install transcrypt (vendored action — immune to raw-CDN 429s, INF-TRANSCRYPT-ACTION-1)
        uses: zapplyjobs/.github/actions/setup-transcrypt@afcb5f41ec28fe10cefcf421fc455d0d89588b1f

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true

          # Verify submodule decryption succeeded (INF-TRANSCRYPT-KEY-BACKUP-1).
          SAMPLE_JS=$(find .github/scripts -name '*.js' -print -quit 2>/dev/null)
          if [ -n "$SAMPLE_JS" ]; then
            if ! file -b "$SAMPLE_JS" | grep -qiE 'ASCII|UTF-8|text'; then
              echo "::error::Submodule decryption FAILED — $SAMPLE_JS is ciphertext. Pipeline would run garbage. Check TRANSCRYPT_PASSWORD + transcrypt unlock."
              exit 1
            fi
          fi
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .github/scripts/processing/package-lock.json


      - name: Install processing submodule dependencies (executed scripts resolve discord.js/supabase there)
        run: cd .github/scripts/processing && npm install

      - name: Download data from R2
        continue-on-error: true
        run: |
          echo "📥 Downloading pipeline data from R2..."
          node -e "
          const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
          const fs = require('fs');
          const path = require('path');
          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            const dataDir = '.github/data';
            if (!fs.existsSync(dataDir)) fs.mkdirSync(dataDir, { recursive: true });
            const files = ['all_jobs.json', 'us_jobs.json', 'enriched_jobs.json', 'enrichment-stats.json', 'desc-fetch-failures.json', 'jobs-metadata.json', 'zjp-metrics.json', 'metrics/latest.json', 'supplemental-custom-jobs.json', 'supplemental-custom-metadata.json', 'supplemental-oracle-jobs.json', 'supplemental-oracle-metadata.json', 'company-directory.json', 'pipeline-alert.json', 'pipeline-alert-history.jsonl', 'dev-change-watch-state.json', 'partial-sources-streak-state.json', 'posted_jobs.json']  // OUT-DISCORD-VOLUME-GAP-1: +posted_jobs.json (check-58 volume floor input)  // INF-DEV-CHANGE-WATCH-1: +partial-sources-streak-state.json (check-56 state): +dev-change-watch-state.json (check-50 state)  // AGG-COMPANY-DIRECTORY-1: check-49 input;  // INF-ALERT-HISTORY-PUBLISH-1: +pipeline-alert-history.jsonl (download for append)
            files.push('inf-aspect-status.json', 'agg-aspect-status.json', 'tag-aspect-status.json', 'enr-aspect-status.json', 'sup-aspect-status.json', 'out-aspect-status.json');  // INF-ASPECT-ALARM-GAPS-1: check 40 consumes per-module aspect-status (RED alarm)
            files.push('enr-quality-signal.json');
            files.push('detail-fetch-crash-log.jsonl');  // INF-ENR-FETCHERCRASH-VISIBILITY-1: check-52 input (crash-vs-skip visibility)
            files.push('system-state.json');  // INF-COST-SPEND-GOVERNANCE-1: check 48 capacity utilization  // ENR-FIELDACCURACY-CHECK-1: check 44 consumes the extraction-quality signal (RED/YELLOW alarm)
            const sidecars = await r2.list('descriptions-');
            for (const obj of sidecars) {
              const name = obj.key.replace(/^data\//, '');
              if (name.endsWith('.jsonl')) files.push(name);
            }
            for (const file of files) {
              try {
                const raw = await r2.downloadRaw(file);
                if (raw) {
                  const dest = path.join(dataDir, file);
                  fs.mkdirSync(path.dirname(dest), { recursive: true });  // ENR-PAL-DATA-AUDIT-1: support nested paths like metrics/latest.json
                  fs.writeFileSync(dest, Buffer.from(raw));
                  console.log('R2 download OK: ' + file);
                } else { console.log('R2 SKIP: ' + file + ' (not found)'); }
              } catch (e) { console.error('R2 ERR: ' + file + ' - ' + e.message); }
            }
            console.log('R2 download complete');
          }
          main().catch(e => { console.error('R2 fatal: ' + e.message); process.exit(1); });
          "
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Syntax check pipeline-alert.js
        run: node -c .github/scripts/processing/lib/pipeline-alert.js

      - name: Compute private-repo Actions usage (check-53 input)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          node -e "
          const https = require('https');
          function api(path) {
            return new Promise((resolve, reject) => {
              https.get({ hostname: 'api.github.com', path, headers: { Authorization: 'token ' + process.env.GH_PAT, 'User-Agent': 'zjp-check53' } }, res => {
                let d = ''; res.on('data', c => d += c);
                res.on('end', () => { try { resolve(JSON.parse(d)); } catch (e) { reject(new Error('HTTP ' + res.statusCode)); } });
              }).on('error', reject);
            });
          }
          (async () => {
            const since = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 19) + 'Z';
            const q = encodeURIComponent('>=' + since);
            const org = await api('/orgs/zapplyjobs/repos?per_page=100');
            const privates = (org || []).filter(r => r.private).map(r => r.name);
            const repos = []; let total = 0; const visible = [];
            for (const name of privates) {
              try {
                const d = await api('/repos/zapplyjobs/' + name + '/actions/runs?created=' + q + '&per_page=100');
                visible.push(name);
                const runs = d.workflow_runs || [];
                let mins = 0;
                for (const run of runs) {
                  const s = Date.parse(run.run_started_at || run.created_at);
                  const u = Date.parse(run.updated_at);
                  if (s && u && u > s) mins += (u - s) / 60000;
                }
                if (runs.length) { repos.push({ name, runs: runs.length, minutes: Math.round(mins) }); total += mins; }
              } catch (e) { /* repo not in token allowlist — coverage gap recorded via visible[] */ }
            }
            const payload = JSON.stringify({ generated_at: new Date().toISOString(), repos, total_minutes: Math.round(total), visible });
            require('fs').appendFileSync(process.env.GITHUB_ENV, 'ACTIONS_USAGE=' + payload + '\n');
            console.log('check-53 usage: ' + Math.round(total) + ' min trailing 7d across ' + visible.length + '/' + privates.length + ' private repos');
          })().catch(e => { console.error('usage pre-step failed (check-53 will skip): ' + e.message); require('fs').appendFileSync(process.env.GITHUB_ENV, 'ACTIONS_USAGE=null\n'); });
          "

      - name: Probe Canada LMIA artifact health (check-54 input)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          node -e "
          const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
          (async () => {
            const r2 = createR2Client({ prefix: 'data/' });
            const names = ['lmia-sponsors.json', 'canada-visa-stats.json', 'canada-jobs.jsonl', 'canada-lmia-status.json'];
            const out = {};
            for (const n of names) {
              try { const h = await r2.head(n); out[n] = { lastModified: h.lastModified }; }
              catch (e) { out[n] = { missing: true, error: String(e.message || e).slice(0, 120) }; }
            }
            try { out.status = await r2.downloadJson('canada-lmia-status.json'); } catch (e) { /* absent pre-deploy */ }
            const payload = JSON.stringify(out);
            require('fs').appendFileSync(process.env.GITHUB_ENV, 'LMIA_ARTIFACT_HEALTH=' + payload + '\n');
            console.log('check-54 probe: ' + names.map(n => n + '=' + (out[n].missing ? 'MISSING' : 'ok')).join(' '));
          })().catch(e => { console.error('LMIA probe pre-step failed (check-54 will skip): ' + e.message); require('fs').appendFileSync(process.env.GITHUB_ENV, 'LMIA_ARTIFACT_HEALTH=null\n'); });
          "
      - name: Probe bridge phase health (check-55 input)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          node -e "
          const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
          (async () => {
            const r2 = createR2Client({ prefix: 'data/' });
            // Multi-cycle source: the R2 history (short-circuit bridge cycles skip the
            // single-cycle Storage metrics write — E168 lesson). R2 egress is free.
            const raw = await r2.downloadRaw('bridge-metrics-history.jsonl');
            // downloadRaw returns Uint8Array (String() would comma-join bytes) — decode:
            const text = raw ? Buffer.from(raw).toString('utf8') : '';
            const lines = text.trim().split('\n').filter(Boolean).slice(-6);
            const entries = lines.map(l => {
              try {
                const d = JSON.parse(l);
                const phases = d.r2_fetch_complete_at && d.upsert_complete_at;
                let p5a = null;
                if (phases && d.db_dedup_complete_at && d.company_normalize_complete_at) {
                  p5a = (Date.parse(d.company_normalize_complete_at) - Date.parse(d.db_dedup_complete_at)) / 1000;
                }
                return { run_at: d.bridge_run_at, p5a_s: p5a, phases_present: !!phases };
              } catch { return null; }
            }).filter(Boolean);
            const payload = JSON.stringify({ deployed_since: '2026-08-26T16:15:44Z', entries });
            require('fs').appendFileSync(process.env.GITHUB_ENV, 'BRIDGE_PHASE_HEALTH=' + payload + '\n');
            console.log('check-55 probe: ' + entries.length + ' tail entries, last instrumented p5a=' + (() => { const i = [...entries].reverse().find(e => e.phases_present); return i ? Math.round(i.p5a_s) + 's' : 'none'; })());
          })().catch(e => { console.error('bridge phase probe pre-step failed (check-55 will skip): ' + e.message); require('fs').appendFileSync(process.env.GITHUB_ENV, 'BRIDGE_PHASE_HEALTH=null\n'); });
          "
      - name: Probe Supabase platform status page (check-57 input)
        run: |
          node -e "
          const https = require('https');
          function get(p) { return new Promise((resolve, reject) => { https.get({ hostname: 'status.supabase.com', path: p, timeout: 10000, headers: { 'User-Agent': 'zjp-check57' } }, res => { let d=''; res.on('data',c=>d+=c); res.on('end',()=>{ try { resolve(JSON.parse(d)); } catch(e){ reject(new Error('HTTP ' + res.statusCode)); } }); }).on('error', reject).on('timeout', function(){ this.destroy(new Error('timeout')); }); }); }
          (async () => {
            const status = await get('/api/v2/status.json');
            const incidents = await get('/api/v2/incidents/unresolved.json');
            const out = {
              generated_at: new Date().toISOString(),
              indicator: status.status && status.status.indicator,
              description: status.status && status.status.description,
              incidents: (incidents.incidents || []).map(i => ({ name: i.name, status: i.status, updated_at: i.updated_at }))
            };
            try {
              const comps = await get('/api/v2/components.json');
              out.components = {};
              for (const c of comps.components || []) if (c.status && c.status !== 'operational') out.components[c.name] = c.status;
            } catch (e) { /* components optional */ }
            const payload = JSON.stringify(out);
            require('fs').appendFileSync(process.env.GITHUB_ENV, 'SUPABASE_PLATFORM_STATUS=' + payload + '\n');
            console.log('check-57 probe: indicator=' + out.indicator + ' active_incidents=' + out.incidents.length + ' degraded_components=' + Object.keys(out.components || {}).length);
          })().catch(e => { console.error('platform-status pre-step failed (check-57 will skip): ' + e.message); require('fs').appendFileSync(process.env.GITHUB_ENV, 'SUPABASE_PLATFORM_STATUS=null\n'); });
          "
      - name: App canary probe (check-59 input)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node -e "
          (async () => {
            const S = process.env.SUPABASE_URL, K = process.env.SUPABASE_SERVICE_ROLE_KEY, T = process.env.SUPABASE_ACCESS_TOKEN;
            const out = {};
            const t0 = Date.now();
            try { const r = await fetch('https://app.zapply.jobs', { redirect: 'manual' }); out.app_status = r.status; } catch (e) { out.app_status = 'ERR ' + String(e).slice(0, 80); }
            out.app_ms = Date.now() - t0;
            try {
              const h = { apikey: K, Authorization: 'Bearer ' + K };
              const prof = await (await fetch(S + '/rest/v1/final_profile_json?select=embedding,skills_embedding&email=eq.qa.out.automation%40zapply.jobs&is_active=eq.true&limit=1', { headers: h })).json();
              out.fixture_ok = Array.isArray(prof) && !!prof[0] && !!prof[0].embedding;
              if (out.fixture_ok) {
                const t1 = Date.now();
                const body = { user_embedding: prof[0].embedding, user_skills_embedding: prof[0].skills_embedding || prof[0].embedding, p_search: null, p_categories: null, p_locations: null, p_experience: null, p_companies: null, p_salary_min: null, p_salary_max: null, p_has_profile: true, p_profile_completeness: 50, p_preferred_field: null, p_no_signup_only: false };
                const rows = await (await fetch(S + '/rest/v1/rpc/match_jobs', { method: 'POST', headers: Object.assign({}, h, { 'Content-Type': 'application/json' }), body: JSON.stringify(body) })).json();
                out.match_ms = Date.now() - t1;
                out.match_rows = Array.isArray(rows) ? rows.length : 0;
                const enr = (Array.isArray(rows) ? rows : []).filter(function (r) { return r && r.details && r.details.enriched && r.details.enriched.visaSignal; }).length;
                out.visa_fill = enr + '/' + out.match_rows;
              }
            } catch (e) { out.match_error = String(e).slice(0, 140); }
            try {
              const ref = S.replace('https://', '').split('.')[0];
              const r = await fetch('https://api.supabase.com/v1/projects/' + ref + '/database/query', { method: 'POST', headers: { Authorization: 'Bearer ' + T, 'Content-Type': 'application/json' }, body: JSON.stringify({ query: \"SELECT count(*) AS n FROM pg_policies WHERE tablename = 'job_embeddings' AND policyname = 'anon_read'\" }) });
              const j = await r.json();
              out.anon_policies = (j && j[0] && Number(j[0].n)) || 0;
            } catch (e) { out.anon_policies = 'ERR'; }
            require('fs').appendFileSync(process.env.GITHUB_ENV, 'APP_CANARY_STATUS=' + JSON.stringify(out) + '\n');
            console.log('check-59 probe: app=' + out.app_status + ' rows=' + (out.match_rows ?? 'n/a') + ' anon_policies=' + out.anon_policies);
          })().catch(e => { console.error('app-canary pre-step failed (check-59 will warn): ' + e.message); require('fs').appendFileSync(process.env.GITHUB_ENV, 'APP_CANARY_STATUS=null\n'); });
          "
      - name: Probe data-proxy liveness (check-36 serving-path leg)
        env:
          DATA_PROXY_TOKEN: ${{ secrets.DATA_PROXY_TOKEN }}
        run: |
          node -e "
          (async () => {
            const base = 'https://zjp-data-proxy.wild-queen-069e.workers.dev';
            const started = Date.now();
            try {
              const resp = await fetch(base + '/data/metrics/latest.json', {
                headers: { 'X-Proxy-Token': process.env.DATA_PROXY_TOKEN || '', 'User-Agent': 'zjp-check36-proxy-liveness' },
                signal: AbortSignal.timeout(10000),
              });
              const payload = { ok: resp.ok, http: resp.status, ms: Date.now() - started, file: 'metrics/latest.json' };
              require('fs').appendFileSync(process.env.GITHUB_ENV, 'PROXY_LIVENESS=' + JSON.stringify(payload) + '\n');
              console.log('check-36 proxy probe: ' + JSON.stringify(payload));
            } catch (e) {
              const payload = { ok: false, http: 0, ms: Date.now() - started, file: 'metrics/latest.json', error: String(e.message || e).slice(0, 120) };
              require('fs').appendFileSync(process.env.GITHUB_ENV, 'PROXY_LIVENESS=' + JSON.stringify(payload) + '\n');
              console.error('check-36 proxy probe FAILED: ' + JSON.stringify(payload));
            }
          })();
          "
      - name: Probe competitor snapshot health (check-60 input)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          node -e "
          const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
          (async () => {
            const r2 = createR2Client({ prefix: 'data/' });
            const out = {};
            try {
              const h = await r2.head('competitor_snapshot.json');
              out.lastModified = h.lastModified;
            } catch (e) {
              require('fs').appendFileSync(process.env.GITHUB_ENV, 'COMPETITOR_SNAPSHOT_HEALTH=' + JSON.stringify({ missing: true }) + '\n');
              console.log('check-60 probe: competitor_snapshot.json MISSING');
              return;
            }
            try {
              const body = await r2.downloadJson('competitor_snapshot.json');
              out.generated_at = (body && body.generated_at) || null;
              out.simplify_count = body && body.simplify_internships_us_estimated && typeof body.simplify_internships_us_estimated.count === 'number' ? body.simplify_internships_us_estimated.count : null;
              out.competitors_n = body && Array.isArray(body.competitors) ? body.competitors.length : 0;
            } catch (e) { out.error = String(e.message || e).slice(0, 120); }
            require('fs').appendFileSync(process.env.GITHUB_ENV, 'COMPETITOR_SNAPSHOT_HEALTH=' + JSON.stringify(out) + '\n');
            console.log('check-60 probe: generated_at=' + (out.generated_at || 'absent') + ' simplify=' + out.simplify_count + ' competitors=' + out.competitors_n);
          })().catch(e => { console.error('competitor probe pre-step failed (check-60 will skip): ' + e.message); require('fs').appendFileSync(process.env.GITHUB_ENV, 'COMPETITOR_SNAPSHOT_HEALTH=null\n'); });
          "
      - name: Run pipeline checks
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TEAM_TOKEN }}
          DISCORD_PIPELINE_ALERT_CHANNEL_ID: ${{ secrets.DISCORD_PIPELINE_ALERT_CHANNEL_ID }}
          GH_PAT_EXPIRY_DATE: ${{ vars.GH_PAT_EXPIRY_DATE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}  # INF-SUPABASE-HEALTH-CHECK: Management API for depth metrics (connections, rollback rate, cache hit)
          APP_CANARY_STATUS: ${{ env.APP_CANARY_STATUS }}  # OUT-APP-CANARY-1: check-59 probe payload
          SUPABASE_TOKEN_EXPIRES: ${{ vars.SUPABASE_TOKEN_EXPIRES }}  # INF-SUPABASE-TOKEN-EXPIRY-1: rotation date (YYYY-MM-DD) — check-42 warns <=14d. Update this variable at each token rotation.
          PROXY_LIVENESS: ${{ env.PROXY_LIVENESS }}  # INF-DASHADV-IMPL-1 item 2: check-36 serving-path leg payload
          COMPETITOR_SNAPSHOT_HEALTH: ${{ env.COMPETITOR_SNAPSHOT_HEALTH }}  # INF-DASHADV-IMPL-1 item 3: check-60 probe payload
        run: node .github/scripts/processing/lib/pipeline-alert.js
      - name: Build Tier A source coverage report
        run: node .github/scripts/source-coverage-audit.js

      - name: Upload to R2 (Phase 1 cleanup — removed redundant git commits)
        if: always()  # CRITICAL: upload alert JSON EVEN when checks fail — the JSON CONTAINS the failures (that's its purpose). if:success() caused the structured alert data to go stale DURING incidents (when it's most needed).
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/upload-dashboard-data-to-r2.js pipeline-alert.json pipeline-alert-history.jsonl checks-registry.json dev-change-watch-state.json partial-sources-streak-state.json tier-a-source-coverage.json  # INF-CHECKS-REGISTRY-1: +checks-registry.json (full catalog for the /alerts tab)
