name: Pipeline Alert

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

jobs:
  pipeline-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decrypt repository secrets
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/git-crypt-key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/git-crypt-key
          rm /tmp/git-crypt-key

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run pipeline checks
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TEAM_TOKEN }}
          DISCORD_PIPELINE_ALERT_CHANNEL_ID: ${{ secrets.DISCORD_PIPELINE_ALERT_CHANNEL_ID }}
        run: node .github/scripts/pipeline-alert.js

      - name: Commit alert status
        run: |
          git config user.name "z-apply"
          git config user.email "admin@zapply.jobs"
          git add .github/data/pipeline-alert.json .github/data/alert-history.jsonl 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update pipeline alert status [skip ci]"
          git stash --include-untracked -q 2>/dev/null || true
          git pull --rebase origin main -q
          git stash pop -q 2>/dev/null || true
          git push origin main -q || true
