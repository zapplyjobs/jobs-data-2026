name: Pipeline Alert

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

jobs:
  pipeline-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts
            .github/data
            .github/workflows
            package.json
            package-lock.json
            companies.json

      - name: Decrypt repository secrets
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/git-crypt-key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/git-crypt-key
          rm /tmp/git-crypt-key

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run pipeline checks
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TEAM_TOKEN }}
          DISCORD_PIPELINE_ALERT_CHANNEL_ID: ${{ secrets.DISCORD_PIPELINE_ALERT_CHANNEL_ID }}
        run: node .github/scripts/pipeline-alert.js

      - name: Push alert status via API
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Use GitHub Contents API to update the alert file (bypasses git-crypt dirty tree issues)
          ALERT_FILE=".github/data/pipeline-alert.json"
          if [ -f "$ALERT_FILE" ]; then
            CURRENT_SHA=$(gh api repos/zapplyjobs/jobs-data-2026/contents/$ALERT_FILE --jq '.sha' 2>/dev/null || echo "")
            CONTENT=$(base64 -w 0 "$ALERT_FILE")
            if [ -n "$CURRENT_SHA" ]; then
              gh api repos/zapplyjobs/jobs-data-2026/contents/$ALERT_FILE \
                --method PUT \
                --field message="chore: update pipeline alert status [skip ci]" \
                --field content="$CONTENT" \
                --field sha="$CURRENT_SHA" \
                --jq '.commit.sha' 2>/dev/null && echo "Alert status pushed" || echo "Push failed or no change"
            else
              echo "Could not get current SHA — skipping push"
            fi
          else
            echo "Alert file not found — skipping push"
          fi
