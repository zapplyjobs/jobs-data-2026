name: Pipeline Alert

on:
  schedule:
    - cron: '0 * * * *'  # Every 30 minutes (backup — GitHub cron unreliable during peak)
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pipeline-alert.yml'
  repository_dispatch:
    types: [pipeline-alert]

concurrency:
  group: pipeline-alert
  cancel-in-progress: false

jobs:
  pipeline-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
          sparse-checkout: |
            .github/scripts
            .github/data
            .github/workflows
            package.json
            package-lock.json
            scripts

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Download data from R2
        continue-on-error: true
        run: |
          echo "📥 Downloading pipeline data from R2..."
          node -e "
          const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
          const fs = require('fs');
          const path = require('path');
          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            const dataDir = '.github/data';
            if (!fs.existsSync(dataDir)) fs.mkdirSync(dataDir, { recursive: true });
            const files = ['all_jobs.json', 'us_jobs.json', 'enriched_jobs.json', 'enrichment-stats.json', 'desc-fetch-failures.json', 'jobs-metadata.json', 'zjp-metrics.json', 'metrics/latest.json', 'softwarejobs-descriptions.json', 'softwarejobs-descriptions-meta.json', 'supplemental-custom-jobs.json', 'supplemental-custom-metadata.json', 'supplemental-oracle-jobs.json', 'supplemental-oracle-metadata.json', 'pipeline-alert.json'];  // ENR-MONITOR-FIX-1: +enrichment-stats.json. ENR-DESCCACHE-OBSERVABILITY-1: +desc-fetch-failures.json. ENR-PAL-DATA-AUDIT-1: +metrics/latest.json — unblocks checks 4/5/14/20 (silently null ctx.prev since deploy).
            const sidecars = await r2.list('descriptions-');
            for (const obj of sidecars) {
              const name = obj.key.replace(/^data\//, '');
              if (name.endsWith('.jsonl')) files.push(name);
            }
            for (const file of files) {
              try {
                const raw = await r2.downloadRaw(file);
                if (raw) {
                  const dest = path.join(dataDir, file);
                  fs.mkdirSync(path.dirname(dest), { recursive: true });  // ENR-PAL-DATA-AUDIT-1: support nested paths like metrics/latest.json
                  fs.writeFileSync(dest, Buffer.from(raw));
                  console.log('R2 download OK: ' + file);
                } else { console.log('R2 SKIP: ' + file + ' (not found)'); }
              } catch (e) { console.error('R2 ERR: ' + file + ' - ' + e.message); }
            }
            console.log('R2 download complete');
          }
          main().catch(e => { console.error('R2 fatal: ' + e.message); process.exit(1); });
          "
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Syntax check pipeline-alert.js
        run: node -c .github/scripts/processing/lib/pipeline-alert.js


      - name: Run pipeline checks
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TEAM_TOKEN }}
          DISCORD_PIPELINE_ALERT_CHANNEL_ID: ${{ secrets.DISCORD_PIPELINE_ALERT_CHANNEL_ID }}
          GH_PAT_EXPIRY_DATE: ${{ vars.GH_PAT_EXPIRY_DATE }}
        run: node .github/scripts/processing/lib/pipeline-alert.js
      - name: Build Tier A source coverage report
        run: node .github/scripts/source-coverage-audit.js

      - name: Upload to R2 (Phase 1 cleanup — removed redundant git commits)
        if: success()
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node scripts/upload-dashboard-data-to-r2.js pipeline-alert.json tier-a-source-coverage.json
