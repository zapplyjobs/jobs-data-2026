name: Diag GH PAT endpoints (temp)
on: workflow_dispatch
permissions: { contents: read }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ep in "repos/zapplyjobs/zjp-dashboard/contents/AGENTS.md" "repos/zapplyjobs/zjp-dashboard/commits/main" "repos/zapplyjobs/zjp-dashboard/commits/main/check-runs" "repos/zapplyjobs/jobs-data-2026/commits/main/check-runs"; do
            if out=$(gh api "$ep" 2>&1 >/dev/null); then
              echo "$ep -> OK"
            else
              echo "$ep -> FAIL: $(echo "$out" | head -1)"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
