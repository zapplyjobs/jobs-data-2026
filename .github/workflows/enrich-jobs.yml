name: Enrich Jobs

on:
  workflow_dispatch:  # Triggered by job-board-cron-worker (Cloudflare) every 15 min

# Prevent concurrent enrich runs — two runs picking the same pending batch would
# produce duplicate entries in enriched_jobs.json.
concurrency:
  group: enrich-jobs
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run enrichment
        run: node .github/scripts/enrich-jobs.js

      - name: Commit enriched_jobs.json
        if: success()
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          git add .github/data/enriched_jobs.json .github/data/processed_ids.json || exit 0
          git commit -m "chore: update enriched jobs [skip ci]" || exit 0
          git pull --rebase origin main
          git push
