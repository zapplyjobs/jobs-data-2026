name: Enrich Jobs

on:
  workflow_dispatch:  # Triggered by job-board-cron-worker (Cloudflare) every 15 min

# Prevent concurrent enrich runs — two runs picking the same pending batch would
# produce duplicate entries in enriched_jobs.json.
concurrency:
  group: enrich-jobs
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install shared submodule dependencies (for R2 client)
        run: cd .github/scripts/shared && npm install && cd "$GITHUB_WORKSPACE"/.github/scripts/processing && npm install

      - name: Download data from R2
        if: success()
        continue-on-error: true
        run: |
          echo "📥 Downloading pipeline data from R2..."
          node -e "
          const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
          const fs = require('fs');
          const path = require('path');

          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            const dataDir = '.github/data';
            if (!fs.existsSync(dataDir)) fs.mkdirSync(dataDir, { recursive: true });

            // Download core data files (enriched_jobs.json: INF-BLOAT-5 left it git-tracked but stale;
            // must download from R2 to get fresh version instead of May 14 git snapshot)
            // jobs-metadata.json: DASH-METRICS-1 — dashboard reads from git, must download fresh from R2
            const coreFiles = ['all_jobs.json', 'processed_ids.json', 'enriched_jobs.json', 'jobs-metadata.json'];
            for (const file of coreFiles) {
              try {
                const raw = await r2.downloadRaw(file);
                if (raw) {
                  fs.writeFileSync(path.join(dataDir, file), Buffer.from(raw));
                  console.log('R2 download OK: ' + file);
                } else {
                  console.log('R2 SKIP: ' + file + ' (not found — will use git version)');
                }
              } catch (e) { console.error('R2 download ERR: ' + file + ' - ' + e.message); }
            }

            // Download description sidecars
            const keys = await r2.list('descriptions-');
            const jsonlKeys = (keys || []).filter(k => k.key.endsWith('.jsonl'));
            for (const obj of jsonlKeys) {
              const name = obj.key.replace('data/', '');
              try {
                const raw = await r2.downloadRaw(name);
                if (raw) {
                  fs.writeFileSync(path.join(dataDir, name), Buffer.from(raw));
                  console.log('R2 download OK: ' + name + ' (' + (obj.size / 1024 / 1024).toFixed(1) + ' MB)');
                }
              } catch (e) { console.error('R2 download ERR: ' + name + ' - ' + e.message); }
            }
            console.log('R2 download complete');
          }
          main().catch(e => { console.error('R2 fatal: ' + e.message); process.exit(1); });
          "
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Fetch Google+Apple detail pages
        if: success()
        continue-on-error: true
        run: node .github/scripts/processing/lib/detail-page-fetcher.js --data-dir .github/data

      - name: Run enrichment
        run: node .github/scripts/processing/lib/enrich-jobs.js

      - name: Prune stale sidecar entries
        if: success()
        run: node .github/scripts/processing/lib/prune-sidecars.js --data-dir .github/data

      - name: Upload enriched data to R2
        if: success()
        # continue-on-error removed — R2 upload failures now visible (INF-BLOAT-5)
        run: |
          echo "📤 Uploading enriched data to R2..."
          node -e "
          const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
          const fs = require('fs');
          const path = require('path');

          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            const dataDir = '.github/data';

            const files = [
              'enriched_jobs.json',
              'processed_ids.json',
              'enrichment-stats.json',
              'tech-us-truth.json',
            ];

            // Add all description sidecars (pruned versions overwrite R2 — INF-SIDECAR-COMPACT-1)
            const sidecars = fs.readdirSync(dataDir).filter(f => f.startsWith('descriptions-') && f.endsWith('.jsonl'));
            for (const s of sidecars) files.push(s);

            // Add enrichment history if it exists
            if (fs.existsSync(path.join(dataDir, 'enrichment-history.jsonl'))) {
              files.push('enrichment-history.jsonl');
            }

            const desiredSidecars = new Set(sidecars);
            const existingSidecars = (await r2.list('descriptions-'))
              .map(obj => obj.key.replace(/^data\//, ''))
              .filter(name => name.startsWith('descriptions-') && name.endsWith('.jsonl'));
            const staleSidecars = existingSidecars.filter(name => !desiredSidecars.has(name));
            for (const stale of staleSidecars) {
              await r2.remove(stale);
              console.log('DELETE: ' + stale);
            }

            let ok = 0, fail = 0;
            for (const file of files) {
              const fp = path.join(dataDir, file);
              if (!fs.existsSync(fp)) { console.log('SKIP: ' + file); continue; }
              try {
                const data = fs.readFileSync(fp, 'utf8');
                const isJson = file.endsWith('.json');
                const uploaded = isJson
                  ? await r2.uploadRaw(file, data, 'application/json')
                  : await r2.uploadRaw(file, data, 'application/x-jsonlines');
                if (uploaded) { ok++; } else { fail++; }
              } catch (e) { console.error('ERR: ' + file + ' - ' + e.message); fail++; }
            }

            await r2.writeManifest({ files_uploaded: ok, files_failed: fail, stage: 'enrichment' });
            console.log('R2 upload done: ' + ok + ' ok, ' + fail + ' failed');
          }
          main().catch(e => { console.error('R2 fatal: ' + e.message); process.exit(1); });
          "
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Commit enrichment stats
        if: success()
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          # Only commit tiny dashboard-facing files. Big data files (sidecars, enriched_jobs, processed_ids)
          # live in R2 only — INF-BLOAT-5.
          git add .github/data/enrichment-stats.json || exit 0
          [ -f .github/data/tech-us-truth.json ] && git add .github/data/tech-us-truth.json
          [ -f .github/data/jobs-metadata.json ] && git add .github/data/jobs-metadata.json
          [ -f .github/data/enrichment-history.jsonl ] && git add .github/data/enrichment-history.jsonl
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "chore: update enrichment stats [skip ci]" || exit 0
          for i in 1 2 3; do
            git stash --include-untracked && git pull --rebase --strategy-option=theirs origin main && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

      - name: Trigger pipeline alert
        if: success()
        run: |
          gh workflow run pipeline-alert.yml -R zapplyjobs/jobs-data-2026 --ref main 2>/dev/null && echo "Pipeline alert triggered" || echo "Alert trigger failed (non-critical)"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}