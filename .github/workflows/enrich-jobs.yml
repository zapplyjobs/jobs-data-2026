name: Enrich Jobs

on:
  workflow_dispatch:  # Triggered by job-board-cron-worker (Cloudflare) every 15 min

# Prevent concurrent enrich runs — two runs picking the same pending batch would
# produce duplicate entries in enriched_jobs.json.
concurrency:
  group: enrich-jobs
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Decrypt repository secrets
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/git-crypt-key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/git-crypt-key
          rm /tmp/git-crypt-key

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run enrichment
        run: node .github/scripts/enrich-jobs.js

      - name: Commit enriched_jobs.json
        if: success()
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          git add .github/data/enriched_jobs.json .github/data/processed_ids.json .github/data/enrichment-stats.json || exit 0
          [ -f .github/data/enrichment-history.jsonl ] && git add .github/data/enrichment-history.jsonl
          git add .github/data/descriptions-enriched-*.jsonl 2>/dev/null || true
          [ -f .github/data/desc-fetch-failures.json ] && git add .github/data/desc-fetch-failures.json
          git commit -m "chore: update enriched jobs [skip ci]" || exit 0
          # git-crypt's smudge filter re-runs on every index operation, causing
          # decrypted .github/scripts/** to appear "modified" even after stash/checkout.
          # Bypass the filter entirely during pull --rebase by overriding it with cat,
          # and mark git-crypt as non-required so it doesn't abort.
          for i in 1 2 3; do
            git -c filter.git-crypt.smudge=cat -c filter.git-crypt.clean=cat -c filter.git-crypt.required=false pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
