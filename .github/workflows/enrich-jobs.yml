name: Enrich Jobs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enrich-jobs.yml'

# Prevent concurrent enrich runs — two runs picking the same pending batch would
# produce duplicate entries in enriched_jobs.json.
concurrency:
  group: enrich-jobs-v2  # AGG-GHOST-RUN-CADENCE-BLOCK-1: renamed to escape 8 ghost queued runs
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # ENR-SIDECAR-MARKER-RACE-1: headroom for wait(≤7m)+repair(≤3m+re-download); normal path unchanged (~4-5m)
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt (vendored action — immune to raw-CDN 429s, INF-TRANSCRYPT-ACTION-1)
        uses: zapplyjobs/.github/actions/setup-transcrypt@afcb5f41ec28fe10cefcf421fc455d0d89588b1f

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true

          # Verify submodule decryption succeeded (INF-TRANSCRYPT-KEY-BACKUP-1).
          SAMPLE_JS=$(find .github/scripts -name '*.js' -print -quit 2>/dev/null)
          if [ -n "$SAMPLE_JS" ]; then
            if ! file -b "$SAMPLE_JS" | grep -qiE 'ASCII|UTF-8|text'; then
              echo "::error::Submodule decryption FAILED — $SAMPLE_JS is ciphertext. Pipeline would run garbage. Check TRANSCRYPT_PASSWORD + transcrypt unlock."
              exit 1
            fi
          fi
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .github/scripts/processing/package-lock.json


      - name: Install shared submodule dependencies (for R2 client)
        run: cd "$GITHUB_WORKSPACE"/.github/scripts/processing && npm install

      - name: Acquire stable AGG sidecar snapshot (ENR-SIDECAR-MARKER-RACE-1)
        # Merged wait+download+verify with ONE bounded repair attempt.
        # Why: AGG desc-backfill dual-trigger (~2-5m cadence, 1-2m runs) and fetch-jobs
        # (10m cadence, ~7m runs) flip markers mid-download often enough that the old
        # fail-at-first-flip guard killed ~1/3 of runs (2026-08-16: 10/30). Safety property
        # is UNCHANGED: we proceed only when a FULL download window sat inside one completed,
        # unchanged generation (same run_ids before and after). A flip now triggers
        # wait-for-complete + full re-download + re-verify instead of failing the run.
        # Naive tolerate-without-re-download was rejected: the local set stays torn
        # (desc-backfill renumbers/deletes chunks mid-run; mixed generations can drop entries).
        run: |
          mkdir -p .github/data
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
          const NAMES = ['desc-backfill-complete.json', 'fetch-jobs-sidecar-complete.json'];
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function readMarkers(r2) {
            const values = await Promise.all(NAMES.map(name => r2.downloadJson(name)));
            const markers = Object.fromEntries(NAMES.map((name, i) => [name, values[i] || null]));
            for (const name of NAMES) {
              const marker = markers[name];
              if (!marker || !['complete', 'in_progress', 'failed'].includes(marker.status)) {
                throw new Error(`Invalid or missing AGG sidecar marker: ${name}`);
              }
            }
            return markers;
          }
          async function waitForComplete(r2, capMinutes, attempt) {
            const deadline = Date.now() + capMinutes * 60 * 1000;
            let poll = 0;
            while (Date.now() < deadline) {
              const markers = await readMarkers(r2);
              const active = Object.entries(markers).filter(([, m]) => m.status === 'in_progress');
              const failed = Object.entries(markers).filter(([, m]) => m.status === 'failed');
              if (failed.length > 0) {
                throw new Error(`AGG sidecar generation failed; refusing mixed snapshot (${failed.map(([n]) => n).join(', ')})`);
              }
              if (active.length === 0) return markers;
              poll++;
              console.log(`AGG sidecar write in progress (${active.map(([n]) => n).join(', ')}); waiting 30s (poll ${poll}, cap ${capMinutes}m, attempt ${attempt})`);
              await sleep(30000);
            }
            throw new Error(`AGG sidecar markers still in_progress after ${capMinutes} minutes (attempt ${attempt})`);
          }
          async function downloadAll(r2) {
            const dataDir = '.github/data';
            if (!fs.existsSync(dataDir)) fs.mkdirSync(dataDir, { recursive: true });
            // Core data files (enriched_jobs.json: INF-BLOAT-5 git copy is stale; jobs-metadata.json: DASH-METRICS-1)
            const coreFiles = ['all_jobs.json', 'us_jobs.json', 'processed_ids.json', 'enriched_jobs.json', 'jobs-metadata.json', 'enrichment-history.jsonl', 'lca-sponsors.json', 'zjp-metrics.json'];
            for (const file of coreFiles) {
              try {
                const raw = await r2.downloadRaw(file);
                if (raw) {
                  fs.writeFileSync(path.join(dataDir, file), Buffer.from(raw));
                  console.log('R2 download OK: ' + file);
                } else {
                  console.log('R2 SKIP: ' + file + ' (not found — will use git version)');
                }
              } catch (e) { console.error('R2 download ERR: ' + file + ' - ' + e.message); }
            }
            const keys = await r2.list('descriptions-');
            const jsonlKeys = (keys || []).filter(k => k.key.endsWith('.jsonl'));
            for (const obj of jsonlKeys) {
              const name = obj.key.replace('data/', '');
              try {
                const raw = await r2.downloadRaw(name);
                if (raw) {
                  fs.writeFileSync(path.join(dataDir, name), Buffer.from(raw));
                  console.log('R2 download OK: ' + name + ' (' + (obj.size / 1024 / 1024).toFixed(1) + ' MB)');
                }
              } catch (e) { console.error('R2 download ERR: ' + name + ' - ' + e.message); }
            }
            console.log('R2 download complete');
          }
          function diffGenerations(before, after) {
            const changed = [];
            for (const name of NAMES) {
              const prior = before[name];
              const current = after[name];
              if (!current || current.status !== 'complete') changed.push(`${name}: status=${current?.status || 'missing'}`);
              if ((prior?.run_id || null) !== (current?.run_id || null)) changed.push(`${name}: run_id ${prior?.run_id || 'legacy/missing'} -> ${current?.run_id || 'legacy/missing'}`);
            }
            return changed;
          }
          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            // Attempt 1 waits up to 7m: fetch-jobs holds in_progress ~7m of its 10m cycle,
            // so a 4m cap fails runs when no simultaneous-complete instant exists in the
            // window. Repair attempt waits 3m — covers desc-backfill's 1-2m runs.
            const ATTEMPTS = [{ waitCapMin: 7 }, { waitCapMin: 3 }];
            for (let i = 0; i < ATTEMPTS.length; i++) {
              const attempt = i + 1;
              const markers = await waitForComplete(r2, ATTEMPTS[i].waitCapMin, attempt);
              const before = Object.fromEntries(NAMES.map(name => [name, { status: markers[name].status, run_id: markers[name].run_id || null }]));
              for (const [name, marker] of Object.entries(markers)) {
                console.log(`Marker ${name}: ${marker.status}${marker.run_id ? ` (${marker.run_id})` : ' (legacy generation)'}`);
              }
              try {
                await downloadAll(r2);
              } catch (e) {
                // Non-fatal — matches the old continue-on-error download step (git fallback).
                console.error('R2 download fatal (non-fatal for run): ' + e.message);
              }
              const after = await readMarkers(r2);
              const changed = diffGenerations(before, after);
              if (changed.length === 0) {
                fs.writeFileSync('.github/data/.sidecar-markers-before.json', JSON.stringify(after));
                console.log(`AGG sidecar generations stable across R2 download (attempt ${attempt})`);
                return;
              }
              console.log(`AGG sidecar generation changed during R2 download (attempt ${attempt}): ${changed.join('; ')}`);
              if (attempt < ATTEMPTS.length) console.log('Tolerating flip: waiting for the new generation to complete, then re-downloading (ENR-SIDECAR-MARKER-RACE-1)');
            }
            throw new Error('AGG sidecar generation changed during every download attempt; failing closed (mixed-snapshot guard intact)');
          }
          main().catch(err => { console.error(err.message); process.exit(1); });
          EOF
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}


      - name: Fetch Google+Apple detail pages
        if: success()
        continue-on-error: true
        run: node .github/scripts/processing/lib/detail-page-fetcher.js --data-dir .github/data

      - name: Run enrichment
        run: node .github/scripts/processing/lib/enrich-jobs.js
        env:
          # ENR-DESCCACHE-OBSERVABILITY-1: enrich-jobs.js now syncs failCache to/from R2 inline (needs creds).
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      # ENR-SJD-DESCSIZE-ORPHANCHUNK-1 (2026-08-15): softwarejobs-descriptions map RETIRED.
      # Verified zero product consumers: SJD list reads sjd-jobs.json; SJD detail reads
      # descriptions-enriched-*.jsonl shards directly; not in data-proxy whitelist; no
      # dashboard/backend/metrics/checks consumer. The 185MB single-JSON publish was
      # write-only bloat (plus a string-cap time-bomb at ~537MB) — removed with its
      # upload entries, pipeline-alert download, and source-coverage-audit fields.


      - name: Prune stale sidecar entries
        if: success()
        run: node .github/scripts/processing/lib/prune-sidecars.js --data-dir .github/data

      - name: Upload enriched data to R2
        if: success()
        # continue-on-error removed — R2 upload failures now visible (INF-BLOAT-5)
        run: |
          echo "📤 Uploading enriched data to R2..."
          node -e "
          const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
          const fs = require('fs');
          const path = require('path');
          const { isEnrOwnedSidecar } = require('./.github/scripts/processing/lib/sidecar-standard');

          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            const dataDir = '.github/data';

            const files = [
              'enriched_jobs.json',
              'processed_ids.json',
              'enrichment-stats.json',
              'tech-us-truth.json',
              'desc-fetch-failures.json',  // ENR-R2PRIMARY-ENRICHWRITES-1: ensure failCache lands in R2 (canonical)
            ];

            // ENR owns only descriptions-enriched-N.jsonl. AGG source sidecars
            // are read as inputs but must not be rewritten or deleted by ENR.
            const sidecars = fs.readdirSync(dataDir).filter(isEnrOwnedSidecar);
            for (const s of sidecars) files.push(s);

            // Add enrichment history if it exists
            if (fs.existsSync(path.join(dataDir, 'enrichment-history.jsonl'))) {
              files.push('enrichment-history.jsonl');
            }

            const desiredSidecars = new Set(sidecars);
            const existingSidecars = (await r2.list('descriptions-'))
              .map(obj => obj.key.replace(/^data\//, ''))
              .filter(isEnrOwnedSidecar);
            const staleSidecars = existingSidecars.filter(name => !desiredSidecars.has(name));

            let ok = 0, fail = 0;
            for (const file of files) {
              const fp = path.join(dataDir, file);
              if (!fs.existsSync(fp)) { console.log('SKIP: ' + file); continue; }
              try {
                const data = fs.readFileSync(fp, 'utf8');
                const isJson = file.endsWith('.json');
                const uploaded = isJson
                  ? await r2.uploadRaw(file, data, 'application/json')
                  : await r2.uploadRaw(file, data, 'application/x-jsonlines');
                if (uploaded) { ok++; } else { fail++; }
              } catch (e) { console.error('ERR: ' + file + ' - ' + e.message); fail++; }
            }

            // ENR-ENRICHED9-ENUMERATION-RACE-1: superseded ENR-owned sidecars are deleted ONLY
            // AFTER the full replacement set is uploaded (parity with AGG desc-backfill's
            // upload->prune step order). Delete-first raced the bridge's enumeration->get on
            // chunk-count shrinks: the 2026-08-19T02:03:20Z rebuild (9 chunks -> 8) removed
            // descriptions-enriched-9.jsonl from R2 at 02:03:21Z, 22s before the renumbered
            // chunks landed; a bridge that enumerated 9 shards got 'R2 object not found' on
            // GET (02:04:37Z). Skipping the prune on any upload failure keeps the old shard
            // readable until a later successful publish replaces it.
            if (staleSidecars.length > 0) {
              if (fail === 0) {
                for (const stale of staleSidecars) {
                  try { await r2.remove(stale); console.log('DELETE ENR-OWNED (post-upload): ' + stale); }
                  catch (e) { console.log('SKIP DELETE (R2 gone): ' + stale); }
                }
              } else {
                console.log('SKIP stale-sidecar prune: ' + fail + ' upload failure(s) — superseded shards kept readable');
              }
            }
            await r2.writeManifest({ files_uploaded: ok, files_failed: fail, stage: 'enrichment' });
            console.log('R2 upload done: ' + ok + ' ok, ' + fail + ' failed');
          }
          main().catch(e => { console.error('R2 fatal: ' + e.message); process.exit(1); });
          "
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Verify R2 upload (ENR-R2PRIMARY-ENRICHWRITES-1)
        if: success()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          echo "Verifying R2 upload (HEAD check on key ENR files)..."
          for f in enriched_jobs.json enrichment-stats.json desc-fetch-failures.json; do
            SIZE=$(aws s3 ls "s3://${R2_BUCKET_NAME}/data/${f}" --endpoint-url "${R2_ENDPOINT}" 2>/dev/null | awk '{print $3}')
            if [ -n "$SIZE" ] && [ "$SIZE" -gt 0 ]; then
              echo "  OK $f: ${SIZE} bytes in R2"
            else
              echo "  WARN $f: NOT in R2 (will retry next cycle)"
            fi
          done
          SIDECAR_COUNT=$(aws s3 ls "s3://${R2_BUCKET_NAME}/data/" --endpoint-url "${R2_ENDPOINT}" 2>/dev/null | grep -c 'descriptions-' || true)
          echo "  descriptions-*.jsonl in R2: ${SIDECAR_COUNT} files"

      - name: Dual-write to Supabase Storage (SAFETY COPY -- R2 is canonical via r2-client above; ENR-R2ELIM-PHASE2-1 + ENR-R2PRIMARY-ENRICHWRITES-1)
        if: success()
        continue-on-error: true
        run: |
          echo "Dual-writing ENR files to Supabase Storage (pipeline-data bucket)..."
          for f in enriched_jobs.json enrichment-stats.json; do
            if [ -f ".github/data/$f" ]; then
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @".github/data/$f" \
                "https://xxmhgagpbxjflajoaahy.supabase.co/storage/v1/object/pipeline-data/$f")
              echo "  $f: HTTP $STATUS"
            fi
          done
          for f in .github/data/descriptions-enriched-*.jsonl; do
            if [ -f "$f" ]; then
              BASENAME=$(basename "$f")
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$f" \
                "https://xxmhgagpbxjflajoaahy.supabase.co/storage/v1/object/pipeline-data/$BASENAME")
              echo "  $BASENAME: HTTP $STATUS"
            fi
          done
          # ENR-DUALWRITE-KEEPGATE-1: narrowed to keep-list (files consumers read from Storage).
          # Dropped: processed_ids, enrichment-history, softwarejobs-descriptions-meta, desc-fetch-failures,
          # softwarejobs-descriptions.json (fully retired from R2 too 2026-08-15, ENR-SJD-DESCSIZE-ORPHANCHUNK-1). R2 is canonical; Storage is safety copy for
          # consumer-read files only. Verified: zero Storage readers for dropped files (grep zapply-backend/src).
          echo "Dual-write complete."
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit enrichment stats
        if: success()
        continue-on-error: true
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          # Only commit tiny dashboard-facing/control-plane files. Big data files (sidecars, enriched_jobs, processed_ids)
          # live in R2 only — INF-BLOAT-5.
          [ -f .github/data/tech-us-truth.json ] && git add .github/data/tech-us-truth.json
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "chore: update enrichment stats [skip ci]" || exit 0
          for i in 1 2 3; do
            git stash --include-untracked && git pull --rebase --strategy-option=theirs origin main && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

      - name: Canada LMIA visa enrichment (ENR-CANADA-LMIA-VISA-LANE-1)
        if: success()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sf "$SUPABASE_URL/storage/v1/object/public/pipeline-data/lmia-sponsors.json" \
            -o .github/data/lmia-sponsors.json && echo "LMIA data downloaded" \
            || { echo "LMIA data not available — skipping Canada visa"; exit 0; }
          node .github/scripts/processing/enrich-canada-visa.js
          for f in canada-jobs-enriched.json; do
            [ -f ".github/data/$f" ] && curl -sf -X PUT \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @".github/data/$f" \
              "$SUPABASE_URL/storage/v1/object/pipeline-data/$f" \
              && echo "Uploaded $f" || echo "Upload $f failed"
          done
      - name: Upload dashboard data to R2 (INF-R2-GITCUTOVER-1)
        if: success()
        continue-on-error: true
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/upload-dashboard-data-to-r2.js enrichment-stats.json enrichment-history.jsonl canada-visa-stats.json canada-jobs-enriched.json  # canada-jobs-enriched: OUT-CAVISA-SURFACING-1 — Canada LMIA markers consumed by the README publisher (R2-canonical, was Storage-only)  # AGG-METADATA-STALE-1: removed jobs-metadata.json — enrich-jobs was re-uploading stale copy (race condition with fetch-jobs's fresh upload); canada-visa-stats.json: ENR-CANADA-COVERAGE-SLICE-1 — publish lane stats to R2 canonical for the DASH Canada tab (was Storage-only)

      - name: Publish to Supabase Edge (Phase 2 R2 elimination)
        if: success()
        continue-on-error: true
        run: node .github/scripts/processing/lib/publish-metrics-to-edge.js --data-dir .github/data
        env:
          EDGE_FUNCTION_URL: https://xxmhgagpbxjflajoaahy.supabase.co/functions/v1/publish-metrics-function
          PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}

      - name: Publish aspect-status (ENR-ASPECT-AUTOPUBLISH-1)
        if: success()
        continue-on-error: true
        run: node .github/scripts/processing/lib/publish-aspect-status.js
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      - name: Publish quality-signal (INF-ENR-QUALITY-SIGNAL-WIRE-1)
        if: success()
        continue-on-error: true
        run: node .github/scripts/processing/lib/publish-quality-signal.js
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # post-to-discord is NOT dispatched here — fetch-jobs.yml is the single
      # dispatcher (wave-link, "no 15-min lag"). Dual-dispatching exhausted
      # Discord's gateway IDENTIFY budget (OUT-DISCORD-SESSION-EXHAUSTION-1).
      # Do NOT re-add a dispatch here.

      # AGG-REDUNDANT-COLLECTMETRICS-DISPATCH-2: collect-metrics dispatch REMOVED —
      # fired while board-counts was mid-flight (intermediate-state snapshot). The correct
      # dispatch is push-consumer-readmes.yml (post board-counts upload, freshness-gated);
      # collect-metrics retains its own push trigger + INF's 45m R2 freshness gate.
      - name: Trigger consumer README push (wave link — fresh post-enrichment, INF-CONSUMER-PUSH-ENRICH-RACE-1)
        if: success()
        continue-on-error: true
        run: |
          gh workflow run push-consumer-readmes.yml -R zapplyjobs/jobs-aggregator-private --ref main 2>/dev/null \
            && echo "Dispatched consumer README push (fresh post-enrichment)" \
            || echo "Consumer push dispatch failed (non-blocking — fetch-jobs stale push is fallback)"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}