# Weekly INF DB-health datapoint (INF-PGSTATS-CADENCE-AUTOMATE-1).
# Read-only collector; appends one JSON line to R2 data/pgstats-history.jsonl.
# Deliberately NOT a pipeline-alert check and NOT paged (check-42 owns paging).
name: PGStats Datapoint

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC, ahead of the weekly review
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: pgstats-datapoint
  cancel-in-progress: false

jobs:
  datapoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Unlock encrypted files
        uses: zapplyjobs/.github/actions/setup-transcrypt@afcb5f41ec28fe10cefcf421fc455d0d89588b1f
      - name: Decrypt working tree
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          SAMPLE_JS=$(find scripts -name '*.js' -print -quit 2>/dev/null)
          if [ -n "$SAMPLE_JS" ]; then
            if ! file -b "$SAMPLE_JS" | grep -qiE 'ASCII|UTF-8|text'; then
              echo "::error::Decryption FAILED - $SAMPLE_JS is ciphertext. Check TRANSCRYPT_PASSWORD."
              exit 1
            fi
          fi
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Collect + append datapoint
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node scripts/pgstats-datapoint.js
