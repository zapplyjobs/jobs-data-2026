# Trigger policy (AGG-WORKFLOW-DISPATCH-AUDIT-1, 2026-07-18): workflow_dispatch-only BY DESIGN.
# Manual dashboard tool (added 2026-07-01 in commit 045cb423 alongside verify-all-jobs).
# Operator invokes from the dashboard Tools tab on demand — not a regular-cadence workflow.
# If this changes (e.g., scheduled coverage audits), add `schedule:` and update this note.

name: Source Coverage Audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Install transcrypt (vendored action — immune to raw-CDN 429s, INF-TRANSCRYPT-ACTION-1)
        uses: zapplyjobs/.github/actions/setup-transcrypt@afcb5f41ec28fe10cefcf421fc455d0d89588b1f

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true

          # Verify submodule decryption succeeded (INF-TRANSCRYPT-KEY-BACKUP-1).
          SAMPLE_JS=$(find .github/scripts -name '*.js' -print -quit 2>/dev/null)
          if [ -n "$SAMPLE_JS" ]; then
            if ! file -b "$SAMPLE_JS" | grep -qiE 'ASCII|UTF-8|text'; then
              echo "::error::Submodule decryption FAILED — $SAMPLE_JS is ciphertext. Pipeline would run garbage. Check TRANSCRYPT_PASSWORD + transcrypt unlock."
              exit 1
            fi
          fi
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install processing deps (INF-ROOTMANIFEST-DEAD-1 — shared has no package.json — the old shared install silently ran against the root manifest, which is now removed)
        run: cd .github/scripts/processing && npm install --no-audit --no-fund
      - name: Download audit inputs from R2 (INF-DEPRESOLUTION-CICHECK-1 — the script reads .github/data relative to REPO ROOT; post-R2-cutover the data left the repo, so the dispatch path must download like pipeline-alert does)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          node -e "
          const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
          const fs = require('fs');
          const path = require('path');
          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            const dataDir = '.github/data';
            if (!fs.existsSync(dataDir)) fs.mkdirSync(dataDir, { recursive: true });
            const files = ['all_jobs.json', 'supplemental-custom-jobs.json', 'supplemental-custom-metadata.json', 'supplemental-oracle-jobs.json', 'supplemental-oracle-metadata.json'];
            const sidecars = await r2.list('descriptions-');
            for (const obj of sidecars) {
              const name = obj.key.replace(/^data\//, '');
              if (name.endsWith('.jsonl')) files.push(name);
            }
            for (const file of files) {
              try {
                const raw = await r2.downloadRaw(file);
                if (raw) {
                  const dest = path.join(dataDir, file);
                  fs.mkdirSync(path.dirname(dest), { recursive: true });
                  fs.writeFileSync(dest, Buffer.from(raw));
                  console.log('R2 download OK: ' + file);
                } else { console.log('R2 SKIP: ' + file + ' (not found)'); }
              } catch (e) { console.error('R2 ERR: ' + file + ' - ' + e.message); }
            }
            console.log('R2 download complete');
          }
          main().catch(e => { console.error('R2 fatal: ' + e.message); process.exit(1); });
          "
      - name: Run source coverage audit (repo root — DATA_DIR is cwd-relative)
        run: node .github/scripts/source-coverage-audit.js
