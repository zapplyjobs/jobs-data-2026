# Trigger policy (AGG-WORKFLOW-DISPATCH-AUDIT-1, 2026-07-18): workflow_dispatch-only BY DESIGN.
# Manual dashboard tool (added 2026-07-01 in commit 045cb423 alongside verify-all-jobs).
# Operator invokes from the dashboard Tools tab on demand — not a regular-cadence workflow.
# If this changes (e.g., scheduled coverage audits), add `schedule:` and update this note.

name: Source Coverage Audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install shared deps
        run: cd .github/scripts/shared && npm install --no-audit --no-fund
      - name: Run source coverage audit
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          cd .github/scripts
          NODE_PATH=$GITHUB_WORKSPACE/.github/scripts/shared/node_modules node source-coverage-audit.js
