# Trigger policy (AGG-WORKFLOW-DISPATCH-AUDIT-1, 2026-07-18): workflow_dispatch-only BY DESIGN.
# This workflow is WAVE-LINKED from jobs-aggregator-private/fetch-jobs.yml (final step,
# `if: success() && github.ref_name == 'main'`). It runs ~5-10 min after each successful
# main pipeline run — the right cadence because new snapshot data is only available then.
# Risk: if fetch-jobs breaks, this stops too — but fetch-jobs has its own monitoring
# (check-01 fetch-stale), so the silence is caught upstream. Do NOT add `schedule:` here
# without removing the wave-link first; double-trigger would race the concurrency group.

name: Refresh ZJP Public Snapshot

on:
  workflow_dispatch:

concurrency:
  group: refresh-zjp-public-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1




      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Seed latest snapshot inputs from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          mkdir -p .github/data
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { S3Client, GetObjectCommand } = require('@aws-sdk/client-s3');
          async function streamToFile(stream, target) {
            return new Promise((resolve, reject) => {
              const file = fs.createWriteStream(target);
              stream.pipe(file);
              stream.on('error', reject);
              file.on('finish', resolve);
              file.on('error', reject);
            });
          }
          async function main() {
            const client = new S3Client({
              region: 'auto',
              endpoint: process.env.R2_ENDPOINT,
              credentials: {
                accessKeyId: process.env.R2_ACCESS_KEY_ID,
                secretAccessKey: process.env.R2_SECRET_ACCESS_KEY,
              },
            });
            for (const name of ['all_jobs.json', 'jobs-metadata.json', 'enrichment-stats.json']) {
              const res = await client.send(new GetObjectCommand({ Bucket: process.env.R2_BUCKET_NAME, Key: `data/${name}` }));
              await streamToFile(res.Body, path.join('.github/data', name));
            }
            // Optional: download previous snapshot for tag_history accumulation (INF-LEVELDATA-1)
            try {
              const snapRes = await client.send(new GetObjectCommand({ Bucket: process.env.R2_BUCKET_NAME, Key: 'data/zjp-public-snapshot.json' }));
              await streamToFile(snapRes.Body, path.join('.github/data', 'zjp-public-snapshot.json'));
              console.log('SEEDED_R2:zjp-public-snapshot (for tag_history accumulation)');
            } catch (e) {
              console.log('SKIP: no previous zjp-public-snapshot.json (first run or missing)');
            }
            console.log('SEEDED_R2:all_jobs+jobs-metadata+enrichment-stats');
          }
          main().catch(err => { console.error(err.message); process.exit(1); });
          NODE

      - name: Generate public snapshot
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: node .github/scripts/generate-public-snapshot.js

      - name: Upload public snapshot to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { S3Client, PutObjectCommand } = require('@aws-sdk/client-s3');
          async function main() {
            const body = fs.readFileSync('.github/data/zjp-public-snapshot.json');
            const client = new S3Client({
              region: 'auto',
              endpoint: process.env.R2_ENDPOINT,
              credentials: {
                accessKeyId: process.env.R2_ACCESS_KEY_ID,
                secretAccessKey: process.env.R2_SECRET_ACCESS_KEY,
              },
            });
            await client.send(new PutObjectCommand({
              Bucket: process.env.R2_BUCKET_NAME,
              Key: 'data/zjp-public-snapshot.json',
              Body: body,
              ContentType: 'application/json',
            }));
            console.log('UPLOADED_R2:data/zjp-public-snapshot.json');
          }
          main().catch(err => { console.error(err.message); process.exit(1); });
          NODE

      - name: Validate R2 artifact contracts
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node .github/scripts/r2-artifact-contract-check.js

      # Commit step removed — .github/data/ files are R2-only (INF-REPOCLEANUP-1).
      # The snapshot is uploaded to R2 in the "Upload public snapshot to R2" step above.
      # No git commit needed.
