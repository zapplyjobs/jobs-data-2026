# Trigger policy (AGG-WORKFLOW-DISPATCH-AUDIT-1, 2026-07-18): workflow_dispatch-only BY DESIGN.
# This workflow is WAVE-LINKED from jobs-aggregator-private/fetch-jobs.yml (final step,
# `if: success() && github.ref_name == 'main'`). It runs ~5-10 min after each successful
# main pipeline run — the right cadence because new snapshot data is only available then.
# Risk: if fetch-jobs breaks, this stops too — but fetch-jobs has its own monitoring
# (check-01 fetch-stale), so the silence is caught upstream. Do NOT add `schedule:` here
# without removing the wave-link first; double-trigger would race the concurrency group.

name: Refresh ZJP Public Snapshot

on:
  workflow_dispatch:

concurrency:
  group: refresh-zjp-public-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1




      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Seed latest snapshot inputs from Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          mkdir -p .github/data
          BASE="${SUPABASE_URL}/storage/v1/object/public/pipeline-data"
          for f in all_jobs.json jobs-metadata.json enrichment-stats.json; do
            curl -sf -o ".github/data/$f" "$BASE/$f" && echo "SEEDED:$f" || { echo "FAIL:$f"; exit 1; }
          done
          curl -sf -o ".github/data/zjp-public-snapshot.json" "$BASE/zjp-public-snapshot.json" && echo "SEEDED:snapshot (tag_history)" || echo "SKIP:no previous snapshot (first run)"
          echo "seeded all_jobs+jobs-metadata+enrichment-stats from Storage"

      - name: Generate public snapshot
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: node .github/scripts/generate-public-snapshot.js

      - name: Dual-write public snapshot to Supabase Storage (R2-elim INF E140)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e '
          const fs=require("fs");
          const url=process.env.SUPABASE_URL, key=process.env.SUPABASE_SERVICE_ROLE_KEY;
          if(!url||!key){console.log("Storage skip (no creds)");process.exit(0);}
          const body=fs.readFileSync(".github/data/zjp-public-snapshot.json");
          fetch(url+"/storage/v1/object/pipeline-data/zjp-public-snapshot.json",{method:"PUT",headers:{Authorization:"Bearer "+key,"Content-Type":"application/json"},body}).then(r=>console.log(r.ok?"Storage OK":"Storage FAIL "+r.status)).catch(e=>console.log("Storage ERR",e.message));
          '


