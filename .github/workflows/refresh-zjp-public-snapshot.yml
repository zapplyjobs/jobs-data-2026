# Trigger policy (AGG-WORKFLOW-DISPATCH-AUDIT-1, 2026-07-18): workflow_dispatch-only BY DESIGN.
# This workflow is WAVE-LINKED from jobs-aggregator-private/fetch-jobs.yml (final step,
# `if: success() && github.ref_name == 'main'`). It runs ~5-10 min after each successful
# main pipeline run — the right cadence because new snapshot data is only available then.
# Risk: if fetch-jobs breaks, this stops too — but fetch-jobs has its own monitoring
# (check-01 fetch-stale), so the silence is caught upstream. Do NOT add `schedule:` here
# without removing the wave-link first; double-trigger would race the concurrency group.

name: Refresh ZJP Public Snapshot

on:
  workflow_dispatch:

concurrency:
  group: refresh-zjp-public-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1




      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Seed latest snapshot inputs from Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          mkdir -p .github/data
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const URL = process.env.SUPABASE_URL;
          async function fetchToFile(name, target) {
            const res = await fetch(`${URL}/storage/v1/object/public/pipeline-data/${name}`);
            if (!res.ok) throw new Error(`${name} → ${res.status}`);
            fs.writeFileSync(target, await res.text());
          }
          async function main() {
            for (const name of ['all_jobs.json', 'jobs-metadata.json', 'enrichment-stats.json']) {
              await fetchToFile(name, path.join('.github/data', name));
            }
            try {
              await fetchToFile('zjp-public-snapshot.json', path.join('.github/data', 'zjp-public-snapshot.json'));
              console.log('SEEDED:zjp-public-snapshot (for tag_history accumulation)');
            } catch (e) { console.log('SKIP: no previous zjp-public-snapshot.json'); }
            console.log('SEEDED:all_jobs+jobs-metadata+enrichment-stats (from Storage)');
          }
          main().catch(err => { console.error(err.message); process.exit(1); });
          NODE

      - name: Generate public snapshot
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: node .github/scripts/generate-public-snapshot.js

      - name: Upload public snapshot to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { S3Client, PutObjectCommand } = require('@aws-sdk/client-s3');
          async function main() {
            const body = fs.readFileSync('.github/data/zjp-public-snapshot.json');
            const client = new S3Client({
              region: 'auto',
              endpoint: process.env.R2_ENDPOINT,
              credentials: {
                accessKeyId: process.env.R2_ACCESS_KEY_ID,
                secretAccessKey: process.env.R2_SECRET_ACCESS_KEY,
              },
            });
            await client.send(new PutObjectCommand({
              Bucket: process.env.R2_BUCKET_NAME,
              Key: 'data/zjp-public-snapshot.json',
              Body: body,
              ContentType: 'application/json',
            }));
            console.log('UPLOADED_R2:data/zjp-public-snapshot.json');
          }
          main().catch(err => { console.error(err.message); process.exit(1); });
          NODE

      - name: Dual-write public snapshot to Supabase Storage (R2-elim INF E140)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e '
          const fs=require("fs");
          const url=process.env.SUPABASE_URL, key=process.env.SUPABASE_SERVICE_ROLE_KEY;
          if(!url||!key){console.log("Storage skip (no creds)");process.exit(0);}
          const body=fs.readFileSync(".github/data/zjp-public-snapshot.json");
          fetch(url+"/storage/v1/object/pipeline-data/zjp-public-snapshot.json",{method:"PUT",headers:{Authorization:"Bearer "+key,"Content-Type":"application/json"},body}).then(r=>console.log(r.ok?"Storage OK":"Storage FAIL "+r.status)).catch(e=>console.log("Storage ERR",e.message));
          '


      - name: Validate R2 artifact contracts
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node .github/scripts/r2-artifact-contract-check.js

      # Commit step removed — .github/data/ files are R2-only (INF-REPOCLEANUP-1).
      # The snapshot is uploaded to R2 in the "Upload public snapshot to R2" step above.
      # No git commit needed.
