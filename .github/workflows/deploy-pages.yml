name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - dashboard-v2-sandbox.html
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject dashboard password
        run: |
          for file in index.html dashboard-v2-sandbox.html; do
            [ -f "$file" ] || continue
            if grep -q '__DASHBOARD_PWD__' "$file"; then
              sed -i "s/__DASHBOARD_PWD__/${{ secrets.DASHBOARD_PWD }}/g" "$file"
              grep -q '__DASHBOARD_PWD__' "$file" && { echo "ERROR: placeholder still present after sed in $file"; exit 1; }
            fi
          done
          echo "Dashboard password injected successfully"

      - name: Inject dashboard secret
        run: |
          for file in index.html dashboard-v2-sandbox.html; do
            [ -f "$file" ] || continue
            if grep -q '__DASHBOARD_SECRET__' "$file"; then
              sed -i "s/__DASHBOARD_SECRET__/${{ secrets.DASHBOARD_SECRET }}/g" "$file"
              grep -q '__DASHBOARD_SECRET__' "$file" && { echo "ERROR: placeholder still present after sed in $file"; exit 1; }
            fi
          done
          echo "Dashboard secret injected successfully"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
