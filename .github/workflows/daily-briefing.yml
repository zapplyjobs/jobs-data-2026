name: Daily Briefing

# DAILY SCHEDULE restored 2026-10-10 (operator: "It should give a daily digest, not a
# one time or whenever we want one") - supersedes the 10-03 on-demand-only comment.
# 21:15 UTC = 4:15 PM CDT, inside the operator's 5AM-11PM CDT send window.
# Manual triggers: workflow_dispatch (immediate post of fresh R2 state; MANUAL_TEXT
# posts verbatim). There is NO push trigger: digest state lives in private R2
# (data/exec-brief/), never in this public repo.
on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:
    inputs:
      manual_text:
        description: 'Pre-composed briefing text to post verbatim (skips auto-gathering)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Unlock encrypted files
        uses: zapplyjobs/.github/actions/setup-transcrypt@afcb5f41ec28fe10cefcf421fc455d0d89588b1f
      - name: Decrypt working tree
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Configure AWS credentials for R2
        run: |
          echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Judge + post exec-brief
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          DATA_PROXY_TOKEN: ${{ secrets.DATA_PROXY_TOKEN }}
          DISCORD_TEAM_TOKEN: ${{ secrets.DISCORD_TEAM_TOKEN }}
          MANUAL_TEXT: ${{ github.event.inputs.manual_text }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: node scripts/daily-briefing.js
