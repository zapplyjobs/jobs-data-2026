name: Daily Briefing

# NO SCHEDULE (operator 10-03: on-demand only, never blind). One-time trigger =
# workflow_dispatch (zapply-gh-pat.env token has actions:write) OR commit a
# .github/exec-brief.md change - the push trigger fires the post within seconds.
on:
  push:
    paths:
      - '.github/exec-brief.md'
  workflow_dispatch:
    inputs:
      manual_text:
        description: 'Pre-composed briefing text to post verbatim (skips auto-gathering)'
        type: string
        required: false
        default: ''

permissions: {}

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Unlock encrypted files
        uses: zapplyjobs/.github/actions/setup-transcrypt@afcb5f41ec28fe10cefcf421fc455d0d89588b1f
      - name: Decrypt working tree
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Gather + post briefing
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          DATA_PROXY_TOKEN: ${{ secrets.DATA_PROXY_TOKEN }}
          DISCORD_TEAM_TOKEN: ${{ secrets.DISCORD_TEAM_TOKEN }}
          MANUAL_TEXT: ${{ github.event.inputs.manual_text }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node scripts/daily-briefing.js
