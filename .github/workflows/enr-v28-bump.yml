name: ENR-36 v28 Bump

on:
  repository_dispatch:
    types: [apply-enr-v28]

concurrency:
  group: v28-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decrypt repository secrets
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/git-crypt-key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/git-crypt-key
          rm /tmp/git-crypt-key

      - name: Bump and push
        run: |
          git config user.name "z-apply"
          git config user.email "admin@zapply.jobs"
          
          # Pull latest first to avoid conflicts
          git fetch origin main
          git reset --hard origin/main
          
          # Unlock again after reset (files re-encrypted)
          git-crypt unlock /tmp/git-crypt-key 2>/dev/null || true
          
          # Apply the version bump
          sed -i 's/const ENRICHER_VERSION = 27;/const ENRICHER_VERSION = 28;/' .github/scripts/enrich-jobs.js
          grep "ENRICHER_VERSION" .github/scripts/enrich-jobs.js | head -1
          
          # Commit only the enricher file (plaintext in working tree after unlock)
          git add .github/scripts/enrich-jobs.js
          git diff --cached --quiet && echo "No changes" && exit 1
          git commit -m "ENR-36: bump ENRICHER_VERSION 27 → 28 (T0 recovery for 248 version-gated jobs)"
          git push origin main

      - name: Remove this workflow
        run: |
          git fetch origin main
          git reset --hard origin/main
          git-crypt unlock /tmp/git-crypt-key 2>/dev/null || true
          git rm .github/workflows/enr-v28-bump.yml
          git commit -m "chore: remove temp v28 bump workflow"
          git push origin main
