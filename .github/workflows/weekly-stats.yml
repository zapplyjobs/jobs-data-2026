name: Weekly GitHub Summary to Discord

on:
  schedule:
    - cron: '0 5 * * 1'  # Monday midnight US Central (5 AM UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "current = generate live weekly report, replay = replay stored snapshot"
        required: false
        default: "current"
      replay_index:
        description: "Stored snapshot index for replay mode (0 = most recent stored weekly snapshot)"
        required: false
        default: "0"

jobs:
  weekly-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Post weekly summary to Discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TEAM_TOKEN }}
          DISCORD_WEEKLY_STATS_CHANNEL_ID: ${{ secrets.DISCORD_WEEKLY_STATS_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPORT_MODE: ${{ inputs.mode || 'current' }}
        run: node .github/scripts/processing/lib/weekly-summary.js --mode "$REPORT_MODE" --replay-index "$REPLAY_INDEX"

      - name: Commit updated stats file
        if: ${{ (inputs.mode || 'current') == 'current' }}
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          git add .github/data/weekly-stats.json || exit 0
          git commit -m "chore: update weekly-stats.json [skip ci]" || exit 0
          for i in 1 2 3; do
            git stash --include-untracked
            git pull --rebase --strategy-option=theirs origin main
            git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
