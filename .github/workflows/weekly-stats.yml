name: Weekly GitHub Summary to Discord

on:
  schedule:
    - cron: '0 5 * * 1'  # Monday midnight US Central (5 AM UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "current = generate live weekly report, replay = replay stored snapshot"
        required: false
        default: "current"
      replay_index:
        description: "Stored snapshot index for replay mode (0 = most recent stored weekly snapshot)"
        required: false
        default: "0"

jobs:
  weekly-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt (vendored action — immune to raw-CDN 429s, INF-TRANSCRYPT-ACTION-1)
        uses: zapplyjobs/.github/actions/setup-transcrypt@afcb5f41ec28fe10cefcf421fc455d0d89588b1f

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true

          # Verify submodule decryption succeeded (INF-TRANSCRYPT-KEY-BACKUP-1).
          SAMPLE_JS=$(find .github/scripts -name '*.js' -print -quit 2>/dev/null)
          if [ -n "$SAMPLE_JS" ]; then
            if ! file -b "$SAMPLE_JS" | grep -qiE 'ASCII|UTF-8|text'; then
              echo "::error::Submodule decryption FAILED — $SAMPLE_JS is ciphertext. Pipeline would run garbage. Check TRANSCRYPT_PASSWORD + transcrypt unlock."
              exit 1
            fi
          fi
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .github/scripts/processing/package-lock.json

      - name: Install processing submodule dependencies (INF-ROOTMANIFEST-DEAD-1 — weekly-summary requires discord.js; root install never provided it after the 08-15 manifest slim; latent Monday crash fixed)
        run: cd .github/scripts/processing && npm install

      - name: Post weekly summary to Discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TEAM_TOKEN }}
          DISCORD_WEEKLY_STATS_CHANNEL_ID: ${{ secrets.DISCORD_WEEKLY_STATS_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPORT_MODE: ${{ inputs.mode || 'current' }}
        run: node .github/scripts/processing/lib/weekly-summary.js --mode "$REPORT_MODE" --replay-index "$REPLAY_INDEX"

      - name: Commit updated stats file
        if: ${{ (inputs.mode || 'current') == 'current' }}
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          git add .github/data/weekly-stats.json || exit 0
          git commit -m "chore: update weekly-stats.json [skip ci]" || exit 0
          for i in 1 2 3; do
            git stash --include-untracked
            git pull --rebase --strategy-option=theirs origin main
            git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
