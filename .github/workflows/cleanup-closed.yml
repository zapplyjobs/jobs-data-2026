name: Cleanup Closed Jobs

on:
  schedule:
    - cron: '30 5,17 * * *'  # Twice daily: 12:30 AM and 12:30 PM CDT (05:30, 17:30 UTC)
  workflow_dispatch:  # Manual trigger for testing

concurrency:
  group: cleanup-closed
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt
        run: |
          curl -sSL https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt -o /tmp/transcrypt
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd .github/scripts/shared && npm install && cd "$GITHUB_WORKSPACE"/.github/scripts/processing && npm install

      - name: Download all_jobs.json from R2
        if: success()
        continue-on-error: true
        run: |
          echo "📥 Downloading all_jobs.json from R2..."
          node -e "
          const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
          const fs = require('fs');
          const path = require('path');

          async function main() {
            const r2 = createR2Client({ prefix: 'data/' });
            const dataDir = '.github/data';
            if (!fs.existsSync(dataDir)) fs.mkdirSync(dataDir, { recursive: true });

            const raw = await r2.downloadRaw('all_jobs.json');
            if (raw) {
              fs.writeFileSync(path.join(dataDir, 'all_jobs.json'), Buffer.from(raw));
              console.log('R2 download OK: all_jobs.json');
            } else {
              console.log('R2 SKIP: all_jobs.json not found — will use git version');
            }
          }
          main().catch(e => { console.error('R2 fatal: ' + e.message); process.exit(1); });
          "
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run closed-job cleanup
        run: node .github/scripts/cleanup-closed-jobs.js

      - name: Upload cleaned all_jobs.json to R2
        if: success()
        continue-on-error: true
        run: |
          if [ -f .github/data/all_jobs.json ]; then
            echo "📤 Uploading cleaned all_jobs.json to R2..."
            node -e "
            const { createR2Client } = require('./.github/scripts/processing/lib/storage/r2-client');
            const fs = require('fs');
            async function main() {
              const r2 = createR2Client({ prefix: 'data/' });
              const data = fs.readFileSync('.github/data/all_jobs.json', 'utf8');
              await r2.uploadRaw('all_jobs.json', data, 'application/json');
              console.log('R2 upload OK: all_jobs.json');
            }
            main().catch(e => { console.error('R2 fatal: ' + e.message); process.exit(1); });
            "
          fi
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Verify cleanup
        run: |
          if [ -f .github/data/all_jobs.json ]; then
            JOBS=$(wc -l < .github/data/all_jobs.json)
            echo "✅ Pool after cleanup: $JOBS jobs (R2 updated)"
          else
            echo "⚠️ No all_jobs.json found"
          fi
