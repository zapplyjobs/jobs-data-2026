# Clicks Retention — INF-CLICKS-RETENTION-CRON-1
# 180d raw retention on zapply_analytics_clicks (one row per outbound click, no PII).
# Spec final 2026-09-07 per consumer consults: OUT (no forensics need beyond 180d; datacheck
# needs Sep-4-onward; no dedupe interaction) + DASH (panels use windowDays=35; 180d raw more
# than sufficient; no rollup needed for current views). Design basis: research/LINKTRACK_DESIGN_2026_09_04.md s4.
# Pattern: jobs-retention.sh house pattern (export -> R2 -> delete -> reconcile); the R2 export
# is the reconstruction source, so nothing is destroyed unarchived.
#
# FIRST-RUN GATE (purge policy 2026-09-06: first-ever execution of a NEW purge class needs the
# operator word): lands workflow_dispatch-ONLY. The weekly cron line is pre-staged below,
# commented. Operator go => uncomment the schedule block (that is the whole flip).
# mode=dry_run exports + reports WITHOUT deleting — safe to run any time.
#
# BOT-TOOL PURGE (standing policy, operator word 2026-10-23 "clean bot clicks" + 2026-10-23
# directive "why can't we clean bot clicks"): census that day found 3.02M rows of which ~53%
# are tool traffic, not people: Go-http-client/2.0 ~1.37M (45pct of the table), SWE-Radar/1.0
# personal-job-search ~320K, Yartchives/1.0 link-repair ~97K. These are deleted by exact UA
# prefix every run WITHOUT R2 archive (tool noise, zero product value; the archived-export
# reconstruction guarantee stays for human/expired classes). Browser-like rows are never
# touched. Schedule/push events run in execute mode with the 90d window per the 2026-10-19 GO.
# The one-time VACUUM FULL (policy-edit push only) hands the freed space back to the disk.

name: Clicks Retention
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run = export + report only; execute = delete expired rows after export"
        required: true
        default: "dry_run"
        type: choice
        options:
          - dry_run
          - execute
      days:
        description: "Retention window in days (90 = operator GO 2026-10-19 via OUT D129-cont; supersedes the 09-07 180d consult; schedule events use this default)"
        required: true
        default: "90"
        type: string
  schedule:
    - cron: "55 6 * * 1"  # weekly Mondays 06:55Z — ENABLED 2026-10-19 on operator GO relayed via OUT D129-cont (INF-CLICKS-RETENTION-GO-1); first runs same day green: dry_run 38,988 exported, execute deleted=38,988, R2 archive verified
  push:
    paths:
      - .github/workflows/clicks-retention.yml  # policy edits run themselves (standing bot purge; see header)

permissions:
  contents: read

concurrency:
  group: clicks-retention
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RETENTION_DAYS: ${{ github.event.inputs.days || ((github.event_name == 'schedule' || github.event_name == 'push') && '90') || '180' }}
      MODE: ${{ github.event.inputs.mode || ((github.event_name == 'schedule' || github.event_name == 'push') && 'execute') || 'dry_run' }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$RETENTION_DAYS" =~ ^[0-9]+$ ]] || { echo "days must be numeric, got: $RETENTION_DAYS"; exit 1; }
          [[ "$MODE" == "dry_run" || "$MODE" == "execute" ]] || { echo "mode must be dry_run|execute"; exit 1; }
          echo "mode=$MODE window=${RETENTION_DAYS}d"

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -s -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Report expired class
        run: |
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
            -c "SELECT count(*), COALESCE(min(created_at)::date::text,'-'), COALESCE(max(created_at)::date::text,'-') FROM zapply_analytics_clicks WHERE created_at < now() - ($RETENTION_DAYS || ' days')::interval" \
          | while IFS='|' read -r ROWS OLDEST NEWEST; do
              echo "expired class: rows=$ROWS oldest=$OLDEST newest=$NEWEST (cutoff = now() - ${RETENTION_DAYS}d)"
            done
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Export expired class to R2 (reconstruction source — runs before any delete)
        run: |
          DAY=$(date -u +%F)
          mkdir -p export
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -c "\copy (SELECT id, source, landing_page, referrer, user_agent, created_at FROM zapply_analytics_clicks WHERE created_at < now() - ($RETENTION_DAYS || ' days')::interval ORDER BY created_at) TO 'export/clicks-expired-${RETENTION_DAYS}d.csv' WITH (FORMAT csv, HEADER true)"
          wc -l export/*.csv
          aws s3api put-object --bucket "$R2_BUCKET_NAME" \
            --key "clicks-retention/${DAY}/clicks-expired-${RETENTION_DAYS}d.csv" \
            --body "export/clicks-expired-${RETENTION_DAYS}d.csv" \
            --endpoint-url "$R2_ENDPOINT"
          echo "exported -> clicks-retention/${DAY}/clicks-expired-${RETENTION_DAYS}d.csv"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION: auto

      - name: Rotate export files (keep 3 most recent day-folders)
        run: |
          CUTOFF=$(date -u -d "-3 days" +%F)
          aws s3api list-objects-v2 --bucket "$R2_BUCKET_NAME" --prefix "clicks-retention/" \
            --query "Contents[?length(Key)>=14].Key" --output text \
          | while read -r KEY; do
              DAY=$(echo "$KEY" | cut -d/ -f2)
              if [[ "$DAY" < "$CUTOFF" ]]; then
                echo "deleting old export $KEY (older than $CUTOFF)"
                aws s3api delete-object --bucket "$R2_BUCKET_NAME" --key "$KEY" --endpoint-url "$R2_ENDPOINT"
              fi
            done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION: auto

      - name: Purge tool/bot clicks (standing policy — exact UA prefixes only)
        if: env.MODE == 'execute'
        run: |
          BEFORE=$(/usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
            -c "SELECT count(*) FROM zapply_analytics_clicks WHERE user_agent LIKE ANY (ARRAY['Go-http-client/2.0%','SWE-Radar/1.0%','Yartchives/1.0%'])")
          echo "bot class rows before purge: $BEFORE"
          TOTAL=0
          for SLICE in "2000-01-01|2026-08-01" "2026-08-01|2026-09-01" "2026-09-01|2026-10-01" "2026-10-01|2026-10-15" "2026-10-15|2026-10-22" "2026-10-22|2999-01-01"; do
            FROM="${SLICE%%|*}"; TO="${SLICE##*|}"
            DEL=$(/usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
              -c "WITH d AS (DELETE FROM zapply_analytics_clicks WHERE created_at >= '$FROM' AND created_at < '$TO' AND (user_agent LIKE 'Go-http-client/2.0%' OR user_agent LIKE 'SWE-Radar/1.0%' OR user_agent LIKE 'Yartchives/1.0%') RETURNING 1) SELECT count(*) FROM d")
            echo "slice $FROM..$TO deleted=$DEL"
            TOTAL=$((TOTAL + DEL))
          done
          echo "bot purge total deleted=$TOTAL (of $BEFORE)"
          echo "botpurge=$TOTAL" >> "$GITHUB_OUTPUT" || true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Scrutiny fix 2026-10-23: transient copy needs ~1.3GB free disk — NOT free on a routine
      # policy edit. Run ONLY on an explicit [reclaim] sentinel in the push commit message.
      - name: One-time space reclaim (push carrying [reclaim] in the commit message only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[reclaim]')
        run: |
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -c "VACUUM (FULL, ANALYZE) zapply_analytics_clicks"
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -At \
            -c "SELECT pg_size_pretty(pg_total_relation_size('zapply_analytics_clicks'))"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Operator word 2026-10-23: "keep a few clicks each day from each source" - a record for each.
      - name: Delete expired rows, keeping 3 sample rows per source per day
        if: env.MODE == 'execute'
        run: |
          DELETED=$(/usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
            -c "WITH ranked AS (SELECT id, row_number() OVER (PARTITION BY source, date_trunc('day', created_at) ORDER BY id) rn FROM zapply_analytics_clicks WHERE created_at < now() - ($RETENTION_DAYS || ' days')::interval), d AS (DELETE FROM zapply_analytics_clicks c USING ranked r WHERE c.id = r.id AND r.rn > 3 RETURNING 1) SELECT count(*) FROM d")
          REMAINING=$(/usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
            -c "SELECT count(*) FROM zapply_analytics_clicks")
          echo "deleted=${DELETED} remaining=${REMAINING} (expired rows beyond 3 per source per day removed; samples stay forever)"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Clicks retention — ${MODE}, window ${RETENTION_DAYS}d"
            echo "- Expired-class report and export in the steps above; R2 key: clicks-retention/$(date -u +%F)/"
            if [ "$MODE" = "execute" ]; then
              echo "- DELETE executed (deleted/remaining counts in the delete step)."
            else
              echo "- DRY RUN — nothing deleted. Flip to mode=execute on operator word."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
