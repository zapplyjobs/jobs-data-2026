# Clicks Retention — INF-CLICKS-RETENTION-CRON-1
# 180d raw retention on zapply_analytics_clicks (one row per outbound click, no PII).
# Spec final 2026-09-07 per consumer consults: OUT (no forensics need beyond 180d; datacheck
# needs Sep-4-onward; no dedupe interaction) + DASH (panels use windowDays=35; 180d raw more
# than sufficient; no rollup needed for current views). Design basis: research/LINKTRACK_DESIGN_2026_09_04.md s4.
# Pattern: jobs-retention.sh house pattern (export -> R2 -> delete -> reconcile); the R2 export
# is the reconstruction source, so nothing is destroyed unarchived.
#
# FIRST-RUN GATE (purge policy 2026-09-06: first-ever execution of a NEW purge class needs the
# operator word): lands workflow_dispatch-ONLY. The weekly cron line is pre-staged below,
# commented. Operator go => uncomment the schedule block (that is the whole flip).
# mode=dry_run exports + reports WITHOUT deleting — safe to run any time.
#
# BOT-TOOL PURGE (standing policy, operator word 2026-10-23 "clean bot clicks" + 2026-10-23
# directive "why can't we clean bot clicks"): census that day found 3.02M rows of which ~53%
# are tool traffic, not people: Go-http-client/2.0 ~1.37M (45pct of the table), SWE-Radar/1.0
# personal-job-search ~320K, Yartchives/1.0 link-repair ~97K. These are deleted by exact UA
# prefix every run WITHOUT R2 archive (tool noise, zero product value; the archived-export
# reconstruction guarantee stays for human/expired classes). Browser-like rows are never
# touched. Schedule/push events run in execute mode with the 90d window per the 2026-10-19 GO.
# The one-time VACUUM FULL (policy-edit push only) hands the freed space back to the disk.
#
# BOT-CLASS BASELINE ARCHIVE (archive only, deletes nothing): one-time full export of every
# new bot-purge class to clicks-bot-archive-baseline/<stamp>/ — a NON-ROTATED prefix (the
# rotation step enumerates clicks-retention/ only). Slice-exported by primary key id with an
# exact count-parity gate (exported rows == count taken at the export timestamp) and a
# manifest (counts per class, min/max id, export timestamp). Completion marker = manifest
# uploaded LAST; later runs skip while any */manifest.csv exists under the prefix. Holds
# (out-deadlink, curl, personal-job-tracker, career-engine) are excluded from every class.
# Rollback contract: re-import a class file by uuid id (no sequence to fix), then ANALYZE.
#
# BOT-CLASS PURGE (delete): runs ONLY on an explicit workflow_dispatch with mode=execute +
# bot_purge=execute — never on push or schedule. Deletes strictly by primary-key ids proven
# present in the baseline archive (manifest + downloaded line-count verified first), every
# statement capped at the baseline export timestamp; post-baseline regrowth is archived to
# the non-rotated clicks-bot-archive-ongoing/ prefix BEFORE its delete slice, and the last
# slice's upper bound is that export's own timestamp. Per-class reconcile counts are written
# to the run summary. Adding a class at dispatch time requires no code change: pass its name
# in bot_purge_classes (it must already exist in the baseline manifest).

name: Clicks Retention
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run = export + report only; execute = delete expired rows after export"
        required: true
        default: "dry_run"
        type: choice
        options:
          - dry_run
          - execute
      days:
        description: "Retention window in days (90 = operator GO 2026-10-19 via OUT D129-cont; supersedes the 09-07 180d consult; schedule events use this default)"
        required: true
        default: "90"
        type: string
      bot_purge:
        description: "off = never delete the new bot classes; execute = delete archived bot-purge classes by id (requires the baseline archive; ignored unless mode=execute)"
        required: false
        default: "off"
        type: choice
        options:
          - off
          - execute
      bot_purge_classes:
        description: "Comma list of archived classes to purge when bot_purge=execute (selfdeclared is archived and available; add it here when approved)"
        required: false
        default: "null_ua,bare_mozilla,headless,malformed_chrome_ver,malformed_truncated"
        type: string
  schedule:
    - cron: "55 6 * * 1"  # weekly Mondays 06:55Z — ENABLED 2026-10-19 on operator GO relayed via OUT D129-cont (INF-CLICKS-RETENTION-GO-1); first runs same day green: dry_run 38,988 exported, execute deleted=38,988, R2 archive verified
  push:
    paths:
      - .github/workflows/clicks-retention.yml  # policy edits run themselves (standing bot purge; see header)

permissions:
  contents: read

concurrency:
  group: clicks-retention
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-latest
    # 60 min: the one-time baseline export moves ~2.7M rows through primary-key slices
    # (est 10-30 min); routine weekly runs stay well inside it.
    timeout-minutes: 60
    env:
      RETENTION_DAYS: ${{ github.event.inputs.days || ((github.event_name == 'schedule' || github.event_name == 'push') && '90') || '180' }}
      MODE: ${{ github.event.inputs.mode || ((github.event_name == 'schedule' || github.event_name == 'push') && 'execute') || 'dry_run' }}
      BOT_PURGE: ${{ github.event.inputs.bot_purge || 'off' }}
      PURGE_CLASSES: ${{ github.event.inputs.bot_purge_classes || 'null_ua,bare_mozilla,headless,malformed_chrome_ver,malformed_truncated' }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$RETENTION_DAYS" =~ ^[0-9]+$ ]] || { echo "days must be numeric, got: $RETENTION_DAYS"; exit 1; }
          [[ "$MODE" == "dry_run" || "$MODE" == "execute" ]] || { echo "mode must be dry_run|execute"; exit 1; }
          [[ "$BOT_PURGE" == "off" || "$BOT_PURGE" == "execute" ]] || { echo "bot_purge must be off|execute"; exit 1; }
          if [ "$BOT_PURGE" = "execute" ]; then
            # deletes of archived bot classes run ONLY from an explicit dispatch, never on push/schedule
            [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$MODE" == "execute" ]] || { echo "bot_purge=execute requires a manual workflow_dispatch with mode=execute"; exit 1; }
          fi
          echo "mode=$MODE window=${RETENTION_DAYS}d bot_purge=$BOT_PURGE classes=[$PURGE_CLASSES]"

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -s -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      # One-time baseline archive: export-only, never deletes. Idempotent via the manifest
      # completion marker. Exports SIX classes (null_ua, selfdeclared, bare_mozilla,
      # headless, malformed_chrome_ver, malformed_truncated) in primary-key slices with a
      # hard count-parity gate per class. The delete of these classes lives in a SEPARATE,
      # dispatch-gated step (bot_purge=execute) that refuses to run without this manifest.
      - name: Baseline archive of bot-purge classes (export only, one-time)
        run: |
          set -euo pipefail
          PSQL=/usr/lib/postgresql/17/bin/psql
          EXISTS=$(aws s3api list-objects-v2 --bucket "$R2_BUCKET_NAME" --prefix "clicks-bot-archive-baseline/" \
            --query "length(Contents[?ends_with(Key, '/manifest.csv')] || \`[]\`)" --output text --endpoint-url "$R2_ENDPOINT" || true)
          if [ -n "$EXISTS" ] && [ "$EXISTS" != "0" ] && [ "$EXISTS" != "None" ]; then
            echo "baseline archive already present (manifests: $EXISTS) — one-time step, skipping"
            echo "baseline=already-complete" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          EXPORT_TS=$(date -u '+%Y-%m-%d %H:%M:%S+00')
          mkdir -p export/baseline
          MANIFEST="export/baseline/manifest.csv"
          echo "class,forecast,exported,min_id,max_id,export_started_utc" > "$MANIFEST"
          { echo "# bot-purge baseline $STAMP — full WHERE predicate per class, holds excluded everywhere."
            echo "# parity law: exported == forecast (count AS OF export_started_utc) — abort before any delete on mismatch."
          } > export/baseline/predicates.txt
          # Holds as explicit exclusions, applied to EVERY class (coalesce keeps NULL-UA rows).
          NOTHOLD="(NOT (coalesce(user_agent,'') = 'Mozilla/5.0 (out-deadlink/1.0)' OR coalesce(user_agent,'') LIKE 'curl/%' OR coalesce(user_agent,'') LIKE '%personal-job-tracker%' OR coalesce(user_agent,'') LIKE '%career-engine%'))"
          declare -A PRED
          PRED[null_ua]="coalesce(user_agent,'') = ''"
          PRED[selfdeclared]="user_agent ~* '(gaia/|summer2027internshiptracker|meta-webindexer|eternalindexer|searchtern|dailyjobmatchalert|laithearlyjobwatcher|bytespider|python-httpx|python-requests|amazon-quick-on-behalf-of|claude-user|claudebot|bingbot|meta-externalagent|shapbot|reflectionbot|internshipradarbot|publicjobmonitor|gradboard|grepjobs|jobradar/|job-application-agent|job-hq-discovery|job-tracker;|jobbo/|jobdrop|jobsearch-mvp|hiremeforjobs|jobapps-discovery|ilmi/|jobagent/|jobscraper/|jobfetch/|^node\$|^anpc\$|deno/)'"
          PRED[bare_mozilla]="user_agent = 'Mozilla/5.0' AND coalesce(referrer,'') = ''"
          PRED[headless]="user_agent ~* 'headlesschrome' AND coalesce(referrer,'') = ''"
          PRED[malformed_chrome_ver]="user_agent ~ 'Chrome/[0-9]{1,3}(\.[0-9]+){0,2} Safari' AND coalesce(referrer,'') = ''"
          PRED[malformed_truncated]="user_agent LIKE 'Mozilla/5.0%' AND user_agent NOT LIKE '%compatible;%' AND user_agent !~ '(Safari/[0-9]|Firefox/[0-9]|Chrome/[0-9]|Edg[A-Za-z]*/[0-9])' AND coalesce(referrer,'') = ''"
          for CLASS in null_ua selfdeclared bare_mozilla headless malformed_chrome_ver malformed_truncated; do
            WHERE="${PRED[$CLASS]} AND $NOTHOLD AND created_at <= '$EXPORT_TS'"
            FORECAST=$($PSQL "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "SELECT count(*) FROM zapply_analytics_clicks WHERE $WHERE")
            echo "class=$CLASS forecast=$FORECAST (as of $EXPORT_TS)"
            CSV="export/baseline/${CLASS}.csv"
            echo "id,source,landing_page,referrer,user_agent,created_at" > "$CSV"
            LAST=""; TOTAL=0; MIN_ID=""; MAX_ID=""
            while : ; do
              COND="$WHERE"
              if [ -n "$LAST" ]; then COND="$COND AND id > '$LAST'"; fi
              # NOTE: psql -At --csv is tuples-only — NO header row. Never add `tail -n +2`
              # here: it would eat one data row per chunk (caught live 2026-11-28 by the
              # count-parity gate: first chunk exported 49,999/50,824).
              CHUNK=$($PSQL "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At --csv \
                -c "SELECT id, source, landing_page, referrer, user_agent, created_at FROM zapply_analytics_clicks WHERE $COND ORDER BY id LIMIT 50000")
              read -r N FIRST_ID LAST_ID < <(printf '%s' "$CHUNK" | python3 -c 'import sys, csv; rows = list(csv.reader(sys.stdin)); csv.writer(open(sys.argv[1], "a", newline="")).writerows(rows); print(len(rows), rows[0][0] if rows else "-", rows[-1][0] if rows else "-")' "$CSV") || { echo "chunk parse failed for $CLASS"; exit 1; }
              if [ "$N" -eq 0 ]; then break; fi
              TOTAL=$((TOTAL + N))
              if [ -z "$MIN_ID" ]; then MIN_ID="$FIRST_ID"; fi
              MAX_ID="$LAST_ID"; LAST="$LAST_ID"
              echo "  class=$CLASS slice_done total=$TOTAL/$FORECAST"
              if [ "$N" -lt 50000 ]; then break; fi
            done
            if [ "$TOTAL" -ne "$FORECAST" ]; then
              echo "COUNT PARITY FAILED for $CLASS: exported=$TOTAL forecast=$FORECAST — aborting before any delete step"
              exit 1
            fi
            gzip -f "$CSV"
            SZ=$(stat -c%s "$CSV.gz")
            aws s3api put-object --bucket "$R2_BUCKET_NAME" \
              --key "clicks-bot-archive-baseline/${STAMP}/${CLASS}.csv.gz" --body "$CSV.gz" \
              --endpoint-url "$R2_ENDPOINT" >/dev/null
            UP=$(aws s3api head-object --bucket "$R2_BUCKET_NAME" \
              --key "clicks-bot-archive-baseline/${STAMP}/${CLASS}.csv.gz" \
              --query ContentLength --output text --endpoint-url "$R2_ENDPOINT")
            [ "$UP" = "$SZ" ] || { echo "upload verify failed for $CLASS (local=$SZ remote=$UP)"; exit 1; }
            echo "$CLASS,$FORECAST,$TOTAL,$MIN_ID,$MAX_ID,$EXPORT_TS" >> "$MANIFEST"
            { echo "[$CLASS]"; echo "WHERE $WHERE"; } >> export/baseline/predicates.txt
            echo "class=$CLASS archived rows=$TOTAL min_id=$MIN_ID max_id=$MAX_ID"
          done
          # Completion marker: manifest uploaded LAST. A later run skips while it exists.
          aws s3api put-object --bucket "$R2_BUCKET_NAME" \
            --key "clicks-bot-archive-baseline/${STAMP}/manifest.csv" --body "$MANIFEST" \
            --endpoint-url "$R2_ENDPOINT" >/dev/null
          aws s3api put-object --bucket "$R2_BUCKET_NAME" \
            --key "clicks-bot-archive-baseline/${STAMP}/predicates.txt" --body "export/baseline/predicates.txt" \
            --endpoint-url "$R2_ENDPOINT" >/dev/null
          mkdir -p export
          cp "$MANIFEST" export/baseline-summary.csv
          { echo "## Bot-class baseline archive $STAMP (non-rotating prefix clicks-bot-archive-baseline/)"
            cat "$MANIFEST"
          } > export/baseline-summary.txt
          echo "baseline stamp=$STAMP complete — manifest is the completion marker"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION: auto

      # DELETE of the new bot classes — ONLY on an explicit workflow_dispatch with
      # mode=execute + bot_purge=execute. Push/schedule NEVER reach this step. For each
      # selected class: verify the downloaded archive line count against the manifest,
      # delete by exported primary-key ids (10k chunks) capped at the baseline export
      # timestamp with the hold exclusions re-applied per statement, then archive the
      # post-baseline regrowth to the non-rotated clicks-bot-archive-ongoing/ prefix
      # BEFORE deleting it in one slice whose upper bound is that export's timestamp.
      # Per-class reconcile counts go to the run summary. Rollback: re-import the
      # archived CSV by uuid id, then ANALYZE.
      - name: Purge archived bot classes (dispatch only, id-based, archive-verified)
        if: env.MODE == 'execute' && env.BOT_PURGE == 'execute' && github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          PSQL=/usr/lib/postgresql/17/bin/psql
          NOTHOLD="(NOT (coalesce(user_agent,'') = 'Mozilla/5.0 (out-deadlink/1.0)' OR coalesce(user_agent,'') LIKE 'curl/%' OR coalesce(user_agent,'') LIKE '%personal-job-tracker%' OR coalesce(user_agent,'') LIKE '%career-engine%'))"
          declare -A PRED
          PRED[null_ua]="coalesce(user_agent,'') = ''"
          PRED[selfdeclared]="user_agent ~* '(gaia/|summer2027internshiptracker|meta-webindexer|eternalindexer|searchtern|dailyjobmatchalert|laithearlyjobwatcher|bytespider|python-httpx|python-requests|amazon-quick-on-behalf-of|claude-user|claudebot|bingbot|meta-externalagent|shapbot|reflectionbot|internshipradarbot|publicjobmonitor|gradboard|grepjobs|jobradar/|job-application-agent|job-hq-discovery|job-tracker;|jobbo/|jobdrop|jobsearch-mvp|hiremeforjobs|jobapps-discovery|ilmi/|jobagent/|jobscraper/|jobfetch/|^node\$|^anpc\$|deno/)'"
          PRED[bare_mozilla]="user_agent = 'Mozilla/5.0' AND coalesce(referrer,'') = ''"
          PRED[headless]="user_agent ~* 'headlesschrome' AND coalesce(referrer,'') = ''"
          PRED[malformed_chrome_ver]="user_agent ~ 'Chrome/[0-9]{1,3}(\.[0-9]+){0,2} Safari' AND coalesce(referrer,'') = ''"
          PRED[malformed_truncated]="user_agent LIKE 'Mozilla/5.0%' AND user_agent NOT LIKE '%compatible;%' AND user_agent !~ '(Safari/[0-9]|Firefox/[0-9]|Chrome/[0-9]|Edg[A-Za-z]*/[0-9])' AND coalesce(referrer,'') = ''"
          mkdir -p export/purge-tmp export/ongoing
          echo "class,baseline_exported,baseline_deleted,already_missing,regrowth_exported,regrowth_deleted,residual_after" > export/reconcile.csv
          RT_STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          RT_TS=$(date -u '+%Y-%m-%d %H:%M:%S+00')
          OM="export/ongoing/manifest.csv"
          echo "class,forecast,exported,min_id,max_id,export_started_utc" > "$OM"
          KEY=$(aws s3api list-objects-v2 --bucket "$R2_BUCKET_NAME" --prefix "clicks-bot-archive-baseline/" \
            --query "reverse(sort(Contents[?ends_with(Key, '/manifest.csv')].Key || \`[]\`))[0]" --output text --endpoint-url "$R2_ENDPOINT" || true)
          if [ -z "$KEY" ] || [ "$KEY" = "None" ]; then
            echo "REFUSING: no baseline manifest under clicks-bot-archive-baseline/ — the archive commit must land and complete first"; exit 1
          fi
          STAMP=$(echo "$KEY" | cut -d/ -f2)
          aws s3api get-object --bucket "$R2_BUCKET_NAME" --key "$KEY" --endpoint-url "$R2_ENDPOINT" export/baseline-manifest.csv >/dev/null
          echo "baseline stamp=$STAMP — purging classes: $PURGE_CLASSES"
          IFS=',' read -ra SELECTED <<< "$PURGE_CLASSES"
          for CLASS in "${SELECTED[@]}"; do
            ROW=$(awk -F, -v c="$CLASS" '$1==c{print; exit}' export/baseline-manifest.csv)
            if [ -z "$ROW" ]; then echo "REFUSING: class '$CLASS' not in baseline manifest"; exit 1; fi
            EXPORTED=$(echo "$ROW" | cut -d, -f3)
            MIN_ID=$(echo "$ROW" | cut -d, -f4)
            MAX_ID=$(echo "$ROW" | cut -d, -f5)
            BASELINE_TS=$(echo "$ROW" | cut -d, -f6)
            WHERE="${PRED[$CLASS]} AND $NOTHOLD"
            aws s3api get-object --bucket "$R2_BUCKET_NAME" --key "clicks-bot-archive-baseline/${STAMP}/${CLASS}.csv.gz" --endpoint-url "$R2_ENDPOINT" export/purge-tmp/${CLASS}.csv.gz >/dev/null
            gunzip -f export/purge-tmp/${CLASS}.csv.gz
            LOCAL_N=$(python3 -c 'import csv, sys; print(sum(1 for _ in csv.reader(open(sys.argv[1]))) - 1)' export/purge-tmp/${CLASS}.csv)
            if [ "$LOCAL_N" -ne "$EXPORTED" ]; then
              echo "REFUSING: $CLASS archive holds $LOCAL_N rows, manifest says $EXPORTED"; exit 1
            fi
            echo "class=$CLASS baseline=$EXPORTED rows (min=$MIN_ID max=$MAX_ID, exported_at=$BASELINE_TS) — deleting by exported id"
            tail -n +2 export/purge-tmp/${CLASS}.csv | cut -d, -f1 > export/purge-tmp/${CLASS}.ids
            DELETED=0
            for CHUNKFILE in $(split -l 10000 export/purge-tmp/${CLASS}.ids export/purge-tmp/${CLASS}.chunk_); do
              IDS=$(sed "s/^/'/; s/\$/'/" "$CHUNKFILE" | paste -sd, -)
              DEL=$($PSQL "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
                -c "WITH d AS (DELETE FROM zapply_analytics_clicks WHERE id = ANY(ARRAY[$IDS]::uuid[]) AND created_at <= '$BASELINE_TS' AND $NOTHOLD RETURNING 1) SELECT count(*) FROM d")
              DELETED=$((DELETED + DEL))
              rm -f "$CHUNKFILE"
            done
            echo "  class=$CLASS baseline ids deleted=$DELETED already_missing=$((EXPORTED - DELETED))"
            RCOUNT=$($PSQL "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
              -c "SELECT count(*) FROM zapply_analytics_clicks WHERE $WHERE AND created_at > '$BASELINE_TS' AND created_at <= '$RT_TS'")
            RDEL=0; REXP=0
            if [ "$RCOUNT" -gt 0 ]; then
              echo "  class=$CLASS regrowth rows=$RCOUNT since baseline — archiving before delete"
              RCSV="export/ongoing/${CLASS}.csv"
              echo "id,source,landing_page,referrer,user_agent,created_at" > "$RCSV"
              LAST=""; RMIN=""; RMAX=""; REXP=0
              while : ; do
                COND="$WHERE AND created_at > '$BASELINE_TS' AND created_at <= '$RT_TS'"
                if [ -n "$LAST" ]; then COND="$COND AND id > '$LAST'"; fi
                # tuples-only CSV: no header row — never strip a "header" here
                CHUNK=$($PSQL "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At --csv \
                  -c "SELECT id, source, landing_page, referrer, user_agent, created_at FROM zapply_analytics_clicks WHERE $COND ORDER BY id LIMIT 10000")
                read -r N FIRST_ID LAST_ID < <(printf '%s' "$CHUNK" | python3 -c 'import sys, csv; rows = list(csv.reader(sys.stdin)); csv.writer(open(sys.argv[1], "a", newline="")).writerows(rows); print(len(rows), rows[0][0] if rows else "-", rows[-1][0] if rows else "-")' "$RCSV") || { echo "regrowth chunk parse failed for $CLASS"; exit 1; }
                if [ "$N" -eq 0 ]; then break; fi
                REXP=$((REXP + N))
                if [ -z "$RMIN" ]; then RMIN="$FIRST_ID"; fi
                RMAX="$LAST_ID"; LAST="$LAST_ID"
                if [ "$N" -lt 10000 ]; then break; fi
              done
              if [ "$REXP" -ne "$RCOUNT" ]; then
                echo "COUNT PARITY FAILED for $CLASS regrowth: exported=$REXP forecast=$RCOUNT — aborting before its delete"; exit 1
              fi
              gzip -f "$RCSV"
              aws s3api put-object --bucket "$R2_BUCKET_NAME" \
                --key "clicks-bot-archive-ongoing/${RT_STAMP}/${CLASS}.csv.gz" --body "$RCSV.gz" \
                --endpoint-url "$R2_ENDPOINT" >/dev/null
              UP=$(aws s3api head-object --bucket "$R2_BUCKET_NAME" \
                --key "clicks-bot-archive-ongoing/${RT_STAMP}/${CLASS}.csv.gz" \
                --query ContentLength --output text --endpoint-url "$R2_ENDPOINT")
              SZ=$(stat -c%s "$RCSV.gz")
              [ "$UP" = "$SZ" ] || { echo "upload verify failed for $CLASS regrowth"; exit 1; }
              echo "$CLASS,$RCOUNT,$REXP,$RMIN,$RMAX,$RT_TS" >> "$OM"
              RDEL=$($PSQL "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
                -c "WITH d AS (DELETE FROM zapply_analytics_clicks WHERE $WHERE AND created_at > '$BASELINE_TS' AND created_at <= '$RT_TS' RETURNING 1) SELECT count(*) FROM d")
              if [ "$RDEL" -ne "$RCOUNT" ]; then
                echo "RECONCILE FAILED for $CLASS regrowth: deleted=$RDEL archived=$RCOUNT"; exit 1
              fi
              rm -f "$RCSV.gz"
              echo "  class=$CLASS regrowth archived=$REXP deleted=$RDEL"
            fi
            RESIDUAL=$($PSQL "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
              -c "SELECT count(*) FROM zapply_analytics_clicks WHERE $WHERE")
            echo "$CLASS,$EXPORTED,$DELETED,$((EXPORTED - DELETED)),$REXP,$RDEL,$RESIDUAL" >> export/reconcile.csv
            rm -f export/purge-tmp/${CLASS}.csv export/purge-tmp/${CLASS}.ids
          done
          OKEY=$(awk 'NR>1{c++} END{print c+0}' "$OM")
          if [ "$OKEY" -gt 0 ]; then
            aws s3api put-object --bucket "$R2_BUCKET_NAME" \
              --key "clicks-bot-archive-ongoing/${RT_STAMP}/manifest.csv" --body "$OM" \
              --endpoint-url "$R2_ENDPOINT" >/dev/null
          fi
          rmdir export/purge-tmp 2>/dev/null || true
          { echo "## Bot-class purge reconcile (baseline $STAMP, ongoing archive ${RT_STAMP})"
            cat export/reconcile.csv
            echo "already_missing = archived ids already gone via the expired-class path (>90d); residual_after = rows matching class predicate post-purge (post-timestamp inserts only)"
          } > export/reconcile.txt
          cat export/reconcile.txt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION: auto

      - name: Report expired class
        run: |
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
            -c "SELECT count(*), COALESCE(min(created_at)::date::text,'-'), COALESCE(max(created_at)::date::text,'-') FROM zapply_analytics_clicks WHERE created_at < now() - ($RETENTION_DAYS || ' days')::interval" \
          | while IFS='|' read -r ROWS OLDEST NEWEST; do
              echo "expired class: rows=$ROWS oldest=$OLDEST newest=$NEWEST (cutoff = now() - ${RETENTION_DAYS}d)"
            done
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Export expired class to R2 (reconstruction source — runs before any delete)
        run: |
          DAY=$(date -u +%F)
          mkdir -p export
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -c "\copy (SELECT id, source, landing_page, referrer, user_agent, created_at FROM zapply_analytics_clicks WHERE created_at < now() - ($RETENTION_DAYS || ' days')::interval ORDER BY created_at) TO 'export/clicks-expired-${RETENTION_DAYS}d.csv' WITH (FORMAT csv, HEADER true)"
          wc -l export/*.csv
          aws s3api put-object --bucket "$R2_BUCKET_NAME" \
            --key "clicks-retention/${DAY}/clicks-expired-${RETENTION_DAYS}d.csv" \
            --body "export/clicks-expired-${RETENTION_DAYS}d.csv" \
            --endpoint-url "$R2_ENDPOINT"
          echo "exported -> clicks-retention/${DAY}/clicks-expired-${RETENTION_DAYS}d.csv"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION: auto

      - name: Rotate export files (keep 3 most recent day-folders)
        run: |
          CUTOFF=$(date -u -d "-3 days" +%F)
          aws s3api list-objects-v2 --bucket "$R2_BUCKET_NAME" --prefix "clicks-retention/" \
            --query "Contents[?length(Key)>=14].Key" --output text \
          | while read -r KEY; do
              DAY=$(echo "$KEY" | cut -d/ -f2)
              if [[ "$DAY" < "$CUTOFF" ]]; then
                echo "deleting old export $KEY (older than $CUTOFF)"
                aws s3api delete-object --bucket "$R2_BUCKET_NAME" --key "$KEY" --endpoint-url "$R2_ENDPOINT"
              fi
            done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION: auto

      - name: Purge tool/bot clicks (standing policy — exact UA prefixes only)
        if: env.MODE == 'execute'
        run: |
          BEFORE=$(/usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
            -c "SELECT count(*) FROM zapply_analytics_clicks WHERE user_agent LIKE ANY (ARRAY['Go-http-client/2.0%','SWE-Radar/1.0%','Yartchives/1.0%'])")
          echo "bot class rows before purge: $BEFORE"
          TOTAL=0
          for SLICE in "2000-01-01|2026-08-01" "2026-08-01|2026-09-01" "2026-09-01|2026-10-01" "2026-10-01|2026-10-15" "2026-10-15|2026-10-22" "2026-10-22|2999-01-01"; do
            FROM="${SLICE%%|*}"; TO="${SLICE##*|}"
            DEL=$(/usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
              -c "WITH d AS (DELETE FROM zapply_analytics_clicks WHERE created_at >= '$FROM' AND created_at < '$TO' AND (user_agent LIKE 'Go-http-client/2.0%' OR user_agent LIKE 'SWE-Radar/1.0%' OR user_agent LIKE 'Yartchives/1.0%') RETURNING 1) SELECT count(*) FROM d")
            echo "slice $FROM..$TO deleted=$DEL"
            TOTAL=$((TOTAL + DEL))
          done
          echo "bot purge total deleted=$TOTAL (of $BEFORE)"
          echo "botpurge=$TOTAL" >> "$GITHUB_OUTPUT" || true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Scrutiny fix 2026-10-23: transient copy needs ~1.3GB free disk — NOT free on a routine
      # policy edit. Run ONLY on an explicit [reclaim] sentinel in the push commit message.
      - name: One-time space reclaim (push carrying [reclaim] in the commit message only)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[reclaim]')
        run: |
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -c "VACUUM (FULL, ANALYZE) zapply_analytics_clicks"
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -At \
            -c "SELECT pg_size_pretty(pg_total_relation_size('zapply_analytics_clicks'))"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Operator word 2026-10-23: "keep a few clicks each day from each source" - a record for each.
      - name: Delete expired rows, keeping 3 sample rows per source per day
        if: env.MODE == 'execute'
        run: |
          DELETED=$(/usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
            -c "WITH ranked AS (SELECT id, row_number() OVER (PARTITION BY source, date_trunc('day', created_at) ORDER BY id) rn FROM zapply_analytics_clicks WHERE created_at < now() - ($RETENTION_DAYS || ' days')::interval), d AS (DELETE FROM zapply_analytics_clicks c USING ranked r WHERE c.id = r.id AND r.rn > 3 RETURNING 1) SELECT count(*) FROM d")
          REMAINING=$(/usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At \
            -c "SELECT count(*) FROM zapply_analytics_clicks")
          echo "deleted=${DELETED} remaining=${REMAINING} (expired rows beyond 3 per source per day removed; samples stay forever)"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Clicks retention — ${MODE}, window ${RETENTION_DAYS}d"
            echo "- Expired-class report and export in the steps above; R2 key: clicks-retention/$(date -u +%F)/"
            if [ -f export/baseline-summary.txt ]; then
              cat export/baseline-summary.txt
            fi
            if [ -f export/reconcile.txt ]; then
              cat export/reconcile.txt
            fi
            if [ "$MODE" = "execute" ]; then
              echo "- DELETE executed (deleted/remaining counts in the delete step)."
            else
              echo "- DRY RUN — nothing deleted. Flip to mode=execute on operator word."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
