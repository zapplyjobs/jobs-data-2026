name: Fix Discord dedup by jobId

on:
  repository_dispatch:
    types: [fix-discord-dedup]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/key
          rm /tmp/key

      - name: Patch manager
        run: |
          echo "" | base64 -d > /tmp/patch_mgr.py
          python3 /tmp/patch_mgr.py

      - name: Patch poster
        run: |
          echo "" | base64 -d > /tmp/patch_poster.py
          python3 /tmp/patch_poster.py

      - name: Syntax check
        run: |
          node -c .github/scripts/src/data/global-dedupe-manager.js && echo "Manager syntax OK"
          node -c .github/scripts/discord-poster.js && echo "Poster syntax OK"

      - name: Verify changes
        run: |
          grep -n "hasJobIdBeenPosted" .github/scripts/src/data/global-dedupe-manager.js | head -3
          grep -n "hasJobIdBeenPosted\|jobId first" .github/scripts/discord-poster.js | head -3

      - name: Commit through git-crypt
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          git add .github/scripts/src/data/global-dedupe-manager.js .github/scripts/discord-poster.js
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "fix(out-27): dedup by jobId — prevents WD multi-location duplicates"
          for i in 1 2 3; do
            git -c filter.git-crypt.smudge=cat -c filter.git-crypt.clean=cat -c filter.git-crypt.required=false pull --rebase origin main && git push && break
            sleep 5
          done

      - name: Self-cleanup
        run: |
          git rm .github/workflows/fix-discord-dedup.yml
          git commit -m "chore: remove temp fix-discord-dedup workflow [skip ci]"
          for i in 1 2 3; do
            git -c filter.git-crypt.smudge=cat -c filter.git-crypt.clean=cat -c filter.git-crypt.required=false pull --rebase origin main && git push && break
            sleep 5
          done
