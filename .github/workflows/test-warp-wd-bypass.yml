name: Test WARP for WD/LabCorp IP block bypass
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-warp-wd-bypass.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baseline — WD URL without WARP
        run: |
          echo "=== BASELINE (no WARP) ==="
          for url in \
            "https://wellsfargo.wd1.myworkdayjobs.com/wday/cxs/en-US/wf/jobs" \
            "https://labcorp.wd3.myworkdayjobs.com/wday/cxs/en-US/labcorp/jobs"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" 2>/dev/null)
            echo "  $url → HTTP $code"
          done
      - name: Install + connect WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          warp-cli registration new --accept-tos
          warp-cli connect
          sleep 5
          echo "=== WARP status ==="
          curl -s https://cloudflare.com/cdn-cgi/trace | grep -E '^warp=|^ip='
      - name: Test — WD URL with WARP
        run: |
          echo "=== WITH WARP ==="
          for url in \
            "https://wellsfargo.wd1.myworkdayjobs.com/wday/cxs/en-US/wf/jobs" \
            "https://labcorp.wd3.myworkdayjobs.com/wday/cxs/en-US/labcorp/jobs"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" 2>/dev/null)
            echo "  $url → HTTP $code"
          done
