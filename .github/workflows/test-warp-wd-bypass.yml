name: Test WARP on GHA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-warp-wd-bypass.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pre-WARP IP
        run: |
          echo "=== BEFORE WARP ==="
          curl -s https://cloudflare.com/cdn-cgi/trace | grep -E '^warp=|^ip='
      - name: Install + connect WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          warp-cli registration new --accept-tos
          warp-cli connect
          sleep 5
      - name: Post-WARP IP + WD test
        run: |
          echo "=== AFTER WARP ==="
          curl -s https://cloudflare.com/cdn-cgi/trace | grep -E '^warp=|^ip='
          echo ""
          echo "=== WD API test (any tenant — checks CF Bot Management) ==="
          curl -s -o /dev/null -w "HTTP %{http_code}" --max-time 15 "https://acme.wd1.myworkdayjobs.com/wday/cxs/acme/Acme/jobs" || echo " FAILED"
          echo ""
          curl -s -o /dev/null -w "HTTP %{http_code}" --max-time 15 "https://pfizer.wd1.myworkdayjobs.com/wday/cxs/pfizer/PfizerCareers/jobs" || echo " FAILED"
