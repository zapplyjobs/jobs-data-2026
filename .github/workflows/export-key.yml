name: Export git-crypt key (one-time)
on: workflow_dispatch
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Decode key
        run: echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/git-crypt-key
      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-crypt-key
          path: /tmp/git-crypt-key
          retention-days: 1
