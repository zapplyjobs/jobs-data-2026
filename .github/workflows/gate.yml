name: Gate

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive  # INF-DEPRESOLUTION-ANALYZER-1: the dep-resolution check walks processing submodule scripts
          token: ${{ secrets.GH_PAT }}

      - name: Install transcrypt (dep-resolution check reads encrypted script requires)
        run: |
          # INF-UNLOCK-INTERMITTENT-1: -sSL without -f silently installs raw.github's 429
          # rate-limit PAGE as the binary (observed 2026-08-17: 8 workflow failures in a 80-min
          # throttled window). Fail on HTTP errors, retry 3x, and verify it's a script.
          for i in 1 2 3; do
            curl -sfSL "https://raw.githubusercontent.com/elasticdog/transcrypt/5effa13/transcrypt" -o /tmp/transcrypt && break
            echo "transcrypt download attempt $i failed — retrying in 15s"; sleep 15
          done
          [ -s /tmp/transcrypt ] || { echo "::error::transcrypt download failed after retries"; exit 1; }
          head -c2 /tmp/transcrypt | grep -q '#!' || { echo "::error::transcrypt download is not a script (rate-limit page?) — refusing to install"; exit 1; }
          chmod +x /tmp/transcrypt
          sudo mv /tmp/transcrypt /usr/local/bin/transcrypt

      - name: Unlock encrypted files
        run: |
          echo "Y" | transcrypt --cipher aes-256-cbc --password "$TRANSCRYPT_PASSWORD" --force
          git checkout -- .
          git submodule foreach --recursive '
            echo "Y" | transcrypt --cipher aes-256-cbc --password "'"$TRANSCRYPT_PASSWORD"'" --force 2>/dev/null || true
            rm -f "$(git rev-parse --git-dir)/index" 2>/dev/null || true
            git checkout HEAD -- . 2>/dev/null || true
          ' || true
          git submodule sync --recursive
          git submodule update --init --recursive
        env:
          TRANSCRYPT_PASSWORD: ${{ secrets.TRANSCRYPT_PASSWORD }}


      - name: Check for large files (>5MB)
        run: |
          LARGE_FILES=$(find . -not -path './.git/*' -not -path '*/node_modules/*' -type f -size +5M 2>/dev/null)
          if [ -n "$LARGE_FILES" ]; then
            echo "::error::Files larger than 5MB detected — use R2 or Git LFS instead of committing:"
            echo "$LARGE_FILES" | while read f; do
              SIZE=$(du -h "$f" | cut -f1)
              echo "::error::$SIZE $f"
            done
            exit 1
          else
            echo "✅ No files larger than 5MB"
          fi

      - name: Check for data files in public repo
        run: |
          DATA_FILES=$(find .github/data -type f ! -name '.gitkeep' 2>/dev/null || true)
          if [ -n "$DATA_FILES" ]; then
            echo "::error::Data files detected in .github/data/ — these belong in R2/Supabase, not public git:"
            echo "$DATA_FILES" | while read f; do echo "::error::$f"; done
            echo "If this file MUST be in git, add an exception in this check."
            exit 1
          else
            echo "✅ No data files in .github/data/"
          fi

      - name: DASH aspect verifier unit tests
        run: python3 .github/scripts/verify-dash-aspect-status.test.py

      - name: Dependency-resolution check (INF-DEPRESOLUTION-ANALYZER-1 — blocks the silent-missing-module class)
        run: python3 .github/scripts/dep-resolution-check.py
