name: Fix daily-stats.js bugs

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > /tmp/key
          sudo apt-get install -y git-crypt -q
          git-crypt unlock /tmp/key
          rm /tmp/key

      - name: Apply fixes to daily-stats.js
        run: |
          FILE=".github/scripts/daily-stats.js"
          
          # Bug 3: Nursing → Healthcare (line 56 area)
          sed -i "s/label: 'Nursing'/label: 'Healthcare'/" "$FILE"
          
          # Bug 2: Repo name truncation — slice(0, 40) is too short for 43-char names
          sed -i "s/name.slice(0, 40).padEnd(40)/name.slice(0, 45).padEnd(45)/" "$FILE"
          
          # Bug 4: Missing 3 sources — add smartrecruiters, netflix, eightfold
          sed -i "s/\['workday','greenhouse','amazon','ashby','lever','jsearch'\]/['workday','greenhouse','amazon','ashby','lever','jsearch','smartrecruiters','netflix','eightfold']/" "$FILE"
          
          echo "=== Verify fixes ==="
          grep -n "Healthcare\|slice(0, 45)\|smartrecruiters" "$FILE" || echo "WARNING: fixes not found"

      - name: Commit through git-crypt filters
        run: |
          git config user.email "bot@zapplyjobs.com"
          git config user.name "Aggregator Bot"
          git add .github/scripts/daily-stats.js
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "fix(out-18): daily report bugs — Healthcare label, name truncation, missing sources"
          for i in 1 2 3; do
            git -c filter.git-crypt.smudge=cat -c filter.git-crypt.clean=cat -c filter.git-crypt.required=false pull --rebase origin main && git push && break
            echo "Retry $i..."
            sleep 5
          done

      - name: Self-cleanup — remove this workflow
        run: |
          git rm .github/workflows/fix-daily-stats.yml
          git commit -m "chore: remove temp fix-daily-stats workflow [skip ci]"
          for i in 1 2 3; do
            git -c filter.git-crypt.smudge=cat -c filter.git-crypt.clean=cat -c filter.git-crypt.required=false pull --rebase origin main && git push && break
            sleep 5
          done
